name: Build Kernel - Neutron Clang

on:
  workflow_dispatch:
  push:
    branches: [zycromerz]

env:
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic"
  KERNEL_VARIANT: "Neutron Dynamic"
  KERNEL_SUPPORT: "Android 15.0-16.0"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  ARCH: "arm64"
  KBUILD_BUILD_HOST: "GitHub-Actions"
  KBUILD_BUILD_USER: "Neutron-Builder"
  ANYKERNEL_REPO: "https://github.com/Joker-V2/AnyKernel3"
  ANYKERNEL_BRANCH: "sixteen"
  ZIPSIGNER_URL: "https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar"

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: 📥 Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: zycromerz
        fetch-depth: 1
    
    - name: ⚙️ Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd \
          binutils-aarch64-linux-gnu \
          device-tree-compiler \
          lz4 xz-utils zlib1g-dev \
          openjdk-17-jdk \
          python-is-python3 \
          p7zip-full \
          android-sdk-libsparse-utils \
          erofs-utils \
          gnupg \
          gperf \
          libx11-dev \
          libreadline-dev \
          libgl1 libgl1-mesa-dev \
          python3-markdown \
          libxml2-utils xsltproc \
          libtinfo6 \
          cpio kmod openssl pahole \
          libarchive-tools rsync \
          util-linux 
        
        echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV
        echo "OBJ_DIR=$(pwd)/out" >> $GITHUB_ENV
        echo "ANYKERNEL_DIR=$(pwd)/anykernel" >> $GITHUB_ENV
        echo "TOOLCHAIN_DIR=$(pwd)/toolchains/neutron-clang" >> $GITHUB_ENV
        
        # إعداد ccache
        ccache --max-size=5G
        ccache --set-config=sloppiness=pch_defines,time_macros
        
        # Display build info
        cores=$(nproc --all)
        time=$(TZ="Asia/Riyadh" date "+%Y-%m-%d %H:%M:%S")
        commit_head=$(git log --oneline -1)
        
        echo "🚀 Build Triggered ⌛"
        echo "Kernel: ${{ env.KERNEL_NAME }}"
        echo "Support: ${{ env.KERNEL_SUPPORT }}"
        echo "Variant: ${{ env.KERNEL_VARIANT }}"
        echo "Cores: ${cores}"
        echo "Time: ${time}"
        echo "Last Commit: ${commit_head}"
        echo "CCache: 5GB enabled"
    
    - name: 🔧 Setup Neutron Clang
      run: |
        echo "🔧 Setting up Neutron Clang..."
        
        mkdir -p "${{ env.TOOLCHAIN_DIR }}"
        cd "${{ env.TOOLCHAIN_DIR }}"
        
        # تحميل AntMan
        curl -sSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
        chmod +x antman
        
        # سحب آخر إصدار Neutron Clang
        echo "📥 Downloading Neutron Clang..."
        ./antman -S 2>&1 | grep -v "Broken pipe" || true
        
        # التحقق
        if [ -f "bin/clang" ]; then
          echo "✅ Neutron Clang ready"
          echo "CLANG_PATH=${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_ENV
          echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
        else
          echo "❌ Neutron Clang setup failed"
          exit 1
        fi
    
    - name: 🏗️ Build Kernel
      run: |
        START_TIME=$(date +"%s")
        
        echo "🧹 Cleaning build directory..."
        rm -rf "${{ env.OBJ_DIR }}"
        mkdir -p "${{ env.OBJ_DIR }}"
        
        # ──────────────────────────────────────────────
        # ⚡⚡⚡ الطريقة الصحيحة بناءً على السكريبت الناجح ⚡⚡⚡
        # ──────────────────────────────────────────────
        
        echo ""
        echo "########### Generating Defconfig ############"
        
        # ═══════════════════════════════════════════════════
        # ✅ الطريقة الصحيحة: استخدام ARCH و O قبل config
        # ═══════════════════════════════════════════════════
        make -s \
          ARCH="${{ env.ARCH }}" \
          O="${{ env.OBJ_DIR }}" \
          "${{ env.CONFIG_FILE }}" \
          -j$(nproc --all)
        
        if [ $? -eq 0 ]; then
          echo "✅ Defconfig generated successfully: ${{ env.CONFIG_FILE }}"
        else
          echo "❌ Defconfig generation failed"
          echo "Config file: ${{ env.CONFIG_FILE }}"
          exit 1
        fi
        
        echo ""
        echo "######### Compiling kernel with Neutron Clang #########"
        
        # ═══════════════════════════════════════════════════
        # ✅ بناء الكيرنل بمتغيرات Neutron المطلوبة
        # ═══════════════════════════════════════════════════
        make -j$(nproc --all) \
          O="${{ env.OBJ_DIR }}" \
          ARCH="${{ env.ARCH }}" \
          CC="ccache clang" \
          AR="llvm-ar" \
          NM="llvm-nm" \
          OBJCOPY="llvm-objcopy" \
          OBJDUMP="llvm-objdump" \
          STRIP="llvm-strip" \
          LD="ld.lld" \
          CROSS_COMPILE="aarch64-linux-gnu-" \
          CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          LLVM=1 \
          LLVM_IAS=1 \
          KBUILD_BUILD_USER="${{ env.KBUILD_BUILD_USER }}" \
          KBUILD_BUILD_HOST="${{ env.KBUILD_BUILD_HOST }}" \
          2>&1 | tee build.log
        
        # التحقق من النجاح
        COMPILED_IMAGE="${{ env.OBJ_DIR }}/arch/arm64/boot/Image"
        COMPILED_IMAGE_GZ="${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz"
        COMPILED_DTBO="${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img"
        
        if [[ -f "${COMPILED_IMAGE}" || -f "${COMPILED_IMAGE_GZ}" ]]; then
          echo "🎉 Kernel compiled successfully ✅"
          END_TIME=$(date +"%s")
          DIFF=$((END_TIME - START_TIME))
          echo "⏱️  Compilation took: $((DIFF / 60)) minute(s) and $((DIFF % 60)) second(s)"
          
          # عرض حجم الملفات
          echo ""
          echo "📁 Build output:"
          ls -lh "${{ env.OBJ_DIR }}/arch/arm64/boot/" | grep -E "Image|dtbo"
          
          # إحصائيات CCache
          echo ""
          echo "📊 CCache Statistics:"
          ccache -s
        else
          echo "❌ Compilation failed - Kernel image not found"
          echo "Last 50 lines of build log:"
          tail -50 build.log
          exit 1
        fi
    
    - name: 📦 Package Kernel
      run: |
        START_TIME=$(date +"%s")
        
        # تحديد ملف الكيرنل
        if [ -f "${{ env.OBJ_DIR }}/arch/arm64/boot/Image" ]; then
          ZIMAGE="${{ env.OBJ_DIR }}/arch/arm64/boot/Image"
        elif [ -f "${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz" ]; then
          ZIMAGE="${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz"
        else
          echo "❌ No kernel image found!"
          exit 1
        fi
        
        DTBO="${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img"
        ZIP_NAME="${{ env.KERNEL_NAME }}-neutron-$(date +"%Y%m%d-%H%M").zip"
        
        # Clone AnyKernel3
        rm -rf "${{ env.ANYKERNEL_DIR }}"
        git clone -q \
          "${{ env.ANYKERNEL_REPO }}" \
          -b "${{ env.ANYKERNEL_BRANCH }}" \
          "${{ env.ANYKERNEL_DIR }}"
        
        # Copy kernel files
        cp -f "${ZIMAGE}" "${{ env.ANYKERNEL_DIR }}/"
        if [ -f "${DTBO}" ]; then
          cp -f "${DTBO}" "${{ env.ANYKERNEL_DIR }}/"
        fi
        
        # Create zip
        cd "${{ env.ANYKERNEL_DIR }}"
        zip -r -9 AnyKernel.zip * -x ".git/*"
        mv AnyKernel.zip "${ZIP_NAME}"
        
        # Sign the zip
        echo "🔏 Signing build..."
        cd "${{ env.KERNEL_DIR }}"
        if [ ! -f zipsigner-3.0.jar ]; then
          wget -q -O zipsigner-3.0.jar "${{ env.ZIPSIGNER_URL }}"
        fi
        
        java -jar zipsigner-3.0.jar \
          "${{ env.ANYKERNEL_DIR }}/${ZIP_NAME}" \
          "${ZIP_NAME/.zip/-signed.zip}"
        
        SIGNED_ZIP="${ZIP_NAME/.zip/-signed.zip}"
        
        END_TIME=$(date +"%s")
        DIFF=$((END_TIME - START_TIME))
        
        echo "############################################"
        echo "🚀 Build Complete"
        echo "############################################"
        echo "Total packaging time: $((DIFF / 60))m $((DIFF % 60))s"
        echo "Toolchain: Neutron Clang"
        echo "Build file: ${SIGNED_ZIP}"
        echo "############################################"
        
        # حفظ اسم الملف النهائي
        echo "FINAL_ZIP=${SIGNED_ZIP}" >> $GITHUB_ENV
    
    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-neutron-${{ env.KERNEL_NAME }}-$(date +'%Y%m%d-%H%M')
        path: |
          ${{ env.KERNEL_DIR }}/*-signed.zip
          ${{ env.KERNEL_DIR }}/build.log
          ${{ env.OBJ_DIR }}/arch/arm64/boot/Image*
          ${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img
        retention-days: 30
