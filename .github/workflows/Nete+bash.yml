name: Build Kernel - Neutron Clang

on:
  workflow_dispatch:
  push:
    branches: [zycromerz]

env:
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic"
  KERNEL_VARIANT: "Neutron Dynamic"
  KERNEL_SUPPORT: "Android 15.0-16.0"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  ARCH: "arm64"
  KBUILD_BUILD_HOST: "GitHub-Actions"
  KBUILD_BUILD_USER: "Neutron-Builder"
  ANYKERNEL_REPO: "https://github.com/Joker-V2/AnyKernel3"
  ANYKERNEL_BRANCH: "sixteen"
  ZIPSIGNER_URL: "https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar"

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: 📥 Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: zycromerz
        fetch-depth: 1
    
    - name: ⚙️ Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd \
          binutils-aarch64-linux-gnu \
          device-tree-compiler \
          lz4 xz-utils zlib1g-dev \
          openjdk-17-jdk \
          python-is-python3 \
          p7zip-full \
          android-sdk-libsparse-utils \
          erofs-utils \
          gnupg \
          gperf \
          libx11-dev \
          libreadline-dev \
          libgl1 libgl1-mesa-dev \
          python3-markdown \
          libxml2-utils xsltproc \
          libtinfo6 \
          cpio kmod openssl pahole \
          libarchive-tools rsync \
          util-linux 
        
        echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV
        echo "OBJ_DIR=$(pwd)/out" >> $GITHUB_ENV
        echo "ANYKERNEL_DIR=$(pwd)/anykernel" >> $GITHUB_ENV
        echo "TOOLCHAIN_DIR=$(pwd)/toolchains/neutron-clang" >> $GITHUB_ENV
        
        # إعداد ccache
        ccache --max-size=5G
        ccache --set-config=sloppiness=pch_defines,time_macros
        
        # Display build info
        cores=$(nproc --all)
        time=$(TZ="Asia/Riyadh" date "+%Y-%m-%d %H:%M:%S")
        commit_head=$(git log --oneline -1)
        
        echo "🚀 Build Triggered ⌛"
        echo "Kernel: ${{ env.KERNEL_NAME }}"
        echo "Support: ${{ env.KERNEL_SUPPORT }}"
        echo "Variant: ${{ env.KERNEL_VARIANT }}"
        echo "Cores: ${cores}"
        echo "Time: ${time}"
        echo "Last Commit: ${commit_head}"
        echo "CCache: 5GB enabled"
    
    - name: 🔧 Setup Neutron Clang
      run: |
        echo "🔧 Setting up Neutron Clang..."
        
        mkdir -p "${{ env.TOOLCHAIN_DIR }}"
        cd "${{ env.TOOLCHAIN_DIR }}"
        
        # تحميل AntMan
        curl -sSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
        chmod +x antman
        
        # سحب آخر إصدار Neutron Clang
        echo "📥 Downloading Neutron Clang..."
        ./antman -S 2>&1 | grep -v "Broken pipe" || true
        
        # التحقق
        if [ -f "bin/clang" ]; then
          echo "✅ Neutron Clang ready"
          echo "CLANG_PATH=${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_ENV
          echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
        else
          echo "❌ Neutron Clang setup failed"
          exit 1
        fi
    
    - name: 🏗️ Build Kernel
      run: |
        START_TIME=$(date +"%s")
        
        echo ""
        echo "🧹 Clean Build Directory"
        echo ""
        
        # ──────────────────────────────────────────────
        # ⚡⚡⚡ متغيرات البيئة من سكريبت bash ⚡⚡⚡
        # ──────────────────────────────────────────────
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH="${{ env.TOOLCHAIN_DIR }}/bin"
        export PATH="${CLANG_PATH}:${PATH}"
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # تنظيف (مثل سكريبت bash)
        make clean && make mrproper
        
        echo ""
        echo "🔧 Issue Build Commands"
        echo ""
        
        # إنشاء مجلد out
        rm -rf "${{ env.OBJ_DIR }}"
        mkdir -p "${{ env.OBJ_DIR }}"
        
        echo ""
        echo "📝 Set DEFCONFIG"
        echo ""
        
        echo "Using defconfig: ${{ env.CONFIG_FILE }}"
        
        # ──────────────────────────────────────────────
        # ⚡⚡⚡ الطريقة 1: مثل سكريبت bash الأصلي ⚡⚡⚡
        # ──────────────────────────────────────────────
        make CC=clang \
             AR=llvm-ar \
             NM=llvm-nm \
             OBJCOPY=llvm-objcopy \
             OBJDUMP=llvm-objdump \
             STRIP=llvm-strip \
             O=out \
             vendor/violet-perf_defconfig
        
        if [ $? -eq 0 ]; then
          echo "✅ Defconfig generated successfully"
        else
          echo "❌ Defconfig generation failed"
          exit 1
        fi
        
        echo ""
        echo "🔨 Build The Good Stuff"
        echo ""
        
        echo "Building with $(nproc --all) CPU cores"
        
        # ──────────────────────────────────────────────
        # ⚡⚡⚡ الطريقة 2: مثل سكريبت ZyC الناجح ⚡⚡⚡
        # ──────────────────────────────────────────────
        make -j$(nproc --all) \
          O="${{ env.OBJ_DIR }}" \
          ARCH="${{ env.ARCH }}" \
          CC="ccache clang" \
          AR="llvm-ar" \
          NM="llvm-nm" \
          OBJCOPY="llvm-objcopy" \
          OBJDUMP="llvm-objdump" \
          STRIP="llvm-strip" \
          LD="ld.lld" \
          CROSS_COMPILE="aarch64-linux-gnu-" \
          CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          LLVM=1 \
          LLVM_IAS=1 \
          KBUILD_BUILD_USER="${{ env.KBUILD_BUILD_USER }}" \
          KBUILD_BUILD_HOST="${{ env.KBUILD_BUILD_HOST }}" \
          2>&1 | tee build.log
        
        # التحقق من النجاح
        COMPILED_IMAGE="${{ env.OBJ_DIR }}/arch/arm64/boot/Image"
        COMPILED_IMAGE_GZ="${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz"
        COMPILED_DTBO="${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img"
        
        if [[ -f "${COMPILED_IMAGE}" || -f "${COMPILED_IMAGE_GZ}" ]]; then
          echo "🎉 Kernel compiled successfully ✅"
          END_TIME=$(date +"%s")
          DIFF=$((END_TIME - START_TIME))
          echo "⏱️  Compilation took: $((DIFF / 60)) minute(s) and $((DIFF % 60)) second(s)"
          
          # عرض حجم الملفات
          echo ""
          echo "📁 Build output:"
          ls -lh "${{ env.OBJ_DIR }}/arch/arm64/boot/" | grep -E "Image|dtbo"
          
          # إحصائيات CCache
          echo ""
          echo "📊 CCache Statistics:"
          ccache -s
          
          # حفظ أسماء الملفات للمراحل التالية
          if [ -f "${COMPILED_IMAGE}" ]; then
            echo "KERNEL_FILE=${COMPILED_IMAGE}" >> $GITHUB_ENV
            echo "KERNEL_TYPE=Image" >> $GITHUB_ENV
          elif [ -f "${COMPILED_IMAGE_GZ}" ]; then
            echo "KERNEL_FILE=${COMPILED_IMAGE_GZ}" >> $GITHUB_ENV
            echo "KERNEL_TYPE=Image.gz" >> $GITHUB_ENV
          fi
          
          if [ -f "${COMPILED_DTBO}" ]; then
            echo "DTBO_FILE=${COMPILED_DTBO}" >> $GITHUB_ENV
          fi
        else
          echo "❌ Compilation failed - Kernel image not found"
          echo "Last 50 lines of build log:"
          tail -50 build.log
          exit 1
        fi
    
    - name: 📁 Prepare Release Files (Optional - مثل bash script)
      if: success()
      run: |
        cd "${{ env.KERNEL_DIR }}"
        
        # هذا الجزء مشابه لسكريبت bash (اختياري)
        RELEASE_DIR="./release/Dragon"
        HISTORY_DIR="$RELEASE_DIR/history"
        
        mkdir -p "$RELEASE_DIR"
        mkdir -p "$HISTORY_DIR"
        
        # نسخ النسخة الحالية إلى التاريخ
        CURRENT_FILE="$RELEASE_DIR/Image"
        if [ -f "$CURRENT_FILE" ]; then
          n=1
          for file in "$HISTORY_DIR"/Image*; do
            if [[ -f "$file" ]]; then
              filename=$(basename "$file")
              num=${filename#Image}
              if [[ $num =~ ^[0-9]+$ ]] && [ $num -ge $n ]; then
                n=$((num + 1))
              fi
            fi
          done
          cp -f "$CURRENT_FILE" "$HISTORY_DIR/Image$n"
          echo "✅ Copied previous build to history: Image$n"
        fi
        
        # نسخ الكيرنل الجديد
        cp -f "${{ env.KERNEL_FILE }}" "$RELEASE_DIR/Image"
        echo "✅ Copied new kernel to $RELEASE_DIR/Image"
        
        # توقيع الـ modules (إذا كانت موجودة)
        if [ -f "./out/drivers/input/touchscreen/lge/module/touch_module_s3706.ko" ] && \
           [ -f "./out/certs/signing_key.pem" ] && \
           [ -f "./out/certs/signing_key.x509" ] && \
           [ -f "./out/scripts/sign-file" ]; then
          
          echo "🔏 Signing kernel modules..."
          ./out/scripts/sign-file sha512 \
            out/certs/signing_key.pem \
            out/certs/signing_key.x509 \
            out/drivers/input/touchscreen/lge/module/touch_module_s3706.ko \
            "$RELEASE_DIR/touch_module_s3706.ko"
          
          echo "✅ Signed touch module"
        fi
    
    - name: 📦 Create Flashable Zip
      run: |
        START_TIME=$(date +"%s")
        
        # Clone AnyKernel3
        rm -rf "${{ env.ANYKERNEL_DIR }}"
        git clone -q \
          "${{ env.ANYKERNEL_REPO }}" \
          -b "${{ env.ANYKERNEL_BRANCH }}" \
          "${{ env.ANYKERNEL_DIR }}"
        
        # نسخ ملفات الكيرنل
        echo "📁 Copying kernel files to AnyKernel..."
        
        # نسخ ملف الكيرنل
        cp -f "${{ env.KERNEL_FILE }}" "${{ env.ANYKERNEL_DIR }}/"
        
        # نسخ dtbo.img إذا وجد
        if [ -n "${{ env.DTBO_FILE }}" ] && [ -f "${{ env.DTBO_FILE }}" ]; then
          cp -f "${{ env.DTBO_FILE }}" "${{ env.ANYKERNEL_DIR }}/"
          echo "✅ Copied dtbo.img"
        fi
        
        # نسخ modules (إذا وجدت)
        if [ -f "./release/Dragon/touch_module_s3706.ko" ]; then
          mkdir -p "${{ env.ANYKERNEL_DIR }}/modules"
          cp -f ./release/Dragon/touch_module_s3706.ko "${{ env.ANYKERNEL_DIR }}/modules/"
          echo "✅ Copied signed module"
        fi
        
        # إنشاء ZIP
        cd "${{ env.ANYKERNEL_DIR }}"
        ZIP_NAME="${{ env.KERNEL_NAME }}-neutron-$(date +"%Y%m%d-%H%M").zip"
        zip -r -9 AnyKernel.zip * -x ".git/*"
        mv AnyKernel.zip "${ZIP_NAME}"
        
        # توقيع الـ ZIP
        echo "🔏 Signing build..."
        cd "${{ env.KERNEL_DIR }}"
        if [ ! -f zipsigner-3.0.jar ]; then
          wget -q -O zipsigner-3.0.jar "${{ env.ZIPSIGNER_URL }}"
        fi
        
        java -jar zipsigner-3.0.jar \
          "${{ env.ANYKERNEL_DIR }}/${ZIP_NAME}" \
          "${ZIP_NAME/.zip/-signed.zip}"
        
        SIGNED_ZIP="${ZIP_NAME/.zip/-signed.zip}"
        
        END_TIME=$(date +"%s")
        DIFF=$((END_TIME - START_TIME))
        
        echo "############################################"
        echo "🚀 Build Complete"
        echo "############################################"
        echo "Total packaging time: $((DIFF / 60))m $((DIFF % 60))s"
        echo "Toolchain: Neutron Clang"
        echo "Build file: ${SIGNED_ZIP}"
        echo "############################################"
        
        # حفظ اسم الملف النهائي
        echo "FINAL_ZIP=${SIGNED_ZIP}" >> $GITHUB_ENV
    
    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-neutron-${{ env.KERNEL_NAME }}-$(date +'%Y%m%d-%H%M')
        path: |
          ${{ env.KERNEL_DIR }}/*-signed.zip
          ${{ env.KERNEL_DIR }}/build.log
          ${{ env.OBJ_DIR }}/arch/arm64/boot/Image*
          ${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img
          ${{ env.KERNEL_DIR }}/release/Dragon/Image
          ${{ env.KERNEL_DIR }}/release/Dragon/touch_module_s3706.ko
        retention-days: 30
    
    - name: 📊 Build Summary
      if: always()
      run: |
        echo "══════════════════════════════════════════════════════════════"
        echo "                    🚀 BUILD SUMMARY 🚀                     "
        echo "══════════════════════════════════════════════════════════════"
        echo "🔸 Kernel: ${{ env.KERNEL_NAME }}"
        echo "🔸 Variant: ${{ env.KERNEL_VARIANT }}"
        echo "🔸 Toolchain: Neutron Clang"
        echo "🔸 Defconfig: vendor/violet-perf_defconfig"
        echo "🔸 Architecture: arm64"
        echo "🔸 CPU Cores used: $(nproc --all)"
        echo "🔸 Final ZIP: ${{ env.FINAL_ZIP }}"
        echo "══════════════════════════════════════════════════════════════"
        echo ""
        echo "📊 Environment Variables Used:"
        echo "ARCH=$ARCH"
        echo "SUBARCH=$SUBARCH"
        echo "CROSS_COMPILE=$CROSS_COMPILE"
        echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
        echo "CLANG_TRIPLE=$CLANG_TRIPLE"
        echo "══════════════════════════════════════════════════════════════"
