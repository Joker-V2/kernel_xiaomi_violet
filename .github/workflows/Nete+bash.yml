name: Build Kernel - Neutron Clang

on:
  workflow_dispatch:
  push:
    branches: [zycromerz]

env:
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic"
  KERNEL_VARIANT: "Neutron Dynamic"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  ARCH: "arm64"
  ANYKERNEL_REPO: "https://github.com/Joker-V2/AnyKernel3"
  ANYKERNEL_BRANCH: "sixteen"
  ZIPSIGNER_URL: "https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar"

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: 📥 Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: zycromerz
        fetch-depth: 1
    
    - name: ⚙️ Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          ccache \
          zstd \
          device-tree-compiler \
          lz4 xz-utils zlib1g-dev \
          python-is-python3 \
          p7zip-full \
          android-sdk-libsparse-utils \
          erofs-utils \
          gnupg \
          libxml2-utils xsltproc \
          libtinfo6 \
          cpio kmod openssl pahole \
          libarchive-tools rsync
        
        echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV
        echo "OBJ_DIR=$(pwd)/out" >> $GITHUB_ENV
        echo "ANYKERNEL_DIR=$(pwd)/anykernel" >> $GITHUB_ENV
        echo "TOOLCHAIN_DIR=$(pwd)/toolchains/neutron-clang" >> $GITHUB_ENV
        
        # إعداد ccache
        ccache --max-size=2G
        ccache --clear
        
        # معلومات النظام
        echo "🚀 نظام البناء:"
        echo "المعالج: $(nproc) نواة"
        echo "الذاكرة: $(free -h | awk '/^Mem:/{print $2}')"
        echo "التاريخ: $(date)"
    
    - name: 🔧 Setup Neutron Clang
      run: |
        echo "🔧 إعداد Neutron Clang..."
        
        mkdir -p "${{ env.TOOLCHAIN_DIR }}"
        cd "${{ env.TOOLCHAIN_DIR }}"
        
        # تحميل AntMan
        curl -sSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
        chmod +x antman
        
        # تنزيل Neutron Clang
        echo "📥 جاري تنزيل Neutron Clang..."
        ./antman -S 2>&1 | grep -v "Broken pipe" || true
        
        # التحقق
        if [ -f "bin/clang" ]; then
          echo "✅ Neutron Clang جاهز"
          echo "CLANG_PATH=${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_ENV
          echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
          
          # عرض إصدار clang للتأكد
          echo "🔍 إصدار Clang:"
          ./bin/clang --version | head -5
        else
          echo "❌ فشل إعداد Neutron Clang"
          exit 1
        fi
    
    - name: 🏗️ Build Kernel with Neutron Clang
      run: |
        cd "${{ env.KERNEL_DIR }}"
        
        START_TIME=$(date +"%s")
        
        echo ""
        echo "🧹 تنظيف مجلد البناء..."
        echo ""
        
        # تنظيف يدوي بدون make clean
        rm -rf "${{ env.OBJ_DIR }}"
        mkdir -p "${{ env.OBJ_DIR }}"
        rm -f .config .config.old
        
        echo ""
        echo "🔧 إعداد متغيرات Neutron Clang..."
        echo ""
        
        # ═══════════════════════════════════════════════════
        # ⚡⚡⚡ متغيرات Neutron Clang الأساسية ⚡⚡⚡
        # ═══════════════════════════════════════════════════
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH="${{ env.TOOLCHAIN_DIR }}/bin"
        export PATH="${CLANG_PATH}:${PATH}"
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # تأكيد استخدام Neutron
        echo "🔍 التحقق من Neutron Clang:"
        which clang
        clang --version | head -3
        
        echo ""
        echo "📝 إنشاء Defconfig..."
        echo ""
        
        echo "استخدام: ${{ env.CONFIG_FILE }}"
        
        # ═══════════════════════════════════════════════════
        # ✅ بناء defconfig (بدون CC و AR - هذا مهم!)
        # ═══════════════════════════════════════════════════
        make \
          O="${{ env.OBJ_DIR }}" \
          ARCH="${{ env.ARCH }}" \
          CROSS_COMPILE="aarch64-linux-gnu-" \
          CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
          "${{ env.CONFIG_FILE }}"
        
        if [ $? -eq 0 ]; then
          echo "✅ تم إنشاء Defconfig بنجاح"
        else
          echo "❌ فشل إنشاء Defconfig"
          exit 1
        fi
        
        echo ""
        echo "🔨 بدء بناء الكيرنل مع Neutron Clang..."
        echo ""
        
        echo "البناء باستخدام $(nproc) نواة معالج"
        
        # ═══════════════════════════════════════════════════
        # ✅ بناء الكيرنل مع Neutron Clang
        # ═══════════════════════════════════════════════════
        make -j$(nproc) \
          O="${{ env.OBJ_DIR }}" \
          ARCH="${{ env.ARCH }}" \
          CC="ccache clang" \
          AR="llvm-ar" \
          NM="llvm-nm" \
          OBJCOPY="llvm-objcopy" \
          OBJDUMP="llvm-objdump" \
          STRIP="llvm-strip" \
          LD="ld.lld" \
          CROSS_COMPILE="aarch64-linux-gnu-" \
          CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          LLVM=1 \
          LLVM_IAS=1 \
          KBUILD_BUILD_USER="GitHub-Actions" \
          KBUILD_BUILD_HOST="Neutron-Clang" \
          2>&1 | tee build.log
        
        # التحقق من النجاح
        COMPILED_IMAGE="${{ env.OBJ_DIR }}/arch/arm64/boot/Image"
        COMPILED_IMAGE_GZ="${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz"
        COMPILED_DTBO="${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img"
        
        if [[ -f "${COMPILED_IMAGE}" || -f "${COMPILED_IMAGE_GZ}" ]]; then
          echo ""
          echo "🎉 تم بناء الكيرنل بنجاح باستخدام Neutron Clang ✅"
          
          # تحديد ملف الكيرنل
          if [ -f "${COMPILED_IMAGE}" ]; then
            KERNEL_FILE="${COMPILED_IMAGE}"
            echo "📄 ملف الكيرنل: Image (غير مضغوط)"
          elif [ -f "${COMPILED_IMAGE_GZ}" ]; then
            KERNEL_FILE="${COMPILED_IMAGE_GZ}"
            echo "📄 ملف الكيرنل: Image.gz (مضغوط)"
          fi
          
          END_TIME=$(date +"%s")
          DIFF=$((END_TIME - START_TIME))
          
          echo "⏱️  وقت البناء: $((DIFF / 60)) دقيقة و $((DIFF % 60)) ثانية"
          
          # عرض حجم الملفات
          echo ""
          echo "📁 مخرجات البناء:"
          ls -lh "${{ env.OBJ_DIR }}/arch/arm64/boot/" | grep -E "Image|dtbo"
          
          # حفظ المتغيرات للمراحل التالية
          echo "KERNEL_FILE=${KERNEL_FILE}" >> $GITHUB_ENV
          
          if [ -f "${COMPILED_DTBO}" ]; then
            echo "DTBO_FILE=${COMPILED_DTBO}" >> $GITHUB_ENV
          fi
          
          # إحصائيات CCache
          echo ""
          echo "📊 إحصائيات CCache:"
          ccache -s
          
        else
          echo ""
          echo "❌ فشل البناء - ملف الكيرنل غير موجود"
          echo "آخر 50 سطر من سجل البناء:"
          tail -50 build.log
          exit 1
        fi
    
    - name: 📦 Create Flashable Zip
      run: |
        cd "${{ env.KERNEL_DIR }}"
        
        START_TIME=$(date +"%s")
        
        echo ""
        echo "📦 جاري إنشاء حزمة التثبيت..."
        echo ""
        
        # تحديد الملفات
        ZIMAGE="${{ env.KERNEL_FILE }}"
        DTBO="${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img"
        ZIP_NAME="${{ env.KERNEL_NAME }}-neutron-$(date +"%Y%m%d-%H%M").zip"
        
        # Clone AnyKernel3 (بنفس طريقة ZyC)
        rm -rf "${{ env.ANYKERNEL_DIR }}"
        git clone -q "${{ env.ANYKERNEL_REPO }}" -b "${{ env.ANYKERNEL_BRANCH }}" "${{ env.ANYKERNEL_DIR }}"
        
        # Copy kernel files (بنفس طريقة ZyC)
        cp -f "${ZIMAGE}" "${{ env.ANYKERNEL_DIR }}/"
        
        if [ -f "${DTBO}" ]; then
          cp -f "${DTBO}" "${{ env.ANYKERNEL_DIR }}/"
          echo "✅ تم نسخ dtbo.img"
        fi
        
        # Create zip (بنفس طريقة ZyC)
        cd "${{ env.ANYKERNEL_DIR }}"
        find . -name "*.zip" -type f -delete
        zip -r -9 AnyKernel.zip *
        mv AnyKernel.zip "${ZIP_NAME}"
        
        # Sign the zip (بنفس طريقة ZyC)
        echo "🔏 Signing build with AOSP keys"
        cd "${{ env.KERNEL_DIR }}"
        if [ ! -f zipsigner-3.0.jar ]; then
          wget -O zipsigner-3.0.jar "${{ env.ZIPSIGNER_URL }}"
        fi
        
        java -jar zipsigner-3.0.jar "${{ env.ANYKERNEL_DIR }}/${ZIP_NAME}" "${ZIP_NAME/.zip/-signed.zip}"
        SIGNED_ZIP="${ZIP_NAME/.zip/-signed.zip}"
        
        # Clean up (اختياري مثل ZyC)
        rm -rf "${{ env.ANYKERNEL_DIR }}"
        
        END_TIME=$(date +"%s")
        DIFF=$((END_TIME - START_TIME))
        
        echo "############################################"
        echo "🚀 Build Complete"
        echo "############################################"
        echo "Total packaging time: $((DIFF / 60))m $((DIFF % 60))s"
        echo "Toolchain: Neutron Clang"
        echo "Build file: ${SIGNED_ZIP}"
        echo "############################################"
        
        echo "FINAL_ZIP=${SIGNED_ZIP}" >> $GITHUB_ENV
    
    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-neutron-${{ env.KERNEL_NAME }}
        path: |
          ${{ env.KERNEL_DIR }}/*-signed.zip
          ${{ env.KERNEL_DIR }}/build.log
          ${{ env.OBJ_DIR }}/arch/arm64/boot/Image*
          ${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img
        retention-days: 7
    
    - name: 📊 Build Summary
      if: always()
      run: |
        echo "══════════════════════════════════════════════════════════════"
        echo "                    🚀 ملخص البناء 🚀                     "
        echo "══════════════════════════════════════════════════════════════"
        echo "🔸 الكيرنل: ${{ env.KERNEL_NAME }}"
        echo "🔸 الإصدار: ${{ env.KERNEL_VARIANT }}"
        echo "🔸 الأداة: Neutron Clang"
        echo "🔸 الإعداد: ${{ env.CONFIG_FILE }}"
        echo "🔸 المعمارية: ${{ env.ARCH }}"
        echo "🔸 الأنوية المستخدمة: $(nproc)"
        echo "🔸 الملف النهائي: ${{ env.FINAL_ZIP }}"
        echo "══════════════════════════════════════════════════════════════"
        echo ""
        echo "📊 متغيرات Neutron المستخدمة:"
        echo "CLANG_PATH: ${{ env.TOOLCHAIN_DIR }}/bin"
        echo "CROSS_COMPILE: aarch64-linux-gnu-"
        echo "CROSS_COMPILE_ARM32: arm-linux-gnueabi-"
        echo "CLANG_TRIPLE: aarch64-linux-gnu-"
        echo "══════════════════════════════════════════════════════════════"
