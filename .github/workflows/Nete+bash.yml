name: Build Kernel - Neutron Clang

on:
  workflow_dispatch:
  push:
    branches: [zycromerz]

env:
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic"
  KERNEL_VARIANT: "Neutron Dynamic"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  ARCH: "arm64"
  ANYKERNEL_REPO: "https://github.com/Joker-V2/AnyKernel3"
  ANYKERNEL_BRANCH: "sixteen"
  ZIPSIGNER_URL: "https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar"

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: 📥 Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: zycromerz
        fetch-depth: 1
    
    - name: ⚙️ Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          ccache \
          zstd \
          device-tree-compiler \
          lz4 xz-utils zlib1g-dev \
          python-is-python3
        
        echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV
        echo "OBJ_DIR=$(pwd)/out" >> $GITHUB_ENV
        echo "ANYKERNEL_DIR=$(pwd)/anykernel" >> $GITHUB_ENV
        echo "TOOLCHAIN_DIR=$(pwd)/toolchains/neutron-clang" >> $GITHUB_ENV
        
        ccache --max-size=2G
        ccache --clear
    
    - name: 🔧 Setup Neutron Clang
      run: |
        echo "🔧 Setting up Neutron Clang..."
        
        mkdir -p "${{ env.TOOLCHAIN_DIR }}"
        cd "${{ env.TOOLCHAIN_DIR }}"
        
        curl -sSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
        chmod +x antman
        
        echo "📥 Downloading Neutron Clang..."
        ./antman -S 2>&1 | grep -v "Broken pipe" || true
        
        if [ -f "bin/clang" ]; then
          echo "✅ Neutron Clang ready"
          echo "CLANG_PATH=${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_ENV
          echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
        else
          echo "❌ Neutron Clang setup failed"
          exit 1
        fi
    
    - name: 🏗️ Build Kernel (FIXED)
      run: |
        cd "${{ env.KERNEL_DIR }}"
        
        START_TIME=$(date +"%s")
        
        echo ""
        echo "🧹 تنظيف مجلد البناء..."
        echo ""
        
        # ═══════════════════════════════════════════════════
        # ⚡⚡⚡ الحل: تنظيف بسيط بدون make clean ⚡⚡⚡
        # ═══════════════════════════════════════════════════
        rm -rf "${{ env.OBJ_DIR }}"
        mkdir -p "${{ env.OBJ_DIR }}"
        
        # تنظيف بسيط فقط (لا تستخدم make clean)
        rm -f .config
        rm -f out/.config
        
        echo ""
        echo "🔧 إعداد متغيرات البيئة"
        echo ""
        
        # متغيرات البيئة
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH="${{ env.TOOLCHAIN_DIR }}/bin"
        export PATH="${CLANG_PATH}:${PATH}"
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        echo ""
        echo "📝 إنشاء Defconfig"
        echo ""
        
        echo "استخدام: ${{ env.CONFIG_FILE }}"
        
        # ═══════════════════════════════════════════════════
        # ⚡⚡⚡ الطريقة المضمونة: بدون make clean أولاً ⚡⚡⚡
        # ═══════════════════════════════════════════════════
        make \
          O="${{ env.OBJ_DIR }}" \
          ARCH="${{ env.ARCH }}" \
          CC="clang" \
          AR="llvm-ar" \
          NM="llvm-nm" \
          OBJCOPY="llvm-objcopy" \
          OBJDUMP="llvm-objdump" \
          STRIP="llvm-strip" \
          CROSS_COMPILE="aarch64-linux-gnu-" \
          CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          "${{ env.CONFIG_FILE }}"
        
        if [ $? -eq 0 ]; then
          echo "✅ تم إنشاء Defconfig بنجاح"
        else
          echo "❌ فشل إنشاء Defconfig"
          exit 1
        fi
        
        echo ""
        echo "🔨 بدء بناء الكيرنل..."
        echo ""
        
        echo "البناء باستخدام $(nproc) نواة معالج"
        
        make -j$(nproc) \
          O="${{ env.OBJ_DIR }}" \
          ARCH="${{ env.ARCH }}" \
          CC="ccache clang" \
          AR="llvm-ar" \
          NM="llvm-nm" \
          OBJCOPY="llvm-objcopy" \
          OBJDUMP="llvm-objdump" \
          STRIP="llvm-strip" \
          LD="ld.lld" \
          CROSS_COMPILE="aarch64-linux-gnu-" \
          CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          LLVM=1 \
          LLVM_IAS=1 \
          2>&1 | tee build.log
        
        # التحقق من النجاح
        if [ -f "${{ env.OBJ_DIR }}/arch/arm64/boot/Image" ]; then
          KERNEL_FILE="${{ env.OBJ_DIR }}/arch/arm64/boot/Image"
          echo "✅ تم بناء Kernel Image"
        elif [ -f "${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz" ]; then
          KERNEL_FILE="${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz"
          echo "✅ تم بناء Kernel Image.gz"
        else
          echo "❌ فشل البناء - ملف الكيرنل غير موجود"
          echo "آخر 50 سطر من سجل البناء:"
          tail -50 build.log
          exit 1
        fi
        
        END_TIME=$(date +"%s")
        DIFF=$((END_TIME - START_TIME))
        
        echo "⏱️  وقت البناء: $((DIFF / 60)) دقيقة و $((DIFF % 60)) ثانية"
        
        echo "KERNEL_FILE=$KERNEL_FILE" >> $GITHUB_ENV
        
        # عرض إحصائيات CCache
        echo ""
        echo "📊 إحصائيات CCache:"
        ccache -s
    
    - name: 📦 تعبئة الكيرنل
      run: |
        cd "${{ env.KERNEL_DIR }}"
        
        # Clone AnyKernel
        rm -rf "${{ env.ANYKERNEL_DIR }}"
        git clone -q \
          "${{ env.ANYKERNEL_REPO }}" \
          -b "${{ env.ANYKERNEL_BRANCH }}" \
          "${{ env.ANYKERNEL_DIR }}"
        
        # نسخ ملف الكيرنل
        echo "📁 نسخ ملف الكيرنل..."
        cp -f "${{ env.KERNEL_FILE }}" "${{ env.ANYKERNEL_DIR }}/"
        
        # نسخ dtbo.img إذا وجد
        if [ -f "${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img" ]; then
          cp -f "${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img" "${{ env.ANYKERNEL_DIR }}/"
          echo "✅ تم نسخ dtbo.img"
        fi
        
        # إنشاء ZIP
        cd "${{ env.ANYKERNEL_DIR }}"
        ZIP_NAME="${{ env.KERNEL_NAME }}-neutron-$(date +"%Y%m%d-%H%M").zip"
        zip -r -9 "$ZIP_NAME" . -x ".git/*"
        mv "$ZIP_NAME" "${{ env.KERNEL_DIR }}/"
        
        # توقيع الـ ZIP
        cd "${{ env.KERNEL_DIR }}"
        if [ ! -f "zipsigner-3.0.jar" ]; then
          wget -q -O zipsigner-3.0.jar "${{ env.ZIPSIGNER_URL }}"
        fi
        
        SIGNED_ZIP="${ZIP_NAME%.zip}-signed.zip"
        java -jar zipsigner-3.0.jar "$ZIP_NAME" "$SIGNED_ZIP"
        
        echo "✅ تم التوقيع: $SIGNED_ZIP"
        echo "FINAL_ZIP=$SIGNED_ZIP" >> $GITHUB_ENV
    
    - name: 📤 رفع الملفات
      uses: actions/upload-artifact@v4
      with:
        name: kernel-neutron
        path: |
          ${{ env.KERNEL_DIR }}/*-signed.zip
          ${{ env.KERNEL_DIR }}/build.log
          ${{ env.OBJ_DIR }}/arch/arm64/boot/Image*
          ${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img
        retention-days: 7
    
    - name: 📊 ملخص البناء
      if: always()
      run: |
        echo "══════════════════════════════════════════════════════════════"
        echo "                    🚀 ملخص البناء 🚀                     "
        echo "══════════════════════════════════════════════════════════════"
        echo "🔸 الكيرنل: ${{ env.KERNEL_NAME }}"
        echo "🔸 الأداة: Neutron Clang"
        echo "🔸 Config: ${{ env.CONFIG_FILE }}"
        echo "🔸 المعمارية: arm64"
        echo "🔸 الأنوية المستخدمة: $(nproc)"
        echo "🔸 الملف النهائي: ${{ env.FINAL_ZIP }}"
        echo "══════════════════════════════════════════════════════════════"
