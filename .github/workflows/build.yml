name: Build Kernel - Violet (Neutron Clang)

on:
  workflow_dispatch:
  push:
    branches: [zycromerz]
  pull_request:
    branches: [zycromerz]

env:
  KERNEL_NAME: "xcalibur-v5.4-violet"
  DEVICE_NAME: "violet"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  ARCH: "arm64"
  KBUILD_BUILD_HOST: "SuperiorOS"
  KBUILD_BUILD_USER: "RedHawk"
  ANYKERNEL_REPO: "https://github.com/Joker-V2/AnyKernel3"
  ANYKERNEL_BRANCH: "sixteen"
  ZIPSIGNER_URL: "https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar"
  TOOLCHAIN_DIR: "${{ github.workspace }}/toolchains/neutron-clang"
  ANTMAN_URL: "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 📥 Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: ⚙️ Setup Build Environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          wget zip unzip ccache git-core gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          openjdk-11-jdk libssl-dev ncurses-dev
        
        # إعداد المتغيرات
        echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV
        echo "OBJ_DIR=$(pwd)/out" >> $GITHUB_ENV
        echo "ANYKERNEL_DIR=$(pwd)/anykernel" >> $GITHUB_ENV
        echo "TOOLCHAIN_DIR=$(pwd)/toolchains/neutron-clang" >> $GITHUB_ENV
        echo "RELEASE_DIR=$(pwd)/release" >> $GITHUB_ENV
        
        # معلومات البناء
        CORES=$(nproc)
        time=$(TZ="Asia/Kolkata" date "+%d-%m-%Y %H:%M")
        commit_head=$(git log --oneline -1)
        branch=$(git branch --show-current)
        
        echo "=================================================="
        echo "    Building ${{ env.KERNEL_NAME }} for violet"
        echo "=================================================="
        echo ""
        echo "📱 Device: ${{ env.DEVICE_NAME }}"
        echo "🔧 Kernel: ${{ env.KERNEL_NAME }}"
        echo "⚡ Cores available: ${CORES}"
        echo "🕒 Time: ${time}"
        echo "🌿 Branch: ${branch}"
        echo "📝 Commit: ${commit_head}"
        echo "🛠️  Toolchain: Neutron Clang"
        echo ""
    
    - name: 🔧 Setup Neutron Clang
      run: |
        echo "=================================================="
        echo "    Setting up Neutron Clang Toolchain"
        echo "=================================================="
        echo ""
        
        mkdir -p "${{ env.TOOLCHAIN_DIR }}"
        cd "${{ env.TOOLCHAIN_DIR }}"
        
        echo "📥 Downloading AntMan..."
        curl -sSL "${{ env.ANTMAN_URL }}" -o antman
        chmod +x antman
        
        echo "🔄 Syncing latest Neutron Clang..."
        ./antman -S
        
        if [ -f "bin/clang" ] && [ -f "bin/ld.lld" ]; then
          echo "✅ Toolchain ready"
          echo "🔧 Version info:"
          ./bin/clang --version | head -2
          
          echo "CLANG_PATH=${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_ENV
          echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
        else
          echo "❌ Toolchain setup failed"
          exit 1
        fi
        
        echo ""
    
    - name: 🧹 Clean Previous Builds
      run: |
        echo "=================================================="
        echo "    Cleaning Workspace"
        echo "=================================================="
        echo ""
        
        cd "${{ env.KERNEL_DIR }}"
        
        echo "🧹 Removing old build files..."
        rm -rf out .config .config.old
        
        echo "🧽 Running make clean..."
        make clean 2>/dev/null || true
        
        echo "🗑️ Creating fresh directories..."
        mkdir -p out
        mkdir -p "${{ env.RELEASE_DIR }}"
        
        echo "✅ Workspace cleaned"
        echo ""
    
    - name: 🏗️ Build Kernel
      run: |
        echo "=================================================="
        echo "    Compiling Kernel"
        echo "=================================================="
        echo ""
        
        cd "${{ env.KERNEL_DIR }}"
        
        # إعداد متغيرات البيئة
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH="${{ env.TOOLCHAIN_DIR }}/bin"
        export PATH="${CLANG_PATH}:${PATH}"
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export KBUILD_BUILD_HOST="${{ env.KBUILD_BUILD_HOST }}"
        export KBUILD_BUILD_USER="${{ env.KBUILD_BUILD_USER }}"
        
        # إعداد ccache
        export CCACHE_DIR="${{ env.KERNEL_DIR }}/.ccache"
        mkdir -p "${CCACHE_DIR}"
        ccache -M 5G
        ccache -z
        
        CORES=$(nproc)
        echo "🔧 Build configuration:"
        echo "   Using ${CORES} threads"
        echo "   ARCH: arm64"
        echo "   Config: ${{ env.CONFIG_FILE }}"
        echo "   Toolchain: Neutron Clang"
        echo ""
        
        START_TIME=$(date +"%s")
        
        # الخطوة 1: إنشاء defconfig
        echo "📋 Generating defconfig..."
        make CC="ccache clang" \
             AR="llvm-ar" \
             NM="llvm-nm" \
             OBJCOPY="llvm-objcopy" \
             OBJDUMP="llvm-objdump" \
             STRIP="llvm-strip" \
             LD="ld.lld" \
             O=out \
             "${{ env.CONFIG_FILE }}" \
             -j$(nproc)
        
        if [ $? -ne 0 ]; then
          echo "❌ Defconfig generation failed"
          exit 1
        fi
        echo "✅ Defconfig generated"
        echo ""
        
        # الخطوة 2: بناء الكيرنل (سيبني Image.gz و dtbo.img تلقائياً)
        echo "🔨 Building kernel (this may take several minutes)..."
        echo "   Note: Building Image.gz and dtbo.img automatically"
        echo ""
        
        # بناء الكيرنل كاملاً
        make CC="ccache clang" \
             AR="llvm-ar" \
             NM="llvm-nm" \
             OBJCOPY="llvm-objcopy" \
             OBJDUMP="llvm-objdump" \
             STRIP="llvm-strip" \
             LD="ld.lld" \
             O=out \
             LLVM=1 \
             LLVM_IAS=1 \
             -j$(nproc) 2>&1 | tee build.log
        
        BUILD_RESULT=$?
        
        # التحقق من المخرجات
        echo ""
        echo "🔍 Checking build outputs..."
        
        IMAGE_GZ="${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz"
        DTBO_IMG="${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img"
        
        FILES_FOUND=0
        
        if [ -f "$IMAGE_GZ" ]; then
          IMAGE_SIZE=$(stat -c%s "$IMAGE_GZ")
          echo "✅ Image.gz: $(numfmt --to=iec $IMAGE_SIZE)"
          FILES_FOUND=$((FILES_FOUND + 1))
        else
          echo "❌ Image.gz not found!"
        fi
        
        if [ -f "$DTBO_IMG" ]; then
          DTBO_SIZE=$(stat -c%s "$DTBO_IMG")
          echo "✅ dtbo.img: $(numfmt --to=iec $DTBO_SIZE)"
          FILES_FOUND=$((FILES_FOUND + 1))
        else
          echo "⚠️  dtbo.img not found (may not be required for all kernels)"
        fi
        
        # إحصائيات ccache
        echo ""
        echo "📊 CCache statistics:"
        ccache -s
        
        # وقت البناء
        END_TIME=$(date +"%s")
        BUILD_TIME=$((END_TIME - START_TIME))
        
        echo ""
        echo "⏱️  Build time: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
        
        if [ $BUILD_RESULT -eq 0 ] && [ $FILES_FOUND -ge 1 ]; then
          echo "🎉 Kernel built successfully!"
        else
          echo "❌ Build failed or outputs missing"
          echo ""
          echo "📋 Last 20 lines of build log:"
          tail -20 build.log
          exit 1
        fi
        
        echo ""
    
    - name: 📦 Package Kernel
      run: |
        echo "=================================================="
        echo "    Creating Flashable Zip"
        echo "=================================================="
        echo ""
        
        cd "${{ env.KERNEL_DIR }}"
        
        # إنشاء اسم للـ zip مع التاريخ والوقت
        TIMESTAMP=$(date +"%Y%m%d_%H%M")
        ZIP_NAME="${{ env.KERNEL_NAME }}-${TIMESTAMP}.zip"
        SIGNED_ZIP="${ZIP_NAME%.zip}-signed.zip"
        
        echo "📦 Creating: $ZIP_NAME"
        echo ""
        
        # تحميل AnyKernel3
        echo "📥 Setting up AnyKernel3..."
        rm -rf "${{ env.ANYKERNEL_DIR }}"
        git clone --depth=1 --quiet \
          "${{ env.ANYKERNEL_REPO }}" \
          -b "${{ env.ANYKERNEL_BRANCH }}" \
          "${{ env.ANYKERNEL_DIR }}"
        
        # نسخ ملفات الكيرنل إلى AnyKernel3
        echo "📁 Copying kernel files..."
        
        # نسخ Image.gz إذا كان موجوداً
        if [ -f "${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz" ]; then
          cp -f "${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz" \
                "${{ env.ANYKERNEL_DIR }}/"
          echo "✅ Copied Image.gz"
        fi
        
        # نسخ dtbo.img إذا كان موجوداً
        if [ -f "${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img" ]; then
          cp -f "${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img" \
                "${{ env.ANYKERNEL_DIR }}/"
          echo "✅ Copied dtbo.img"
        fi
        
        # إنشاء الـ zip
        echo ""
        echo "🗜️ Creating flashable zip..."
        cd "${{ env.ANYKERNEL_DIR }}"
        
        # حذف أي ملفات zip سابقة
        rm -f *.zip
        
        # إنشاء الـ zip
        zip -r9 "$ZIP_NAME" ./* 2>/dev/null
        
        # نقل الـ zip إلى مجلد الكيرنل
        mv "$ZIP_NAME" "${{ env.KERNEL_DIR }}/"
        
        # توقيع الـ zip
        echo ""
        echo "🔐 Signing zip file..."
        cd "${{ env.KERNEL_DIR }}"
        
        if [ ! -f "zipsigner-3.0.jar" ]; then
          wget -q "${{ env.ZIPSIGNER_URL }}" -O zipsigner-3.0.jar
        fi
        
        # توقيع الـ zip
        java -jar zipsigner-3.0.jar "$ZIP_NAME" "$SIGNED_ZIP" 2>/dev/null
        
        if [ -f "$SIGNED_ZIP" ]; then
          ZIP_SIZE=$(stat -c%s "$SIGNED_ZIP")
          echo "✅ Signed zip created: $(numfmt --to=iec $ZIP_SIZE)"
        fi
        
        # نسخ الملفات إلى مجلد release
        echo ""
        echo "📂 Organizing release files..."
        mkdir -p "${{ env.RELEASE_DIR }}"
        
        # نسخ الملفات الفردية
        if [ -f "${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz" ]; then
          cp -f "${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz" \
                "${{ env.RELEASE_DIR }}/"
        fi
        
        if [ -f "${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img" ]; then
          cp -f "${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img" \
                "${{ env.RELEASE_DIR }}/"
        fi
        
        if [ -f "$SIGNED_ZIP" ]; then
          cp -f "$SIGNED_ZIP" "${{ env.RELEASE_DIR }}/"
        fi
        
        # تنظيف
        rm -rf "${{ env.ANYKERNEL_DIR }}"
        
        echo ""
        echo "📋 Available files:"
        echo "-------------------"
        ls -lh "${{ env.RELEASE_DIR }}/" 2>/dev/null || echo "No files in release directory"
        echo ""
    
    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-violet-${{ github.run_number }}
        path: |
          ${{ env.KERNEL_DIR }}/*.zip
          ${{ env.RELEASE_DIR }}/
          ${{ env.KERNEL_DIR }}/build.log
        retention-days: 7
    
    - name: 💾 Cache Toolchain
      uses: actions/cache@v4
      with:
        path: ${{ env.TOOLCHAIN_DIR }}
        key: neutron-clang-${{ runner.os }}-${{ hashFiles('Makefile') }}
        restore-keys: |
          neutron-clang-${{ runner.os }}-
    
    - name: 💾 Cache CCache
      uses: actions/cache@v4
      with:
        path: ${{ env.KERNEL_DIR }}/.ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-
    
    - name: 📊 Build Summary
      if: always()
      run: |
        echo "=================================================="
        echo "             Build Summary"
        echo "=================================================="
        echo ""
        echo "🏗️  Workflow: ${{ github.workflow }}"
        echo "🔢 Run: #${{ github.run_number }}"
        echo "📅 SHA: ${{ github.sha }}"
        echo "📊 Status: ${{ job.status }}"
        echo ""
        echo "📦 Artifacts available for download:"
        echo "   • kernel-violet-${{ github.run_number }}"
        echo ""
        echo "🔗 Check the 'Artifacts' section to download"
        echo "   the compiled kernel files."
        echo ""
