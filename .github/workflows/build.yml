name: Build Kernel - Violet (Neutron Clang)

on:
  workflow_dispatch:
  push:
    branches: [main, master, zycromerz]
  pull_request:
    branches: [main, master]

env:
  KERNEL_NAME: "xcalibur-v5.4-violet"
  DEVICE_NAME: "violet"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  ARCH: "arm64"
  KBUILD_BUILD_HOST: "SuperiorOS"
  KBUILD_BUILD_USER: "Joker-V2"
  ANYKERNEL_REPO: "https://github.com/Joker-V2/AnyKernel3"
  ANYKERNEL_BRANCH: "sixteen"
  ZIPSIGNER_URL: "https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar"
  TOOLCHAIN_DIR: "${{ github.workspace }}/toolchains/neutron-clang"
  ANTMAN_URL: "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
  # تحديد أسماء الملفات المطلوبة
  KERNEL_IMAGE: "Image.gz"
  DTBO_IMAGE: "dtbo.img"
  BUILD_TARGETS: "Image.gz-dtb dtbo.img"

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 📥 Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: ⚙️ Setup Build Environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          wget zip unzip ccache git-core gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
          openjdk-11-jdk libssl-dev ncurses-dev python3 python3-pip
        
        # إعداد بيئة البناء
        echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV
        echo "OBJ_DIR=$(pwd)/out" >> $GITHUB_ENV
        echo "ANYKERNEL_DIR=$(pwd)/anykernel" >> $GITHUB_ENV
        echo "TOOLCHAIN_DIR=$(pwd)/toolchains/neutron-clang" >> $GITHUB_ENV
        echo "RELEASE_DIR=$(pwd)/release" >> $GITHUB_ENV
        
        # معلومات البناء
        cores=$(nproc --all)
        time=$(TZ="Asia/Kolkata" date "+%d-%m-%Y %H:%M:%S")
        commit_head=$(git log --oneline -1)
        branch=$(git branch --show-current)
        
        echo "=========================================="
        echo "    Kernel Build - Redmi Note 7 Pro"
        echo "=========================================="
        echo "📱 Device: violet"
        echo "🔧 Kernel: ${{ env.KERNEL_NAME }}"
        echo "🎯 Targets: ${{ env.KERNEL_IMAGE }}, ${{ env.DTBO_IMAGE }}"
        echo "⚡ Cores: ${cores} (using 4)"
        echo "🕒 Time: ${time}"
        echo "🌿 Branch: ${branch}"
        echo "📝 Commit: ${commit_head}"
        echo ""
    
    - name: 🔧 Setup Neutron Clang
      run: |
        echo "=========================================="
        echo "    Installing Neutron Clang Toolchain"
        echo "=========================================="
        
        # إنشاء مجلد التول تشين
        mkdir -p "${{ env.TOOLCHAIN_DIR }}"
        cd "${{ env.TOOLCHAIN_DIR }}"
        
        # تحميل وتشغيل AntMan
        echo "📥 Downloading AntMan..."
        curl -sSL "${{ env.ANTMAN_URL }}" -o antman
        chmod +x antman
        
        # سحب آخر إصدار من Neutron Clang
        echo "🔄 Syncing Neutron Clang..."
        ./antman -S
        
        # التحقق من التثبيت
        if [ -f "bin/clang" ] && [ -f "bin/ld.lld" ]; then
          echo "✅ Toolchain installed successfully"
          
          # عرض إصدار Clang
          echo "🔧 Clang version:"
          ./bin/clang --version | head -3
          
          # إضافة المسار إلى PATH
          echo "CLANG_PATH=${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_ENV
          echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
        else
          echo "❌ Toolchain installation failed"
          exit 1
        fi
        
        echo ""
    
    - name: 🧹 Clean Previous Builds
      run: |
        echo "=========================================="
        echo "        Cleaning Workspace"
        echo "=========================================="
        
        cd "${{ env.KERNEL_DIR }}"
        
        # تنظيف البناء السابق
        echo "🧹 Cleaning build directory..."
        rm -rf out .config .config.old Module.symvers
        
        # محاولة التنظيف باستخدام make
        make clean 2>/dev/null || true
        make mrproper 2>/dev/null || true
        
        # إنشاء مجلدات المخرجات
        echo "📁 Creating output directories..."
        mkdir -p out/arch/arm64/boot
        mkdir -p "${{ env.RELEASE_DIR }}"
        
        echo "✅ Cleanup completed"
        echo ""
    
    - name: 🏗️ Compile Kernel
      run: |
        echo "=========================================="
        echo "        Compiling Kernel"
        echo "=========================================="
        
        cd "${{ env.KERNEL_DIR }}"
        
        # إعداد متغيرات البيئة
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH="${{ env.TOOLCHAIN_DIR }}/bin"
        export PATH="${CLANG_PATH}:${PATH}"
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export KBUILD_BUILD_HOST="${{ env.KBUILD_BUILD_HOST }}"
        export KBUILD_BUILD_USER="${{ env.KBUILD_BUILD_USER }}"
        
        # إعداد ccache لتسريع البناء
        export CCACHE_DIR="${{ env.KERNEL_DIR }}/.ccache"
        mkdir -p "${CCACHE_DIR}"
        ccache -M 3G
        ccache -z
        
        echo "🔧 Build configuration:"
        echo "   ARCH: $ARCH"
        echo "   Config: ${{ env.CONFIG_FILE }}"
        echo "   Toolchain: Neutron Clang"
        echo "   Threads: 4"
        echo ""
        
        # بدء计时
        START_TIME=$(date +"%s")
        
        # الخطوة 1: إنشاء defconfig
        echo "📋 Step 1/3: Generating defconfig..."
        make CC="ccache clang" \
             AR="llvm-ar" \
             NM="llvm-nm" \
             OBJCOPY="llvm-objcopy" \
             OBJDUMP="llvm-objdump" \
             STRIP="llvm-strip" \
             LD="ld.lld" \
             O=out \
             "${{ env.CONFIG_FILE }}" \
             -j4
        
        if [ $? -ne 0 ]; then
          echo "❌ Failed to generate defconfig"
          exit 1
        fi
        echo "✅ Defconfig generated"
        
        # الخطوة 2: بناء Image.gz
        echo ""
        echo "🔨 Step 2/3: Building ${{ env.KERNEL_IMAGE }}..."
        make CC="ccache clang" \
             AR="llvm-ar" \
             NM="llvm-nm" \
             OBJCOPY="llvm-objcopy" \
             OBJDUMP="llvm-objdump" \
             STRIP="llvm-strip" \
             LD="ld.lld" \
             O=out \
             LLVM=1 \
             LLVM_IAS=1 \
             ${{ env.KERNEL_IMAGE }} \
             -j4 2>&1 | tee build_kernel.log
        
        # الخطوة 3: بناء dtbo.img
        echo ""
        echo "🔨 Step 3/3: Building ${{ env.DTBO_IMAGE }}..."
        make CC="ccache clang" \
             AR="llvm-ar" \
             NM="llvm-nm" \
             OBJCOPY="llvm-objcopy" \
             OBJDUMP="llvm-objdump" \
             STRIP="llvm-strip" \
             LD="ld.lld" \
             O=out \
             LLVM=1 \
             LLVM_IAS=1 \
             ${{ env.DTBO_IMAGE }} \
             -j4 2>&1 | tee build_dtbo.log
        
        # التحقق من الملفات المبنية
        echo ""
        echo "🔍 Verifying build outputs..."
        
        KERNEL_OUTPUT="${{ env.OBJ_DIR }}/arch/arm64/boot/${{ env.KERNEL_IMAGE }}"
        DTBO_OUTPUT="${{ env.OBJ_DIR }}/arch/arm64/boot/${{ env.DTBO_IMAGE }}"
        
        if [ -f "$KERNEL_OUTPUT" ]; then
          KERNEL_SIZE=$(stat -c%s "$KERNEL_OUTPUT")
          echo "✅ ${{ env.KERNEL_IMAGE }}: $(numfmt --to=iec $KERNEL_SIZE)"
        else
          echo "❌ ${{ env.KERNEL_IMAGE }} not found!"
          exit 1
        fi
        
        if [ -f "$DTBO_OUTPUT" ]; then
          DTBO_SIZE=$(stat -c%s "$DTBO_OUTPUT")
          echo "✅ ${{ env.DTBO_IMAGE }}: $(numfmt --to=iec $DTBO_SIZE)"
        else
          echo "❌ ${{ env.DTBO_IMAGE }} not found!"
          exit 1
        fi
        
        # إحصائيات ccache
        echo ""
        echo "📊 CCache statistics:"
        ccache -s
        
        # حساب وقت البناء
        END_TIME=$(date +"%s")
        BUILD_TIME=$((END_TIME - START_TIME))
        
        echo ""
        echo "⏱️ Total build time: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
        echo "🎉 Kernel compiled successfully!"
        echo ""
    
    - name: 📦 Create Flashable Zip
      run: |
        echo "=========================================="
        echo "     Creating Flashable Zip"
        echo "=========================================="
        
        cd "${{ env.KERNEL_DIR }}"
        
        # إنشاء اسم للـ zip
        TIMESTAMP=$(date +"%Y%m%d_%H%M")
        ZIP_NAME="${{ env.KERNEL_NAME }}-${{ env.DEVICE_NAME }}-${TIMESTAMP}.zip"
        SIGNED_ZIP="${ZIP_NAME%.zip}-signed.zip"
        
        echo "📦 Creating: $ZIP_NAME"
        
        # تحميل AnyKernel3
        echo "📥 Downloading AnyKernel3..."
        rm -rf "${{ env.ANYKERNEL_DIR }}"
        git clone --depth=1 \
          "${{ env.ANYKERNEL_REPO }}" \
          -b "${{ env.ANYKERNEL_BRANCH }}" \
          "${{ env.ANYKERNEL_DIR }}" \
          2>/dev/null
        
        # نسخ ملفات الكيرنل
        echo "📁 Copying kernel files..."
        
        # نسخ Image.gz
        KERNEL_SRC="${{ env.OBJ_DIR }}/arch/arm64/boot/${{ env.KERNEL_IMAGE }}"
        if [ -f "$KERNEL_SRC" ]; then
          cp -f "$KERNEL_SRC" "${{ env.ANYKERNEL_DIR }}/"
          echo "✅ Copied ${{ env.KERNEL_IMAGE }}"
        fi
        
        # نسخ dtbo.img
        DTBO_SRC="${{ env.OBJ_DIR }}/arch/arm64/boot/${{ env.DTBO_IMAGE }}"
        if [ -f "$DTBO_SRC" ]; then
          cp -f "$DTBO_SRC" "${{ env.ANYKERNEL_DIR }}/"
          echo "✅ Copied ${{ env.DTBO_IMAGE }}"
        fi
        
        # إنشاء ملف update-binary قابل للتنفيذ إذا لم يكن موجوداً
        if [ -f "${{ env.ANYKERNEL_DIR }}/META-INF/com/google/android/update-binary" ]; then
          chmod +x "${{ env.ANYKERNEL_DIR }}/META-INF/com/google/android/update-binary"
        fi
        
        # إنشاء الـ zip
        echo "🗜️ Creating zip file..."
        cd "${{ env.ANYKERNEL_DIR }}"
        
        # حذف أي ملفات zip سابقة
        rm -f *.zip
        
        # إنشاء الـ zip مع استبعاد .git
        zip -r9 "$ZIP_NAME" . -x "*.git*" 2>/dev/null
        
        # نقل الـ zip إلى مجلد الكيرنل
        mv "$ZIP_NAME" "${{ env.KERNEL_DIR }}/"
        
        # توقيع الـ zip
        echo "🔐 Signing zip file..."
        cd "${{ env.KERNEL_DIR }}"
        
        if [ ! -f "zipsigner-3.0.jar" ]; then
          wget -q "${{ env.ZIPSIGNER_URL }}" -O zipsigner-3.0.jar
        fi
        
        # توقيع الـ zip
        java -jar zipsigner-3.0.jar "$ZIP_NAME" "$SIGNED_ZIP" 2>/dev/null
        
        if [ -f "$SIGNED_ZIP" ]; then
          ZIP_SIZE=$(stat -c%s "$SIGNED_ZIP")
          echo "✅ Signed zip created: $(numfmt --to=iec $ZIP_SIZE)"
        fi
        
        # نسخ الملفات إلى مجلد release
        echo "📂 Copying to release directory..."
        mkdir -p "${{ env.RELEASE_DIR }}"
        cp -f "${{ env.OBJ_DIR }}/arch/arm64/boot/${{ env.KERNEL_IMAGE }}" \
              "${{ env.RELEASE_DIR }}/"
        cp -f "${{ env.OBJ_DIR }}/arch/arm64/boot/${{ env.DTBO_IMAGE }}" \
              "${{ env.RELEASE_DIR }}/"
        cp -f "$SIGNED_ZIP" "${{ env.RELEASE_DIR }}/" 2>/dev/null || true
        
        # تنظيف
        rm -rf "${{ env.ANYKERNEL_DIR }}"
        
        echo ""
        echo "🎯 Build Summary:"
        echo "   📁 Kernel: ${{ env.RELEASE_DIR }}/${{ env.KERNEL_IMAGE }}"
        echo "   📁 DTBO: ${{ env.RELEASE_DIR }}/${{ env.DTBO_IMAGE }}"
        if [ -f "$SIGNED_ZIP" ]; then
          echo "   📦 Flashable: $SIGNED_ZIP"
        fi
        echo ""
    
    - name: 📤 Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ env.DEVICE_NAME }}-${{ github.run_id }}
        path: |
          ${{ env.KERNEL_DIR }}/*.zip
          ${{ env.RELEASE_DIR }}/
          ${{ env.KERNEL_DIR }}/build_*.log
        retention-days: 7
        if-no-files-found: error
    
    - name: 💾 Cache Toolchain
      uses: actions/cache@v4
      with:
        path: ${{ env.TOOLCHAIN_DIR }}
        key: neutron-clang-${{ runner.os }}-${{ hashFiles('**/Makefile', '**/Kbuild') }}
        restore-keys: |
          neutron-clang-${{ runner.os }}-
    
    - name: 💾 Cache CCache
      uses: actions/cache@v4
      with:
        path: ${{ env.KERNEL_DIR }}/.ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-
    
    - name: 📊 Build Summary
      if: always()
      run: |
        echo "=========================================="
        echo "           Build Summary"
        echo "=========================================="
        echo "Status: ${{ job.status }}"
        echo "Run ID: ${{ github.run_id }}"
        echo "Commit: ${{ github.sha }}"
        echo "Workflow: ${{ github.workflow }}"
        echo ""
        echo "Artifacts will be available in the"
        echo "'Artifacts' section of this workflow run."
        echo "=========================================="
