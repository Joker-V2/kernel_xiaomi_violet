name: 🍒 Cherry-pick 16 Commits to zyc2

on:
  workflow_dispatch:

jobs:
  cherry-pick-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # 1. Checkout فرع zyc2
      - name: 📦 Checkout zyc2
        uses: actions/checkout@v4
        with:
          ref: zyc2
          
      # 2. جلب الكوميتات من LG kernel
      - name: 🔗 Fetch LG Commits
        run: |
          git remote add lg-kernel https://github.com/sidex15/android_kernel_lge_sm8150.git || true
          git fetch lg-kernel --depth=100
          echo "✅ Fetched LG kernel commits"
          
      # 3. تنفيذ cherry-pick بالتسلسل
      - name: 🍒 Cherry-pick Sequentially
        id: cherrypick
        run: |
          echo "🍒 Cherry-picking 16 commits to zyc2..."
          echo "========================================"
          
          COMMITS=(
            "7f2847d02cdc4491b5ee6d4a0043854cbd6c7a1a"
            "27956d255e3b012372951dd6131e07c106d2daae"
            "95f8be4c8a86a491a1c2ac9bfe470aef9e1baa8f"
            "03fd2fbe9c40da8128cec5c69ef54755c0f38c6c"
            "6071a482c8e603be25895cc2cac5f0eab61c4051"
            "849ca8ce954d9dbb082dcf83c98af861e98e5635"
            "bbd5aec12b32097a71dc6a0097194a18f3ee9a17"
            "6f94042bed51121f8f28a5e572cda20c21fed2e1"
            "49a5115e11350ee68f6a5fbd56b3e817bf9e5aac"
            "37ae2444584654f6785f2cc49181f05af788c9b2"
            "0a8cbf3725edbacc5f1ead33eeae7e4d78823b5a"
            "4ba6dccf73a620e565803e5995d5748ecfbb56a2"
            "ed8fd10d97a50ec424ae38a40351b5de060f9838"
            "e784224542fab4b3888d9103a1f678015221a7d1"
            "9ba899398576d329288b023566d3a731470ad13a"
            "d406904bb175cb9791b5aed4404df3268859d91b"
          )
          
          SUCCESSFUL=()
          FAILED=()
          TOTAL_PROCESSED=0
          
          # إعداد git للمستخدم
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          for i in "${!COMMITS[@]}"; do
            COMMIT="${COMMITS[$i]}"
            COMMIT_SHORT="${COMMIT:0:8}"
            COMMIT_NUM=$((i + 1))
            COMMIT_URL="https://github.com/sidex15/android_kernel_lge_sm8150/commit/$COMMIT"
            
            echo ""
            echo "═══════════════════════════════════════════════"
            echo "🍒 [$COMMIT_NUM/16] Cherry-picking: $COMMIT_SHORT"
            echo "═══════════════════════════════════════════════"
            
            # محاولة cherry-pick
            if git cherry-pick "$COMMIT" 2>&1 | tee "cherrypick_${COMMIT_SHORT}.log"; then
              echo "✅ SUCCESS - Cherry-picked successfully"
              SUCCESSFUL+=("$COMMIT_SHORT")
            else
              echo "❌ FAILED - Cherry-pick encountered issues"
              
              # حفظ ملفات conflict إذا وجدت
              CONFLICT_FILES=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
              if [[ -n "$CONFLICT_FILES" ]]; then
                echo "   Conflicts in:"
                echo "$CONFLICT_FILES" | while read file; do
                  echo "     • $file"
                done
                
                # حفظ ملفات conflict
                echo "$CONFLICT_FILES" > "conflicts_${COMMIT_SHORT}.txt"
              fi
              
              # التراجع عن cherry-pick الفاشل
              git cherry-pick --abort 2>/dev/null || true
              FAILED+=("$COMMIT_SHORT")
            fi
            
            TOTAL_PROCESSED=$((TOTAL_PROCESSED + 1))
            
            # فاصل قصير بين الكوميتات
            if [[ $i -lt 15 ]]; then
              echo "⏳ Waiting 1 second..."
              sleep 1
            fi
          done
          
          # النتائج النهائية
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "📊 CHERRY-PICK COMPLETED"
          echo "═══════════════════════════════════════════════"
          echo "✅ Successful: ${#SUCCESSFUL[@]}/16"
          echo "❌ Failed: ${#FAILED[@]}/16"
          echo ""
          
          if [[ ${#SUCCESSFUL[@]} -gt 0 ]]; then
            echo "✅ Successfully cherry-picked:"
            for commit in "${SUCCESSFUL[@]}"; do
              echo "  • $commit"
            done
          fi
          
          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo ""
            echo "❌ Failed to cherry-pick:"
            for commit in "${FAILED[@]}"; do
              echo "  • $commit"
            done
          fi
          
          # حفظ النتائج
          echo "SUCCESS_COUNT=${#SUCCESSFUL[@]}" >> $GITHUB_OUTPUT
          echo "FAIL_COUNT=${#FAILED[@]}" >> $GITHUB_OUTPUT
          
      # 4. رفع التغييرات إلى zyc2
      - name: 📤 Push to zyc2
        if: steps.cherrypick.outputs.SUCCESS_COUNT > 0
        run: |
          echo "📤 Pushing cherry-picked commits to zyc2..."
          git push origin HEAD:zyc2 --force-with-lease
          
          echo "✅ Successfully pushed to zyc2"
          echo ""
          echo "🌐 View updated branch:"
          echo "https://github.com/${{ github.repository }}/tree/zyc2"
          
      # 5. حفظ السجلات
      - name: 📦 Save Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cherry-pick-results-$(date +%s)
          path: |
            cherrypick_*.log
            conflicts_*.txt
          retention-days: 30
