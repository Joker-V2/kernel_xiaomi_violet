name: 🍒 Complete Cherry-pick to zyc2

on:
  workflow_dispatch:

jobs:
  complete-cherry-pick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    permissions:
      contents: write
    
    steps:
      - name: 📦 Checkout zyc2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: zyc2
      
      - name: 👤 Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
      
      - name: 🔗 Fetch LG Kernel
        run: |
          git remote add lg-kernel https://github.com/sidex15/android_kernel_lge_sm8150.git || echo "Remote exists"
          git fetch lg-kernel --depth=100
          echo "✅ LG kernel fetched"
      
      - name: 🍒 Cherry-pick All Commits
        id: cherrypick
        run: |
          echo "🎯 Starting complete cherry-pick process"
          echo "========================================"
          
          # قائمة الكوميتات
          COMMITS=(
            "7f2847d02cdc4491b5ee6d4a0043854cbd6c7a1a"
            "27956d255e3b012372951dd6131e07c106d2daae"
            "95f8be4c8a86a491a1c2ac9bfe470aef9e1baa8f"
            "03fd2fbe9c40da8128cec5c69ef54755c0f38c6c"
            "6071a482c8e603be25895cc2cac5f0eab61c4051"
            "849ca8ce954d9dbb082dcf83c98af861e98e5635"
            "bbd5aec12b32097a71dc6a0097194a18f3ee9a17"
            "6f94042bed51121f8f28a5e572cda20c21fed2e1"
            "49a5115e11350ee68f6a5fbd56b3e817bf9e5aac"
            "37ae2444584654f6785f2cc49181f05af788c9b2"
            "0a8cbf3725edbacc5f1ead33eeae7e4d78823b5a"
            "4ba6dccf73a620e565803e5995d5748ecfbb56a2"
            "ed8fd10d97a50ec424ae38a40351b5de060f9838"
            "e784224542fab4b3888d9103a1f678015221a7d1"
            "9ba899398576d329288b023566d3a731470ad13a"
            "d406904bb175cb9791b5aed4404df3268859d91b"
          )
          
          SUCCESS_CHERRY=0
          SUCCESS_PATCH=0
          FAILED=0
          
          for i in "${!COMMITS[@]}"; do
            COMMIT="${COMMITS[$i]}"
            COMMIT_SHORT="${COMMIT:0:8}"
            COMMIT_NUM=$((i + 1))
            COMMIT_URL="https://github.com/sidex15/android_kernel_lge_sm8150/commit/$COMMIT"
            
            echo ""
            echo "════════════════════════════════════════"
            echo "🔧 [$COMMIT_NUM/16] $COMMIT_SHORT"
            echo "════════════════════════════════════════"
            
            # المحاولة 1: Cherry-pick مباشر
            echo "🔄 Attempt 1: Direct cherry-pick"
            if git cherry-pick "$COMMIT" 2>&1; then
              echo "✅ Cherry-pick successful"
              ((SUCCESS_CHERRY++))
            else
              echo "⚠️ Cherry-pick failed, trying patch..."
              git cherry-pick --abort 2>/dev/null || true
              
              # المحاولة 2: Apply patch
              echo "🔄 Attempt 2: Apply patch"
              if curl -sL "$COMMIT_URL.patch" | git apply --reject - 2>&1; then
                echo "✅ Patch applied successfully"
                
                # تنظيف ملفات .rej
                find . -name "*.rej" -delete 2>/dev/null || true
                
                # عمل commit
                git add .
                git commit -m "patch: $COMMIT_SHORT (#$COMMIT_NUM) to zyc2

Applied from LG kernel
Original: $COMMIT_URL"
                
                ((SUCCESS_PATCH++))
              else
                echo "❌ Both methods failed"
                git reset --hard 2>/dev/null || true
                ((FAILED++))
              fi
            fi
            
            # فاصل قصير
            if [[ $i -lt 15 ]]; then
              sleep 1
            fi
          done
          
          # النتائج النهائية
          echo ""
          echo "════════════════════════════════════════"
          echo "📊 FINAL RESULTS"
          echo "════════════════════════════════════════"
          echo "✅ Cherry-pick successful: $SUCCESS_CHERRY"
          echo "✅ Patch applied: $SUCCESS_PATCH"
          echo "❌ Failed: $FAILED"
          echo "📦 Total: 16"
          echo "════════════════════════════════════════"
          
          # حفظ النتائج
          TOTAL_SUCCESS=$((SUCCESS_CHERRY + SUCCESS_PATCH))
          echo "TOTAL_SUCCESS=$TOTAL_SUCCESS" >> $GITHUB_OUTPUT
          echo "CHERRY_SUCCESS=$SUCCESS_CHERRY" >> $GITHUB_OUTPUT
          echo "PATCH_SUCCESS=$SUCCESS_PATCH" >> $GITHUB_OUTPUT
          echo "FAILED_COUNT=$FAILED" >> $GITHUB_OUTPUT
      
      - name: 📤 Push to zyc2
        if: steps.cherrypick.outputs.TOTAL_SUCCESS > 0
        run: |
          echo "🚀 Pushing changes to zyc2..."
          git push origin HEAD:zyc2 --force-with-lease
          
          echo ""
          echo "✅ Push completed!"
          echo "📊 Results:"
          echo "   🍒 Cherry-pick: ${{ steps.cherrypick.outputs.CHERRY_SUCCESS }}"
          echo "   🩹 Patch: ${{ steps.cherrypick.outputs.PATCH_SUCCESS }}"
          echo "   ❌ Failed: ${{ steps.cherrypick.outputs.FAILED_COUNT }}"
          echo ""
          echo "🔗 View branch:"
          echo "https://github.com/${{ github.repository }}/tree/zyc2"
