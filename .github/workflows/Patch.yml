name: 🛠️ Smart Patch with Reject Handling

on:
  workflow_dispatch:
    inputs:
      commit_url:
        description: 'GitHub commit URL'
        required: false
        default: 'https://github.com/sidex15/android_kernel_lge_sm8150/commit/7f2847d02cdc4491b5ee6d4a0043854cbd6c7a1a'
  
  push:
    branches:
      - zyc2

jobs:
  pull-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    # 1. Checkout
    - name: 📦 Checkout zyc2
      uses: actions/checkout@v4
      with:
        ref: zyc2
        
    # 2. تطبيق الباتش مع حفظ الـ rejects
    - name: 🛠️ Apply Patch with Rejects
      id: apply_patch
      run: |
        echo "🔄 Applying patch with reject handling..."
        
        # URL الباتش الجديد
        PATCH_URL="https://github.com/sidex15/android_kernel_lge_sm8150/commit/7f2847d02cdc4491b5ee6d4a0043854cbd6c7a1a.patch"
        
        # تحميل الباتش
        echo "📥 Downloading patch..."
        wget -q -O source.patch "$PATCH_URL"
        
        # تطبيق الباتش مع السماح بالـ rejects
        echo "🔧 Applying patch (allow rejects)..."
        git apply --reject source.patch 2>&1 | tee apply.log
        
        # حساب عدد الـ rejects
        REJ_COUNT=$(find . -name "*.rej" 2>/dev/null | wc -l)
        APPLIED_COUNT=$(grep -c "Applied.*cleanly" apply.log || echo 0)
        
        echo "📊 Results:"
        echo "- Applied cleanly: $APPLIED_COUNT hunks"
        echo "- Rejected: $REJ_COUNT hunks"
        
        if [ "$REJ_COUNT" -gt 0 ]; then
          echo "⚠️ Found $REJ_COUNT rejected hunks"
          echo "HAS_REJECTS=true" >> $GITHUB_OUTPUT
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_OUTPUT
          
          # عرض ملفات الـ rejects
          echo "📁 Reject files:"
          find . -name "*.rej" -exec echo "  - {}" \;
        else
          echo "✅ All patches applied successfully"
          echo "HAS_REJECTS=false" >> $GITHUB_OUTPUT
        fi
        
        echo "APPLIED_COUNT=$APPLIED_COUNT" >> $GITHUB_OUTPUT
        
    # 3. إنشاء تقرير للـ rejects
    - name: 📝 Create Reject Report
      if: steps.apply_patch.outputs.HAS_REJECTS == 'true'
      run: |
        echo "📋 Creating reject report..."
        
        cat > REJECT_REPORT.md << EOF
        # Patch Reject Report
        ## LG Kernel → Xiaomi Kernel
        
        **Commit:** 7f2847d02cdc4491b5ee6d4a0043854cbd6c7a1a
        **Date:** $(date)
        **Branch:** zyc2
        
        ## Summary
        - Applied: ${{ steps.apply_patch.outputs.APPLIED_COUNT }} hunks
        - Rejected: ${{ steps.apply_patch.outputs.REJ_COUNT }} hunks
        
        ## Files with Rejects
        EOF
        
        find . -name "*.rej" | while read rej_file; do
          original_file="${rej_file%.rej}"
          echo "" >> REJECT_REPORT.md
          echo "### $(basename "$original_file")" >> REJECT_REPORT.md
          echo "- **File:** \`$original_file\`" >> REJECT_REPORT.md
          echo "- **Reject:** \`$rej_file\`" >> REJECT_REPORT.md
          
          if [ -f "$rej_file" ]; then
            echo "" >> REJECT_REPORT.md
            echo "**First 5 lines:**" >> REJECT_REPORT.md
            echo '```diff' >> REJECT_REPORT.md
            head -5 "$rej_file" >> REJECT_REPORT.md
            echo '```' >> REJECT_REPORT.md
          fi
        done
        
        echo "" >> REJECT_REPORT.md
        echo "## How to Fix" >> REJECT_REPORT.md
        echo "1. Open each \`.rej\` file" >> REJECT_REPORT.md
        echo "2. Compare with the original file" >> REJECT_REPORT.md
        echo "3. Apply changes manually" >> REJECT_REPORT.md
        echo "4. Delete \`.rej\` files after fixing" >> REJECT_REPORT.md
        
    # 4. عمل commit للتغييرات الناجحة فقط
    - name: 💾 Commit Successful Changes
      id: commit_changes
      run: |
        if git diff --quiet && git diff --cached --quiet; then
          echo "📭 No successful changes to commit"
          echo "HAS_SUCCESSFUL_CHANGES=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        git reset HEAD *.rej 2>/dev/null || true
        
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        git add .
        git commit -m "Apply partial patch from LG kernel to zyc2
        
        Applied: ${{ steps.apply_patch.outputs.APPLIED_COUNT }} hunks successfully
        Rejected: ${{ steps.apply_patch.outputs.REJ_COUNT }} hunks
        
        Original commit: 7f2847d02cdc4491b5ee6d4a0043854cbd6c7a1a"
        
        echo "HAS_SUCCESSFUL_CHANGES=true" >> $GITHUB_OUTPUT
        
    # 5. رفع التغييرات الناجحة
    - name: 📤 Push Successful Changes
      if: steps.commit_changes.outputs.HAS_SUCCESSFUL_CHANGES == 'true'
      run: |
        echo "📤 Pushing to zyc2..."
        git push origin HEAD:zyc2
        echo "✅ Pushed"
        
    # 6. حفظ كل الملفات للفحص
    - name: 📦 Save All Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: patch-results-zyc2-$(date +%s)
        path: |
          source.patch
          apply.log
          *.rej
          REJECT_REPORT.md
        retention-days: 30
