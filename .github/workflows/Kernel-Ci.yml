name: Build Kernel (violet | SukiSU Ultra + scope-min 1.6 + susfs2)

on:
  push:
    branches:
      - test4
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: test4
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 \
          openjdk-17-jre-headless

    # 3️⃣ Clang
    - name: Setup Clang
      run: |
        mkdir -p clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -xzf Clang-15.0.7-20251111.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    # 4️⃣ scope-min hooks v1.6
    - name: Apply scope-min hooks v1.6
      run: |
        set -e
        curl -L https://raw.githubusercontent.com/TheSillyOk/kernel_ls_patches/master/scope-min-hooks-v1.6.patch | patch -p1

    # 5️⃣ SUSFS 2.0
    - name: Apply susfs 2.0 patch
      run: |
        set +e
        curl -fsSL https://raw.githubusercontent.com/Red-A-Hawk/kernel_ls_patches/master/susfs-2.0.0.patch \
          | patch -p1 --batch --forward
        set -e

    # 6️⃣ Verify SUSFS files
    - name: Verify susfs files
      run: |
        test -f fs/susfs.c
        test -f include/linux/susfs.h
        test -f include/linux/susfs_def.h

    # 7️⃣ Dump SUSFS sources
    - name: Dump susfs source files
      run: |
        mkdir -p susfs_sources
        cp fs/susfs.c susfs_sources/
        cp include/linux/susfs.h susfs_sources/
        cp include/linux/susfs_def.h susfs_sources/

    # 8️⃣ Upload SUSFS sources
    - name: Upload SUSFS source files
      uses: actions/upload-artifact@v4
      with:
        name: susfs-sources
        path: susfs_sources

    # 9️⃣ Export build env
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 🔟 Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 1️⃣1️⃣ Build kernel
    - name: Build kernel
      run: |
        set -o pipefail
        make O=out -j$(nproc) 2>&1 | tee build.log

    # 1️⃣2️⃣ Verify hooks.o
    - name: Verify hooks.o built
      run: |
        grep -E "hooks\.o" build.log > hooks-build.txt || true
        test -s hooks-build.txt

    # 1️⃣3️⃣ Symbol analysis
    - name: KernelSU & SUSFS symbol analysis
      run: |
        nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || true
        nm out/vmlinux | grep -i susfs > nm-susfs.txt || true
        nm out/vmlinux > nm-full.txt

    # 1️⃣4️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../Kernel-violet-sukisu-susfs2.zip *

    # 1️⃣5️⃣ Sign ZIP
    - name: Sign kernel zip
      run: |
        wget -q https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar -O zipsigner.jar
        java -jar zipsigner.jar \
          Kernel-violet-sukisu-susfs2.zip \
          Kernel-violet-sukisu-susfs2-SIGNED.zip

    # 1️⃣6️⃣ Upload signed zip
    - name: Upload signed kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-sukisu-susfs2-SIGNED
        path: Kernel-violet-sukisu-susfs2-SIGNED.zip

    # 1️⃣7️⃣ Upload logs & analysis
    - name: Upload debug artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-debug
        path: |
          build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
          hooks-build.txt
