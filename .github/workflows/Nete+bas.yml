name: Build Kernel - Neutron Clang

on:
  workflow_dispatch:
  push:
    branches: zyc3

env:
  KERNEL_NAME: "xcalibur-v5.4-violet-dynamic"
  KERNEL_VARIANT: "Neutron Dynamic"
  CONFIG_FILE: "vendor/violet-perf_defconfig"
  ARCH: "arm64"
  ANYKERNEL_REPO: "https://github.com/Joker-V2/AnyKernel3"
  ANYKERNEL_BRANCH: "sixteen"
  ZIPSIGNER_URL: "https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar"

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: 📥 Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: zyc3
        fetch-depth: 1
    
    - name: ⚙️ Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          ccache \
          zstd \
          device-tree-compiler \
          lz4 xz-utils zlib1g-dev \
          python-is-python3 \
          p7zip-full \
          android-sdk-libsparse-utils \
          erofs-utils \
          gnupg \
          libxml2-utils xsltproc \
          libtinfo6 \
          cpio kmod openssl pahole \
          libarchive-tools rsync
        
        echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV
        echo "OBJ_DIR=$(pwd)/out" >> $GITHUB_ENV
        echo "ANYKERNEL_DIR=$(pwd)/anykernel" >> $GITHUB_ENV
        echo "TOOLCHAIN_DIR=$(pwd)/toolchains/neutron-clang" >> $GITHUB_ENV
        
        # إعداد ccache
        ccache --max-size=2G
        ccache --clear
        
        # معلومات النظام
        echo "🚀 نظام البناء:"
        echo "المعالج: $(nproc) نواة"
        echo "الذاكرة: $(free -h | awk '/^Mem:/{print $2}')"
        echo "التاريخ: $(date)"
    
    - name: 🔧 Setup Neutron Clang
      run: |
        echo "🔧 إعداد Neutron Clang..."
        
        mkdir -p "${{ env.TOOLCHAIN_DIR }}"
        cd "${{ env.TOOLCHAIN_DIR }}"
        
        # تحميل AntMan
        curl -sSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
        chmod +x antman
        
        # تنزيل Neutron Clang
        echo "📥 جاري تنزيل Neutron Clang..."
        ./antman -S 2>&1 | grep -v "Broken pipe" || true
        
        # التحقق
        if [ -f "bin/clang" ]; then
          echo "✅ Neutron Clang جاهز"
          echo "CLANG_PATH=${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_ENV
          echo "${{ env.TOOLCHAIN_DIR }}/bin" >> $GITHUB_PATH
          
          # عرض إصدار clang للتأكد
          echo "🔍 إصدار Clang:"
          ./bin/clang --version | head -5
        else
          echo "❌ فشل إعداد Neutron Clang"
          exit 1
        fi
    
    - name: 🏗️ Build Kernel with Neutron Clang
      run: |
        cd "${{ env.KERNEL_DIR }}"
        
        START_TIME=$(date +"%s")
        
        echo ""
        echo "🧹 تنظيف مجلد البناء..."
        echo ""
        
        # تنظيف يدوي بدون make clean
        rm -rf "${{ env.OBJ_DIR }}"
        mkdir -p "${{ env.OBJ_DIR }}"
        rm -f .config .config.old
        
        echo ""
        echo "🔧 إعداد متغيرات Neutron Clang..."
        echo ""
        
        # ═══════════════════════════════════════════════════
        # ⚡⚡⚡ متغيرات Neutron Clang الأساسية ⚡⚡⚡
        # ═══════════════════════════════════════════════════
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH="${{ env.TOOLCHAIN_DIR }}/bin"
        export PATH="${CLANG_PATH}:${PATH}"
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # تأكيد استخدام Neutron
        echo "🔍 التحقق من Neutron Clang:"
        which clang
        clang --version | head -3
        
        echo ""
        echo "📝 إنشاء Defconfig..."
        echo ""
        
        echo "استخدام: ${{ env.CONFIG_FILE }}"
        
        # ═══════════════════════════════════════════════════
        # ✅ بناء defconfig (بدون CC و AR - هذا مهم!)
        # ═══════════════════════════════════════════════════
        make \
          O="${{ env.OBJ_DIR }}" \
          ARCH="${{ env.ARCH }}" \
          CROSS_COMPILE="aarch64-linux-gnu-" \
          CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
          "${{ env.CONFIG_FILE }}"
        
        if [ $? -eq 0 ]; then
          echo "✅ تم إنشاء Defconfig بنجاح"
        else
          echo "❌ فشل إنشاء Defconfig"
          exit 1
        fi
        
        echo ""
        echo "🔨 بدء بناء الكيرنل مع Neutron Clang..."
        echo ""
        
        echo "البناء باستخدام $(nproc) نواة معالج"
        
        # ═══════════════════════════════════════════════════
        # ✅ بناء الكيرنل مع Neutron Clang
        # ═══════════════════════════════════════════════════
        make -j$(nproc) \
          O="${{ env.OBJ_DIR }}" \
          ARCH="${{ env.ARCH }}" \
          CC="ccache clang" \
          AR="llvm-ar" \
          NM="llvm-nm" \
          OBJCOPY="llvm-objcopy" \
          OBJDUMP="llvm-objdump" \
          STRIP="llvm-strip" \
          LD="ld.lld" \
          CROSS_COMPILE="aarch64-linux-gnu-" \
          CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          LLVM=1 \
          LLVM_IAS=1 \
          KBUILD_BUILD_USER="GitHub-Actions" \
          KBUILD_BUILD_HOST="Neutron-Clang" \
          2>&1 | tee build.log
        
        # التحقق من النجاح
        COMPILED_IMAGE="${{ env.OBJ_DIR }}/arch/arm64/boot/Image"
        COMPILED_IMAGE_GZ="${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz"
        COMPILED_DTBO="${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img"
        
        if [[ -f "${COMPILED_IMAGE}" || -f "${COMPILED_IMAGE_GZ}" ]]; then
          echo ""
          echo "🎉 تم بناء الكيرنل بنجاح باستخدام Neutron Clang ✅"
          
          # تحديد ملف الكيرنل
          if [ -f "${COMPILED_IMAGE}" ]; then
            KERNEL_FILE="${COMPILED_IMAGE}"
            echo "📄 ملف الكيرنل: Image (غير مضغوط)"
          elif [ -f "${COMPILED_IMAGE_GZ}" ]; then
            KERNEL_FILE="${COMPILED_IMAGE_GZ}"
            echo "📄 ملف الكيرنل: Image.gz (مضغوط)"
          fi
          
          END_TIME=$(date +"%s")
          DIFF=$((END_TIME - START_TIME))
          
          echo "⏱️  وقت البناء: $((DIFF / 60)) دقيقة و $((DIFF % 60)) ثانية"
          
          # عرض حجم الملفات
          echo ""
          echo "📁 مخرجات البناء:"
          ls -lh "${{ env.OBJ_DIR }}/arch/arm64/boot/" | grep -E "Image|dtbo"
          
          # حفظ المتغيرات للمراحل التالية
          echo "KERNEL_FILE=${KERNEL_FILE}" >> $GITHUB_ENV
          
          if [ -f "${COMPILED_DTBO}" ]; then
            echo "DTBO_FILE=${COMPILED_DTBO}" >> $GITHUB_ENV
          fi
          
          # إحصائيات CCache
          echo ""
          echo "📊 إحصائيات CCache:"
          ccache -s
          
        else
          echo ""
          echo "❌ فشل البناء - ملف الكيرنل غير موجود"
          echo "آخر 50 سطر من سجل البناء:"
          tail -50 build.log
          exit 1
        fi
    
    - name: 🔍 Discover All Kernel Modules
      if: success()
      run: |
        cd "${{ env.KERNEL_DIR }}"
        
        echo "🔍 جاري البحث عن جميع Kernel Modules..."
        echo ""
        
        # البحث عن جميع ملفات .ko في مجلد out
        echo "📁 البحث في مجلد out..."
        MODULES_LIST=$(find ./out -name "*.ko" -type f 2>/dev/null | sort)
        
        if [ -n "${MODULES_LIST}" ]; then
          echo "══════════════════════════════════════════════════════════════"
          echo "📦 قائمة جميع الـ Modules المكتشفة"
          echo "══════════════════════════════════════════════════════════════"
          
          MODULE_COUNT=0
          TOUCH_MODULE=""
          WIFI_MODULE=""
          CAMERA_MODULE=""
          AUDIO_MODULE=""
          
          while IFS= read -r MODULE_PATH; do
            MODULE_COUNT=$((MODULE_COUNT + 1))
            MODULE_NAME=$(basename "${MODULE_PATH}")
            MODULE_SIZE=$(ls -lh "${MODULE_PATH}" | awk '{print $5}')
            MODULE_DIR=$(dirname "${MODULE_PATH}" | sed 's|^\./out/||')
            
            echo "${MODULE_COUNT}. ${MODULE_NAME} (${MODULE_SIZE})"
            echo "   📍 ${MODULE_DIR}/"
            
            # تحديد نوع الـ module
            if [[ "${MODULE_NAME}" == *touch* ]] || [[ "${MODULE_NAME}" == *ts* ]] || [[ "${MODULE_NAME}" == *s3706* ]]; then
              echo "   📱 Touchscreen Driver"
              TOUCH_MODULE="${MODULE_PATH}"
            elif [[ "${MODULE_NAME}" == *wlan* ]] || [[ "${MODULE_NAME}" == *wifi* ]] || [[ "${MODULE_NAME}" == *qca* ]]; then
              echo "   📶 Wi-Fi Driver"
              WIFI_MODULE="${MODULE_PATH}"
            elif [[ "${MODULE_NAME}" == *cam* ]] || [[ "${MODULE_NAME}" == *sensor* ]] || [[ "${MODULE_NAME}" == *ois* ]]; then
              echo "   📷 Camera Driver"
              CAMERA_MODULE="${MODULE_PATH}"
            elif [[ "${MODULE_NAME}" == *audio* ]] || [[ "${MODULE_NAME}" == *snd* ]] || [[ "${MODULE_NAME}" == *sound* ]]; then
              echo "   🔊 Audio Driver"
              AUDIO_MODULE="${MODULE_PATH}"
            elif [[ "${MODULE_NAME}" == *bt* ]] || [[ "${MODULE_NAME}" == *bluetooth* ]]; then
              echo "   🎧 Bluetooth Driver"
            elif [[ "${MODULE_NAME}" == *battery* ]] || [[ "${MODULE_NAME}" == *charger* ]]; then
              echo "   🔋 Power/Battery Driver"
            else
              echo "   ⚙️ Generic Driver"
            fi
            
            echo ""
          done <<< "${MODULES_LIST}"
          
          echo "══════════════════════════════════════════════════════════════"
          echo "📊 الإجمالي: ${MODULE_COUNT} module(s)"
          echo ""
          
          # حفظ المعلومات للمراحل التالية
          echo "MODULES_COUNT=${MODULE_COUNT}" >> $GITHUB_ENV
          echo "ALL_MODULES=${MODULES_LIST}" >> $GITHUB_ENV
          
          # حفظ modules مهمة
          if [ -n "${TOUCH_MODULE}" ]; then
            echo "TOUCH_MODULE=${TOUCH_MODULE}" >> $GITHUB_ENV
            echo "TOUCH_MODULE_NAME=$(basename "${TOUCH_MODULE}")" >> $GITHUB_ENV
          fi
          
          if [ -n "${WIFI_MODULE}" ]; then
            echo "WIFI_MODULE=${WIFI_MODULE}" >> $GITHUB_ENV
          fi
          
          if [ -n "${CAMERA_MODULE}" ]; then
            echo "CAMERA_MODULE=${CAMERA_MODULE}" >> $GITHUB_ENV
          fi
          
          if [ -n "${AUDIO_MODULE}" ]; then
            echo "AUDIO_MODULE=${AUDIO_MODULE}" >> $GITHUB_ENV
          fi
          
        else
          echo "ℹ️ لم يتم العثور على أي modules في مجلد out/"
          echo "MODULES_COUNT=0" >> $GITHUB_ENV
        fi
        
        # التحقق من أدوات التوقيع
        echo ""
        echo "🔧 التحقق من أدوات التوقيع..."
        
        SIGN_TOOLS=0
        if [ -f "./out/scripts/sign-file" ]; then
          echo "✅ sign-file موجود"
          echo "SIGN_FILE_TOOL=./out/scripts/sign-file" >> $GITHUB_ENV
          SIGN_TOOLS=$((SIGN_TOOLS + 1))
        else
          echo "❌ sign-file غير موجود"
          echo "SIGN_FILE_TOOL=" >> $GITHUB_ENV
        fi
        
        if [ -f "./out/certs/signing_key.pem" ]; then
          echo "✅ signing_key.pem موجود"
          echo "SIGN_KEY_PEM=./out/certs/signing_key.pem" >> $GITHUB_ENV
          SIGN_TOOLS=$((SIGN_TOOLS + 1))
        else
          echo "❌ signing_key.pem غير موجود"
          echo "SIGN_KEY_PEM=" >> $GITHUB_ENV
        fi
        
        if [ -f "./out/certs/signing_key.x509" ]; then
          echo "✅ signing_key.x509 موجود"
          echo "SIGN_KEY_X509=./out/certs/signing_key.x509" >> $GITHUB_ENV
          SIGN_TOOLS=$((SIGN_TOOLS + 1))
        else
          echo "❌ signing_key.x509 غير موجود"
          echo "SIGN_KEY_X509=" >> $GITHUB_ENV
        fi
        
        if [ "${SIGN_TOOLS}" -eq 3 ]; then
          echo "✅ جميع أدوات التوقيع متوفرة"
          echo "CAN_SIGN=1" >> $GITHUB_ENV
        else
          echo "⚠️ أدوات التوقيع غير مكتملة (${SIGN_TOOLS}/3)"
          echo "CAN_SIGN=0" >> $GITHUB_ENV
        fi
    
    - name: 🔏 Handle Kernel Modules Based on Discovery
      if: env.MODULES_COUNT != '0' && success()
      run: |
        cd "${{ env.KERNEL_DIR }}"
        
        echo "🔏 جاري التعامل مع الـ Modules بناءً على الاكتشاف..."
        echo ""
        
        # 1. أولوية: module الشاشة إذا وجد
        if [ -n "${{ env.TOUCH_MODULE }}" ] && [ -f "${{ env.TOUCH_MODULE }}" ]; then
          echo "📱 معالجة touch module (الأولوية)..."
          MODULE_SOURCE="${{ env.TOUCH_MODULE }}"
          MODULE_NAME="${{ env.TOUCH_MODULE_NAME }}"
          
          # استخدام اسم ثابت لتسهيل التعامل
          if [[ "${MODULE_NAME}" == *s3706* ]]; then
            DEST_NAME="touch_module_s3706.ko"
          else
            DEST_NAME="touch_module.ko"
          fi
          
          MODULE_DEST="./${DEST_NAME}"
          
          # التوقيع إذا كانت الأدوات متوفرة
          if [ "${{ env.CAN_SIGN }}" = "1" ]; then
            echo "🔏 جاري توقيع ${MODULE_NAME} كـ ${DEST_NAME}..."
            
            "${{ env.SIGN_FILE_TOOL }}" sha512 \
              "${{ env.SIGN_KEY_PEM }}" \
              "${{ env.SIGN_KEY_X509 }}" \
              "${MODULE_SOURCE}" \
              "${MODULE_DEST}"
            
            if [ $? -eq 0 ]; then
              echo "✅ تم توقيع ${DEST_NAME}"
              echo "MAIN_MODULE=${MODULE_DEST}" >> $GITHUB_ENV
              echo "MODULE_SIGNED=1" >> $GITHUB_ENV
            else
              echo "⚠️ فشل التوقيع، نسخ بدون توقيع"
              cp -f "${MODULE_SOURCE}" "${MODULE_DEST}"
              echo "MAIN_MODULE=${MODULE_DEST}" >> $GITHUB_ENV
              echo "MODULE_UNSIGNED=1" >> $GITHUB_ENV
            fi
          else
            echo "📋 نسخ ${MODULE_NAME} كـ ${DEST_NAME} (بدون توقيع)..."
            cp -f "${MODULE_SOURCE}" "${MODULE_DEST}"
            echo "MAIN_MODULE=${MODULE_DEST}" >> $GITHUB_ENV
            echo "MODULE_UNSIGNED=1" >> $GITHUB_ENV
          fi
          
        # 2. إذا لم يوجد touch module، خذ أول module
        else
          echo "⚙️ معالجة أول module في القائمة..."
          FIRST_MODULE=$(echo "${{ env.ALL_MODULES }}" | head -1)
          
          if [ -n "${FIRST_MODULE}" ] && [ -f "${FIRST_MODULE}" ]; then
            MODULE_SOURCE="${FIRST_MODULE}"
            MODULE_NAME=$(basename "${FIRST_MODULE}")
            MODULE_DEST="./${MODULE_NAME}"
            
            echo "📦 نسخ ${MODULE_NAME}..."
            cp -f "${MODULE_SOURCE}" "${MODULE_DEST}"
            
            echo "MAIN_MODULE=${MODULE_DEST}" >> $GITHUB_ENV
            echo "MODULE_NAME=${MODULE_NAME}" >> $GITHUB_ENV
            echo "MODULE_UNSIGNED=1" >> $GITHUB_ENV
          else
            echo "ℹ️ لا توجد modules للتعامل معها"
            echo "MAIN_MODULE=" >> $GITHUB_ENV
          fi
        fi
        
        # 3. تحضير قائمة بجميع الـ modules للنسخ
        if [ "${{ env.MODULES_COUNT }}" -gt 0 ]; then
          echo "📋 إعداد قائمة بجميع الـ modules..."
          ALL_MODULES_DEST="./all_modules.txt"
          echo "# قائمة جميع Kernel Modules" > "${ALL_MODULES_DEST}"
          echo "# Generated: $(date)" >> "${ALL_MODULES_DEST}"
          echo "" >> "${ALL_MODULES_DEST}"
          
          echo "${{ env.ALL_MODULES }}" | while IFS= read -r MODULE_PATH; do
            if [ -f "${MODULE_PATH}" ]; then
              MODULE_NAME=$(basename "${MODULE_PATH}")
              MODULE_SIZE=$(ls -lh "${MODULE_PATH}" | awk '{print $5}')
              echo "- ${MODULE_NAME} (${MODULE_SIZE})" >> "${ALL_MODULES_DEST}"
            fi
          done
          
          echo "✅ تم إنشاء قائمة الـ modules في: ${ALL_MODULES_DEST}"
          echo "ALL_MODULES_LIST=${ALL_MODULES_DEST}" >> $GITHUB_ENV
        fi
    
    - name: 📦 Create Flashable Zip
      run: |
        cd "${{ env.KERNEL_DIR }}"
        
        START_TIME=$(date +"%s")
        
        echo ""
        echo "📦 جاري إنشاء حزمة التثبيت..."
        echo ""
        
        # ═══════════════════════════════════════════════════
        # ✅ الحصول على الملفات مباشرة من out/
        # ═══════════════════════════════════════════════════
        KERNEL_IMAGE="${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz"
        DTBO_IMAGE="${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img"
        
        ZIP_NAME="${{ env.KERNEL_NAME }}-neutron-$(date +"%Y%m%d-%H%M").zip"
        
        # Clone AnyKernel3
        rm -rf "${{ env.ANYKERNEL_DIR }}"
        git clone -q "${{ env.ANYKERNEL_REPO }}" -b "${{ env.ANYKERNEL_BRANCH }}" "${{ env.ANYKERNEL_DIR }}"
        
        # ═══════════════════════════════════════════════════
        # ✅ الخطوة 1: نسخ الملفين الأساسيين من out/
        # ═══════════════════════════════════════════════════
        echo "📋 نسخ الملفات الأساسية من out/ إلى AnyKernel:"
        
        # 1. Image.gz من out/
        if [ -f "${KERNEL_IMAGE}" ]; then
          cp -f "${KERNEL_IMAGE}" "${{ env.ANYKERNEL_DIR }}/"
          echo "✅ تم نسخ: Image.gz (من out/)"
        else
          # إذا لم يكن Image.gz موجوداً، حاول Image
          ALT_KERNEL_IMAGE="${{ env.OBJ_DIR }}/arch/arm64/boot/Image"
          if [ -f "${ALT_KERNEL_IMAGE}" ]; then
            cp -f "${ALT_KERNEL_IMAGE}" "${{ env.ANYKERNEL_DIR }}/"
            echo "✅ تم نسخ: Image (من out/)"
          else
            echo "❌ خطأ: لم أجد Image.gz أو Image في out/"
            exit 1
          fi
        fi
        
        # 2. dtbo.img من out/
        if [ -f "${DTBO_IMAGE}" ]; then
          cp -f "${DTBO_IMAGE}" "${{ env.ANYKERNEL_DIR }}/"
          echo "✅ تم نسخ: dtbo.img (من out/)"
        else
          echo "⚠️ ملاحظة: dtbo.img غير موجود في out/"
        fi
        
        # ═══════════════════════════════════════════════════
        # ✅ الخطوة 2: إضافة الـ modules إذا وجدت
        # ═══════════════════════════════════════════════════
        if [ -n "${{ env.MAIN_MODULE }}" ] && [ -f "${{ env.MAIN_MODULE }}" ]; then
          echo ""
          echo "📦 إضافة الـ modules إلى الحزمة..."
          
          # إنشاء مجلد modules في AnyKernel
          mkdir -p "${{ env.ANYKERNEL_DIR }}/modules"
          
          # نسخ module الرئيسي
          MODULE_NAME=$(basename "${{ env.MAIN_MODULE }}")
          cp -f "${{ env.MAIN_MODULE }}" "${{ env.ANYKERNEL_DIR }}/modules/${MODULE_NAME}"
          echo "✅ تم إضافة ${MODULE_NAME}"
          
          # إذا كان لدينا أكثر من 5 modules، أضفها جميعاً
          if [ "${{ env.MODULES_COUNT }}" -gt 5 ]; then
            echo "📦 نسخ جميع الـ modules (${MODULES_COUNT})..."
            echo "${{ env.ALL_MODULES }}" | while IFS= read -r MODULE_PATH; do
              if [ -f "${MODULE_PATH}" ]; then
                MODULE_NAME=$(basename "${MODULE_PATH}")
                cp -f "${MODULE_PATH}" "${{ env.ANYKERNEL_DIR }}/modules/${MODULE_NAME}" 2>/dev/null || true
              fi
            done
            echo "✅ تم إضافة جميع الـ modules"
          fi
          
          # إضافة ملف قائمة الـ modules
          if [ -f "${{ env.ALL_MODULES_LIST }}" ]; then
            cp -f "${{ env.ALL_MODULES_LIST }}" "${{ env.ANYKERNEL_DIR }}/modules/MODULES_LIST.txt"
            echo "✅ تم إضافة قائمة الـ modules"
          fi
          
        else
          echo "ℹ️ لا توجد modules مطلوبة لهذا البناء"
        fi
        
        # Create zip
        cd "${{ env.ANYKERNEL_DIR }}"
        find . -name "*.zip" -type f -delete
        zip -r -9 AnyKernel.zip *
        mv AnyKernel.zip "${ZIP_NAME}"
        
        # Sign the zip
        echo "🔏 Signing build with AOSP keys"
        cd "${{ env.KERNEL_DIR }}"
        if [ ! -f zipsigner-3.0.jar ]; then
          wget -O zipsigner-3.0.jar "${{ env.ZIPSIGNER_URL }}"
        fi
        
        java -jar zipsigner-3.0.jar "${{ env.ANYKERNEL_DIR }}/${ZIP_NAME}" "${ZIP_NAME/.zip/-signed.zip}"
        SIGNED_ZIP="${ZIP_NAME/.zip/-signed.zip}"
        
        # Clean up
        rm -rf "${{ env.ANYKERNEL_DIR }}"
        
        END_TIME=$(date +"%s")
        DIFF=$((END_TIME - START_TIME))
        
        echo "############################################"
        echo "🚀 Build Complete"
        echo "############################################"
        echo "Total packaging time: $((DIFF / 60))m $((DIFF % 60))s"
        echo "Toolchain: Neutron Clang"
        echo "Modules found: ${{ env.MODULES_COUNT }}"
        echo "Files copied from out/:"
        echo "  - Image.gz"
        echo "  - dtbo.img"
        echo "Build file: ${SIGNED_ZIP}"
        echo "############################################"
        
        echo "FINAL_ZIP=${SIGNED_ZIP}" >> $GITHUB_ENV
    
    - name: 📤 Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-neutron-${{ env.KERNEL_NAME }}
        path: |
          ${{ env.KERNEL_DIR }}/*-signed.zip
          ${{ env.KERNEL_DIR }}/build.log
          ${{ env.OBJ_DIR }}/arch/arm64/boot/Image.gz
          ${{ env.OBJ_DIR }}/arch/arm64/boot/dtbo.img
          ${{ env.KERNEL_DIR }}/touch_module*.ko
          ${{ env.KERNEL_DIR }}/all_modules.txt
        retention-days: 7
    
    - name: 📊 Build Summary
      if: always()
      run: |
        echo "══════════════════════════════════════════════════════════════"
        echo "                    🚀 ملخص البناء 🚀                     "
        echo "══════════════════════════════════════════════════════════════"
        echo "🔸 الكيرنل: ${{ env.KERNEL_NAME }}"
        echo "🔸 الإصدار: ${{ env.KERNEL_VARIANT }}"
        echo "🔸 الأداة: Neutron Clang"
        echo "🔸 الإعداد: ${{ env.CONFIG_FILE }}"
        echo "🔸 المعمارية: ${{ env.ARCH }}"
        echo "🔸 الأنوية المستخدمة: $(nproc)"
        echo "🔸 الـ Modules المكتشفة: ${{ env.MODULES_COUNT }}"
        
        if [ "${{ env.MODULES_COUNT }}" != "0" ]; then
          echo "🔸 Module الرئيسي: $(basename "${{ env.MAIN_MODULE }}" 2>/dev/null || echo 'N/A')"
          if [ "${{ env.MODULE_SIGNED }}" = "1" ]; then
            echo "🔸 حالة الـ Module: ✅ موقعة"
          elif [ "${{ env.MODULE_UNSIGNED }}" = "1" ]; then
            echo "🔸 حالة الـ Module: ⚠️ غير موقعة"
          fi
        fi
        
        echo "🔸 الملفات من out/: Image.gz, dtbo.img"
        echo "🔸 الملف النهائي: ${{ env.FINAL_ZIP }}"
        echo "══════════════════════════════════════════════════════════════"
        echo ""
        echo "📊 متغيرات Neutron المستخدمة:"
        echo "CLANG_PATH: ${{ env.TOOLCHAIN_DIR }}/bin"
        echo "CROSS_COMPILE: aarch64-linux-gnu-"
        echo "CROSS_COMPILE_ARM32: arm-linux-gnueabi-"
        echo "CLANG_TRIPLE: aarch64-linux-gnu-"
        echo "══════════════════════════════════════════════════════════════"
