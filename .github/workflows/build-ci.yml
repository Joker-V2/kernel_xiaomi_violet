name: Build Kernel (violet | SukiSU Ultra + jeejox + susfs2)

on:
  push:
    branches:
      - test4
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: test4
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 \
          openjdk-17-jre-headless

    # 3️⃣ Clang
    - name: Setup Clang
      run: |
        mkdir -p clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -xzf Clang-15.0.7-20251111.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    # 4️⃣ KernelSU non-GKI patches (jeejox)
    - name: Apply KernelSU non-GKI patches
      run: |
        set -e
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0001-fs-exec-add-ksu-execveat-hook.patch | patch -p1
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0002-fs-open-add-ksu-faccessat-hook.patch | patch -p1
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0003-fs-read_write-add-ksu-vfs_read-hook.patch | patch -p1
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0004-fs-stat-add-ksu-vfs_statx-hook.patch | patch -p1
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0005-drivers-input-input-add-ksu-input_handle_event-hook.patch | patch -p1
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0006-fs-namespace-add-path-umount-hook.patch | patch -p1

    # 5️⃣ SUSFS 2.0 (كما هو – بدون تعديل)
    - name: Apply susfs 2.0 patch
      run: |
        set +e
        curl -fsSL https://raw.githubusercontent.com/Red-A-Hawk/kernel_ls_patches/master/susfs-2.0.0.patch \
          | patch -p1 --batch --forward
        set -e

    # 6️⃣ Verify susfs files exist
    - name: Verify susfs files
      run: |
        test -f fs/susfs.c || { echo "❌ fs/susfs.c missing"; exit 1; }
        test -f include/linux/susfs.h || { echo "❌ include/linux/susfs.h missing"; exit 1; }
        echo "✅ susfs files exist"

    # 6️⃣5️⃣ Dump susfs sources (inspection only)
    - name: Dump susfs source files
      run: |
        mkdir -p susfs_sources
        cp fs/susfs.c susfs_sources/ || true
        cp include/linux/susfs.h susfs_sources/ || true
        if [ -f include/linux/susfs_def.h ]; then
          cp include/linux/susfs_def.h susfs_sources/
        fi
        echo "== SUSFS dumped files =="
        ls -l susfs_sources

    # 7️⃣ Export build env
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 8️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 9️⃣ Build kernel
    - name: Build kernel
      run: |
        set -o pipefail
        make O=out -j$(nproc) 2>&1 | tee build.log

    # 🔟 Verify hooks.o
    - name: Verify hooks.o built
      run: |
        grep -E "hooks\.o" build.log > hooks-build.txt || true
        if [ ! -s hooks-build.txt ]; then
          echo "❌ hooks.o was NOT built"
          exit 1
        fi
        echo "✅ hooks.o detected"

    # 1️⃣1️⃣ Symbol analysis
    - name: KernelSU & SUSFS symbol analysis
      run: |
        nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || true
        nm out/vmlinux | grep -i susfs > nm-susfs.txt || true
        nm out/vmlinux > nm-full.txt

        if [ ! -s nm-ksu.txt ]; then
          echo "❌ KernelSU symbols missing"
          exit 1
        fi

        if [ ! -s nm-susfs.txt ]; then
          echo "❌ SUSFS symbols missing"
          exit 1
        fi

        echo "✅ KernelSU & SUSFS symbols present"

    # 1️⃣2️⃣ Verify susfs really integrated
    - name: Verify susfs integration
      run: |
        grep -q "susfs.o" fs/Makefile || exit 1
        grep -q "susfs\\.o" build.log || exit 1
        grep -E "susfs_init|susfs_is_" nm-full.txt || exit 1
        echo "✅ SUSFS fully integrated"

    # 1️⃣3️⃣ Package AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        cd AK3
        zip -r9 ../Kernel-violet-sukisu-susfs2.zip *

    # 1️⃣4️⃣ Upload artifacts
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-sukisu-susfs2
        path: |
          Kernel-violet-sukisu-susfs2.zip
          build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
          hooks-build.txt
          susfs_sources/
