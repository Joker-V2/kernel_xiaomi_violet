name: Build Kernel (violet | safe + full log)

on:
  push:
    branches: [ test4 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: test4
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 openjdk-17-jre-headless \
          ccache

    # 3️⃣ Swap (آمن)
    - name: Setup swap
      run: |
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    # 4️⃣ Clang ZyC 22
    - name: Setup ZyC Clang 22
      run: |
        mkdir -p clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz
        tar -xzf Clang-22.0.0git-20250920.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH
        clang --version

    # 5️⃣ KernelSU hooks (inline / mini)
    - name: Apply KernelSU hooks
      run: |
        set -e
        curl -L https://raw.githubusercontent.com/TheSillyOk/kernel_ls_patches/master/susfs-inline-hooks.patch | patch -p1

    # 6️⃣ SUSFS 2.0
    - name: Apply SUSFS 2.0
      run: |
        set +e
        curl -fsSL https://raw.githubusercontent.com/Red-A-Hawk/kernel_ls_patches/master/susfs-2.0.0.patch \
          | patch -p1 --batch --forward
        set -e

    # 7️⃣ Verify SUSFS
    - name: Verify susfs files
      run: |
        test -f fs/susfs.c
        test -f include/linux/susfs.h
        test -f include/linux/susfs_def.h

    # 8️⃣ Environment
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=0" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 9️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 🔟 Prepare ccache
    - name: Prepare ccache
      run: |
        export CCACHE_CPP2=yes
        export CCACHE_COMPILERCHECK=content
        export CCACHE_SLOPPINESS=file_macro,time_macros
        ccache -M 5G
        ccache -z

    # 🔥 Build kernel (SAFE LOGGING)
    - name: Build kernel
      id: build
      run: |
        mkdir -p logs
        set +e

        make O=out -j2 \
          CC="ccache clang" \
          LLVM=1 \
          LLVM_IAS=0 \
          > logs/build.log 2>&1

        echo $? > logs/build.ret
        ccache -s

    # ❌ Print error like screenshot
    - name: Show error log (last lines)
      if: failure()
      run: |
        echo "====== BUILD FAILED ======"
        tail -n 200 logs/build.log

    # ✅ Verify hooks.o
    - name: Verify hooks.o
      if: success()
      run: |
        grep -R "hooks.o" logs/build.log || true

    # 📦 AnyKernel3
    - name: Package AnyKernel3
      if: success()
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../Kernel-violet.zip *

    # ✍️ Sign zip
    - name: Sign zip
      if: success()
      run: |
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar Kernel-violet.zip Kernel-violet-signed.zip

    # 📤 Upload artifacts
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-logs
        path: |
          logs/build.log
          logs/build.ret
          Kernel-violet-signed.zip
