name: Build Kernel (violet | SukiSU Ultra + susfs2 | ZyC22 + ccache + zram)

on:
  push:
    branches:
      - test4
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: test4
        fetch-depth: 1

    # 2️⃣ Dependencies + ccache
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 \
          openjdk-17-jre-headless \
          ccache

    # 3️⃣ ZRAM (Swap)
    - name: Setup zram
      run: |
        sudo swapoff -a || true
        sudo modprobe zram
        echo lz4 | sudo tee /sys/block/zram0/comp_algorithm
        echo 8G | sudo tee /sys/block/zram0/disksize
        sudo mkswap /dev/zram0
        sudo swapon /dev/zram0
        free -h

    # 4️⃣ Clang (ZyCromerZ 22)
    - name: Setup ZyC Clang 22
      run: |
        mkdir -p clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz
        tar -xzf Clang-22.0.0git-20250920.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH
        clang --version

    # 5️⃣ KernelSU mini-scope hooks 1.6
    - name: Apply KernelSU mini scope hooks
      run: |
        set -e
        curl -L https://raw.githubusercontent.com/TheSillyOk/kernel_ls_patches/master/scope-min-hooks-v1.6.patch | patch -p1

    # 6️⃣ SUSFS 2.0
    - name: Apply SUSFS 2.0
      run: |
        set +e
        curl -fsSL https://raw.githubusercontent.com/Red-A-Hawk/kernel_ls_patches/master/susfs-2.0.0.patch \
          | patch -p1 --batch --forward
        set -e

    # 7️⃣ Verify SUSFS
    - name: Verify susfs files
      run: |
        test -f fs/susfs.c
        test -f include/linux/susfs.h
        test -f include/linux/susfs_def.h

    # 8️⃣ Export build env (⚠️ لا نكسر clang)
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=0" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 9️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 🔟 Build kernel (🔥 stable)
    - name: Build kernel
      run: |
        set -o pipefail

        # ccache setup
        export CCACHE_CPP2=yes
        export CCACHE_SLOPPINESS=time_macros
        ccache -M 10G
        ccache -z

        make O=out -j$(nproc) \
          CC="ccache clang" \
          LLVM=1 \
          LLVM_IAS=0 \
          2>&1 | tee build.log

        ccache -s

    # 1️⃣1️⃣ Verify hooks.o
    - name: Verify hooks.o built
      run: |
        grep -E "hooks\.o" build.log > hooks-build.txt || true
        test -s hooks-build.txt

    # 1️⃣2️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || true
        nm out/vmlinux | grep -i susfs > nm-susfs.txt || true
        nm out/vmlinux > nm-full.txt

    # 1️⃣3️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../Kernel-violet-sukisu-susfs2.zip *

    # 1️⃣4️⃣ Sign zip
    - name: Sign zip
      run: |
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar \
          Kernel-violet-sukisu-susfs2.zip \
          Kernel-violet-sukisu-susfs2-signed.zip

    # 1️⃣5️⃣ Upload artifacts
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-debug
        path: |
          Kernel-violet-sukisu-susfs2-signed.zip
          build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
          hooks-build.txt
