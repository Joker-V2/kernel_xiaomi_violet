name: Build Kernel (violet | SukiSU Ultra + susfs2 | ZyC22 | SAFE)

on:
  push:
    branches: [ test4 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: test4
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 \
          openjdk-17-jre-headless \
          ccache

    # 3️⃣ ZyC Clang 22
    - name: Setup ZyC Clang 22
      run: |
        mkdir -p clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz
        tar -xzf Clang-22.0.0git-20250920.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH
        clang --version

    # 4️⃣ Mini Scope / inline hooks (NO_HOOK friendly)
    - name: Apply inline hooks
      run: |
        set -e
        curl -fsSL https://raw.githubusercontent.com/TheSillyOk/kernel_ls_patches/refs/heads/master/susfs-inline-hooks.patch | patch -p1

    # 5️⃣ SUSFS 2.0
    - name: Apply SUSFS 2.0
      run: |
        set +e
        curl -fsSL https://raw.githubusercontent.com/Red-A-Hawk/kernel_ls_patches/master/susfs-2.0.0.patch \
          | patch -p1 --batch --forward
        set -e

    # 6️⃣ Verify SUSFS
    - name: Verify SUSFS files
      run: |
        test -f fs/susfs.c
        test -f include/linux/susfs.h
        test -f include/linux/susfs_def.h

    # 7️⃣ Export environment (SAFE)
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=0" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 8️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 9️⃣ Prepare ccache (SAFE MODE)
    - name: Prepare ccache
      run: |
        ccache -M 5G
        ccache -z
        echo "CCACHE_CPP2=yes" >> $GITHUB_ENV
        echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
        echo "CCACHE_SLOPPINESS=file_macro,time_macros" >> $GITHUB_ENV

    # 🔟 Build kernel (ULTRA SAFE)
    - name: Build kernel
      run: |
        mkdir -p logs
        set +e

        make O=out -j4 \
          CC="ccache clang" \
          LLVM=1 \
          LLVM_IAS=0 \
          > logs/build.log 2>&1

        echo $? > logs/build.ret
        ccache -s

    # 1️⃣1️⃣ Check build result
    - name: Check build result
      run: |
        ret=$(cat logs/build.ret)
        if [ "$ret" != "0" ]; then
          echo "❌ Build failed"
          tail -n 200 logs/build.log
          exit 1
        fi
        echo "✅ Build OK"

    # 1️⃣2️⃣ Verify hooks
    - name: Verify hooks.o
      run: |
        grep -E "hooks\.o" logs/build.log > hooks-build.txt || true

    # 1️⃣3️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || true
        nm out/vmlinux | grep -i susfs > nm-susfs.txt || true
        nm out/vmlinux > nm-full.txt

    # 1️⃣4️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../Kernel-violet-sukisu-susfs2.zip *

    # 1️⃣5️⃣ Sign zip
    - name: Sign zip
      run: |
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar \
          Kernel-violet-sukisu-susfs2.zip \
          Kernel-violet-sukisu-susfs2-signed.zip

    # 1️⃣6️⃣ Upload artifacts
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-safe-debug
        path: |
          Kernel-violet-sukisu-susfs2-signed.zip
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
          hooks-build.txt
