name: Build Kernel (violet | SukiSU builtin + mini-scope + SUSFS 1.5.12)

on:
  workflow_dispatch:
  push:
    branches:
      - test4

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 2️⃣ Dependencies + ccache
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache

    # 3️⃣ ZyC Clang 22
    - name: Setup ZyC Clang 22
      run: |
        mkdir clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/22.0.0git-20250920-release/Clang-22.0.0git-20250920.tar.gz
        tar -xf Clang-22.0.0git-20250920.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH
        clang --version

    # 4️⃣ SukiSU builtin (OFFICIAL)
    - name: Setup SukiSU builtin
      run: |
        curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s builtin

    # 5️⃣ jeej
    - name: Apply jeej
      run: |
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0001-fs-exec-add-ksu-execveat-hook.patch | patch -p1
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0002-fs-open-add-ksu-faccessat-hook.patch | patch -p1
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0003-fs-read_write-add-ksu-vfs_read-hook.patch | patch -p1
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0004-fs-stat-add-ksu-vfs_statx-hook.patch | patch -p1
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0005-drivers-input-input-add-ksu-input_handle_event-hook.patch | patch -p1
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0006-fs-namespace-add-path-umount-hook.patch | patch -p1

    # 6️⃣ SUSFS 2.0.0
    - name: Apply SUSFS 2.0.0
      run: |
        set +e
        curl -fsSL https://raw.githubusercontent.com/Red-A-Hawk/Patch/kernel_xiaomi_violet/One-core.patch | patch -p1 --batch --forward
        set -e

    # 7️⃣ Verify SUSFS
    - name: Verify SUSFS files
      run: |
        test -f fs/susfs.c
        test -f include/linux/susfs.h
        test -f include/linux/susfs_def.h

    # 8️⃣ Build environment
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=0" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 9️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 🔟 Build kernel (SAFE + visible log)
    - name: Build kernel
      shell: bash
      run: |
        mkdir -p logs
        ccache -M 2G
        ccache -z

        stdbuf -oL -eL make O=out -j2 \
          CC="ccache clang" \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=0 \
          2>&1 | tee logs/build.log

        ccache -s

    # 1️⃣1️⃣ Verify hooks
    - name: Verify hooks.o
      run: |
        grep -E "hooks\.o" logs/build.log > hooks-build.txt || true

    # 1️⃣2️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || true
        nm out/vmlinux | grep -i susfs > nm-susfs.txt || true
        nm out/vmlinux > nm-full.txt

    # 1️⃣3️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../Kernel-violet-sukisu.zip *

    # 1️⃣4️⃣ Sign ZIP
    - name: Sign zip
      run: |
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar \
          Kernel-violet-sukisu.zip \
          Kernel-violet-sukisu-signed.zip

    # 1️⃣5️⃣ Upload artifacts
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-debug
        path: |
          Kernel-violet-sukisu-signed.zip
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
          hooks-build.txt
