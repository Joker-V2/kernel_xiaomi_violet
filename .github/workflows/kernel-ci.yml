
name: Build Kernel (violet | KernelSu-Next-legacy | susfs-V2.0.0)

on:
  workflow_dispatch:
  push:
    branches:
      - zycromerz 
      
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: zycromerz 
        fetch-depth: 1

    # 2️⃣ Install dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd \
          binutils-aarch64-linux-gnu \
          device-tree-compiler \
          lz4 xz-utils zlib1g-dev \
          openjdk-17-jdk \
          gcc g++ \
          python-is-python3 \
          p7zip-full \
          android-sdk-libsparse-utils \
          erofs-utils \
          gnupg \
          gperf \
          libx11-dev \
          libreadline-dev \
          libgl1 libgl1-mesa-dev \
          python3-markdown \
          libxml2-utils xsltproc \
          libtinfo6 \
          cpio kmod openssl pahole \
          libarchive-tools rsync \
          util-linux 

    # 3️⃣ Free up disk space
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h

    # 4️⃣ Setup 16GB Swap
    - name: Setup 16GB Swap
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile || true
        if command -v fallocate >/dev/null 2>&1; then
            sudo fallocate -l 16G /swapfile
        else
            sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
        fi
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        sudo sysctl vm.swappiness=40
        sudo sysctl vm.vfs_cache_pressure=50
        sudo sysctl vm.dirty_ratio=10
        sudo sysctl vm.dirty_background_ratio=5
        sudo sysctl vm.max_map_count=262144 || true

    # 5️⃣ Setup ZyCromerZ Clang
    - name: Setup ZyCromerZ Clang
      run: |
        CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz"
        wget -q "$CLANG_URL" -O zycromerz-clang.tar.gz
        mkdir -p zycromerz-clang
        tar -xf zycromerz-clang.tar.gz -C zycromerz-clang
        rm -f zycromerz-clang.tar.gz
        CLANG_PATH="$PWD/zycromerz-clang/bin"
        echo "$CLANG_PATH" >> $GITHUB_PATH
        echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
        CLANG_BIN=$(find "$CLANG_PATH" -name "clang-[0-9]*" -type f | head -1)
        CLANG_BASENAME=$(basename "$CLANG_BIN")
        echo "CLANG_BIN_NAME=$CLANG_BASENAME" >> $GITHUB_ENV
        echo "FULL_CLANG_PATH=$CLANG_PATH/clang" >> $GITHUB_ENV

    # 6️⃣ Setup Android Toolchains from GitHub
    - name: Setup Android Toolchains
      run: |
        TOOLS_DIR="$HOME/toolchains/android-tools"
        mkdir -p "$TOOLS_DIR"
        cd "$TOOLS_DIR"
        git clone --depth 1 --branch tools https://github.com/prabhatkrmishra/android-kernel-tools.git
        # Arm64
        cp -r android-kernel-tools/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/* aarch64/
        chmod +x aarch64/*
        # Arm32
        cp -r android-kernel-tools/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin/* arm32/
        chmod +x arm32/*
        echo "$TOOLS_DIR/aarch64" >> $GITHUB_PATH
        echo "$TOOLS_DIR/arm32" >> $GITHUB_PATH
        echo "AARCH64_TOOLCHAIN_PATH=$TOOLS_DIR/aarch64" >> $GITHUB_ENV
        echo "ARM32_TOOLCHAIN_PATH=$TOOLS_DIR/arm32" >> $GITHUB_ENV
        rm -rf android-kernel-tools
        cd "$GITHUB_WORKSPACE"

    # 7️⃣ Export env
    - name: Export environment variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "CLANG_VERSION=$CLANG_BIN_NAME" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        TOTAL_CORES=$(nproc)
        echo "TOTAL_CORES=$TOTAL_CORES" >> $GITHUB_ENV
        CORES=$(($TOTAL_CORES / 2)); [ $CORES -lt 2 ] && CORES=2
        echo "CORES=$CORES" >> $GITHUB_ENV
        MAKE_VERSION=$(make --version | head -1)
        if echo "$MAKE_VERSION" | grep -q "GNU Make 4"; then
          echo "MAKEFLAGS=-j$CORES --jobserver-auth=3,4" >> $GITHUB_ENV
        else
          echo "MAKEFLAGS=-j$CORES" >> $GITHUB_ENV
        fi
        echo "LDFLAGS=-Wl,--threads=1" >> $GITHUB_ENV
        ulimit -s unlimited

    # 8️⃣ Load defconfig
    - name: Load defconfig
      run: |
        echo "✅ إعداد CROSS_COMPILE و CROSS_COMPILE_ARM32 قبل defconfig"
        export CROSS_COMPILE=$AARCH64_TOOLCHAIN_PATH/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$ARM32_TOOLCHAIN_PATH/arm-linux-androideabi-
        echo "CROSS_COMPILE=$CROSS_COMPILE"
        echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
        make O=out vendor/violet-perf_defconfig

    # 9️⃣ Build kernel
    - name: Build kernel
      shell: bash
      run: |
        export CROSS_COMPILE=$AARCH64_TOOLCHAIN_PATH/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$ARM32_TOOLCHAIN_PATH/arm-linux-androideabi-
        TOTAL_CORES=$(nproc)
        CORES=$(($TOTAL_CORES / 2)); [ $CORES -lt 2 ] && CORES=2
        make O=out -j$CORES \
        ARCH=arm64 SUBARCH=arm64 \
        CC="ccache clang" \
        CROSS_COMPILE=$CROSS_COMPILE \
        CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
        CLANG_TRIPLE=aarch64-linux-gnu- \
        LLVM=1 LLVM_IAS=1 \
        2>&1 | tee logs/build.log
            
    # 🔟 Package AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../Kernel-violet-zycromerz-clang.zip *
        cd ..

    # 1️⃣1️⃣ Sign ZIP
    - name: Sign zip
      run: |
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar Kernel-violet-zycromerz-clang.zip Kernel-violet-zycromerz-clang-signed.zip

    # 1️⃣2️⃣ Upload ZIP
    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZyCromerZ-Clang-ZIP
        path: Kernel-violet-zycromerz-clang-signed.zip
        compression-level: 0

    # 1️⃣3️⃣ Upload compressed log
    - name: Upload Build Log (Full & Compressed)
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log-Full
        path: logs/build.log.gz
        compression-level: 0
