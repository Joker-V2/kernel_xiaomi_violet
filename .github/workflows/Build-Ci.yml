name: Build Kernel (violet | KernelSu-Next-legacy | susfs-V2.0.0)

on:
  workflow_dispatch:
  push:
    branches:
      - zycromerz 
      
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: zycromerz 
        fetch-depth: 1

    # 2️⃣ Dependencies المحسنة
    - name: 📦 Install all dependencies
      run: |
        echo "📦 تثبيت جميع الأدوات المطلوبة..."
        sudo apt update
        
        # تثبيت الأدوات الأساسية للبناء
        sudo apt install -y \
          # أدوات البناء الأساسية
          build-essential bc bison flex make cmake ninja-build \
          
          # مكتبات Kernel
          libssl-dev libelf-dev libncurses-dev libc6-dev \
          
          # Cross-compilation
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
          
          # Python
          python3 python3-pip python-is-python3 \
          
          # Java للتوقيع
          openjdk-17-jdk openjdk-17-jre-headless \
          
          # أدوات الضغط والأرشفة
          zip unzip zstd lz4 xz-utils zlib1g-dev p7zip-full \
          
          # أدوات الشبكة والتحميل
          curl wget git rsync \
          
          # أدوات Android/Kernel إضافية
          device-tree-compiler \
          android-sdk-libsparse-utils \
          erofs-utils \
          kmod cpio pahole \
          
          # CCache لتسريع البناء
          ccache \
          
          # أدوات النظام
          gnupg gperf \
          libxml2-utils xsltproc \
          libreadline-dev \
          libarchive-tools \
          openssl \
          
          # إصلاح الاعتمادات
          libtinfo6 libx11-dev \
          libgl1-mesa-dev libgl1 \
          
          --fix-missing
        
        echo "✅ تم تثبيت جميع الأدوات بنجاح"
        
        # التحقق من الأدوات المهمة
        echo "🔍 التحقق من الأدوات المثبتة:"
        which ccache && ccache --version | head -1
        which aarch64-linux-gnu-gcc && aarch64-linux-gnu-gcc --version | head -1
        which python3 && python3 --version
        which java && java --version | head -1

    # 3️⃣ ZyCromerZ Clang مع الكشف التلقائي ⭐⭐
    - name: Setup ZyCromerZ Clang
      id: setup_clang
      run: |
        echo "📥 تحميل ZyCromerZ Clang..."
        
        # ⭐⭐ يمكن تغيير الرابط هنا فقط ⭐⭐
        CLANG_URL="https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz"
        
        wget -q "$CLANG_URL" -O zycromerz-clang.tar.gz
        
        echo "📦 فك الضغط..."
        mkdir -p zycromerz-clang
        tar -xf zycromerz-clang.tar.gz -C zycromerz-clang
        
        rm -f zycromerz-clang.tar.gz
        
        CLANG_PATH="$PWD/zycromerz-clang/bin"
        
        # ⭐⭐ الكشف التلقائي عن إصدار Clang ⭐⭐
        echo "🔍 الكشف التلقائي عن Clang..."
        
        # البحث عن clang-* (مثل clang-23, clang-22, clang-18)
        CLANG_BIN=$(find "$CLANG_PATH" -name "clang-[0-9]*" -type f | head -1)
        
        if [ -z "$CLANG_BIN" ]; then
          # محاولة أخرى بنمط مختلف
          CLANG_BIN=$(find "$CLANG_PATH" -name "clang*" -type f ! -name "clang++*" ! -name "*.so" ! -name "*.dll" | grep -E "/clang[^-]" | head -1)
        fi
        
        if [ -z "$CLANG_BIN" ]; then
          echo "❌ لم يتم العثور على clang في $CLANG_PATH"
          echo "📋 محتويات المجلد:"
          ls -la "$CLANG_PATH/"
          exit 1
        fi
        
        CLANG_BASENAME=$(basename "$CLANG_BIN")
        echo "✅ وجد Clang: $CLANG_BASENAME"
        
        # إنشاء رابط رمزي clang
        if [ ! -L "$CLANG_PATH/clang" ] && [ ! -f "$CLANG_PATH/clang" ]; then
          echo "🔗 إنشاء رابط رمزي: clang -> $CLANG_BASENAME"
          ln -sf "$CLANG_BASENAME" "$CLANG_PATH/clang"
        fi
        
        # البحث عن clang++ المقابل
        CLANGPP_PATTERN=$(echo "$CLANG_BASENAME" | sed 's/^clang/clang++/')
        if [ -f "$CLANG_PATH/$CLANGPP_PATTERN" ] && [ ! -L "$CLANG_PATH/clang++" ] && [ ! -f "$CLANG_PATH/clang++" ]; then
          echo "🔗 إنشاء رابط رمزي: clang++ -> $CLANGPP_PATTERN"
          ln -sf "$CLANGPP_PATTERN" "$CLANG_PATH/clang++"
        fi
        
        # التحقق من أدوات LLVM الأساسية
        echo "🔧 التحقق من أدوات LLVM..."
        REQUIRED_TOOLS="llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip"
        for tool in $REQUIRED_TOOLS; do
          if [ -f "$CLANG_PATH/$tool" ]; then
            echo "✅ $tool موجود"
          else
            echo "⚠️  $tool غير موجود - قد يسبب مشاكل"
          fi
        done
        
        echo "📋 محتويات مجلد Clang (مختصر):"
        ls -la "$CLANG_PATH/" | grep -E "^l.*clang|^[^d].*(clang|llvm)" | head -15
        
        # إضافة إلى PATH
        echo "$CLANG_PATH" >> $GITHUB_PATH
        
        # حفظ معلومات Clang للمراحل التالية
        echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
        echo "CLANG_BIN_NAME=$CLANG_BASENAME" >> $GITHUB_ENV
        
        echo "✅ ZyCromerZ Clang جاهز! ($CLANG_BASENAME)"

    # 🆕 التحقق التلقائي من Clang
    - name: Verify Clang Auto-Detection
      run: |
        echo "🔍 التحقق التلقائي من Clang..."
        
        echo "📋 معلومات Clang المكتشف:"
        echo "CLANG_PATH: $CLANG_PATH"
        echo "CLANG_BIN_NAME: $CLANG_BIN_NAME"
        
        echo "🔎 البحث عن clang في PATH:"
        which clang || { echo "❌ clang غير موجود في PATH"; exit 1; }
        
        CLANG_ACTUAL=$(which clang)
        echo "✅ clang موجود في: $CLANG_ACTUAL"
        
        # التحقق من الرابط الرمزي
        if [ -L "$CLANG_ACTUAL" ]; then
          REAL_CLANG=$(readlink -f "$CLANG_ACTUAL")
          echo "🔗 clang هو رابط رمزي إلى: $REAL_CLANG"
          
          if [ -f "$REAL_CLANG" ]; then
            echo "✅ الملف الحقيقي موجود"
          else
            echo "❌ الملف الحقيقي غير موجود!"
            exit 1
          fi
        fi
        
        echo "📊 معلومات Clang:"
        clang --version | head -5
        
        # التحقق من الإصدار المحدد
        if [ -n "$CLANG_BIN_NAME" ]; then
          echo "🔍 التحقق من الإصدار المحدد ($CLANG_BIN_NAME):"
          "$CLANG_PATH/$CLANG_BIN_NAME" --version | head -3
        fi
        
        echo "✅ التحقق التلقائي اكتمل!"

    # 4️⃣ Export env
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 🔍 خطوة جديدة: تحقق من الموارد
    - name: Check System Resources
      run: |
        echo "========================================"
        echo "🖥️  فحص تفصيلي لموارد النظام"
        echo "========================================"
        
        echo "🔧 معلومات المعالج (CPU):"
        echo "------------------------"
        TOTAL_CORES=$(nproc)
        echo "الأنوية الكلية: $TOTAL_CORES"
        echo "نموذج المعالج: $(lscpu | grep 'Model name' | cut -d: -f2 | xargs)"
        
        echo ""
        echo "💾 معلومات الذاكرة (RAM):"
        echo "------------------------"
        TOTAL_RAM_KB=$(grep MemTotal /proc/meminfo | awk '{print $2}')
        TOTAL_RAM_GB=$((TOTAL_RAM_KB / 1024 / 1024))
        TOTAL_RAM_MB=$((TOTAL_RAM_KB / 1024))
        
        FREE_RAM_KB=$(grep MemFree /proc/meminfo | awk '{print $2}')
        FREE_RAM_GB=$((FREE_RAM_KB / 1024 / 1024))
        FREE_RAM_MB=$((FREE_RAM_KB / 1024))
        
        AVAILABLE_RAM_MB=$(free -m | awk '/^Mem:/{print $7}')
        
        echo "الذاكرة الكلية: ${TOTAL_RAM_GB} GB (${TOTAL_RAM_MB} MB)"
        echo "الذاكرة الحرة: ${FREE_RAM_GB} GB (${FREE_RAM_MB} MB)"
        echo "الذاكرة المتاحة: ${AVAILABLE_RAM_MB} MB"
        
        echo ""
        echo "💿 معلومات التخزين (Disk):"
        echo "-------------------------"
        df -h /
        
        echo ""
        echo "⚡ اكتشاف موارد قوية:"
        echo "---------------------"
        echo "✅ النظام لديه $TOTAL_CORES أنوية و $AVAILABLE_RAM_MB MB ذاكرة حرة"
        echo "========================================"
        
        # حفظ عدد الأنوية للمراحل التالية
        echo "TOTAL_CORES=$TOTAL_CORES" >> $GITHUB_ENV
        echo "TOTAL_RAM_MB=$TOTAL_RAM_MB" >> $GITHUB_ENV
        echo "AVAILABLE_RAM_MB=$AVAILABLE_RAM_MB" >> $GITHUB_ENV

    # 💾 Hybrid Swap System (ZRAM + Disk Swap)
    - name: Setup Hybrid Swap (ZRAM 4GB + Disk Swap 2GB)
      run: |
        echo "💾 إعداد نظام Swap هجين (ZRAM + Disk)..."
        
        # تنظيف أي swap سابق
        echo "🧹 تنظيف swap سابق..."
        sudo swapoff -a 2>/dev/null || true
        sudo rm -f /swapfile 2>/dev/null || true
        
        # ============= الجزء 1: ZRAM (الأولوية العالية) =============
        echo ""
        echo "⚡ الجزء 1: ZRAM المضغوط (للسرعة)"
        
        # تحميل وحدة zram
        sudo modprobe zram 2>/dev/null || { echo "❌ لا يمكن تحميل وحدة ZRAM"; }
        
        # حجم ZRAM: 4GB مضغوط (يعادل ~8GB فعال)
        ZRAM_SIZE_MB=4096  # 4GB
        
        if [ -d /sys/block/zram0 ]; then
            echo "📏 إنشاء ZRAM بحجم: $((ZRAM_SIZE_MB / 1024)) GB"
            
            # تخصيص حجم ZRAM
            echo $ZRAM_SIZE_MB > /sys/block/zram0/disksize
            
            # استخدام خوارزمية ضغط lz4 (الأسرع)
            if [ -f /sys/block/zram0/comp_algorithm ]; then
                echo lz4 > /sys/block/zram0/comp_algorithm 2>/dev/null || \
                echo lzo-rle > /sys/block/zram0/comp_algorithm
                echo "🔧 خوارزمية الضغط: lz4"
            fi
            
            # إنشاء swap على ZRAM
            sudo mkswap /dev/zram0
            sudo swapon /dev/zram0 -p 100  # أولوية عالية (100)
            
            echo "✅ ZRAM مفعّل بنجاح (4GB مضغوط)"
        else
            echo "⚠️  ZRAM غير متوفر، تخطي..."
        fi
        
        # ============= الجزء 2: Swap على القرص (للطوارئ) =============
        echo ""
        echo "💿 الجزء 2: Swap على القرص (للطوارئ)"
        
        # حجم صغير للطوارئ فقط
        SWAP_SIZE_MB=2048  # 2GB
        
        echo "📏 إنشاء swap على القرص بحجم: $((SWAP_SIZE_MB / 1024)) GB"
        
        # استخدام fallocate إذا متوفر (أسرع)
        if command -v fallocate >/dev/null 2>&1; then
            sudo fallocate -l ${SWAP_SIZE_MB}M /swapfile && echo "⚡ تم باستخدام fallocate"
        else
            # استخدام dd مع حجم كتل صغير لتجنب المشاكل
            echo "🐢 يستخدم dd (قد يأخذ بضع ثوان)..."
            sudo dd if=/dev/zero of=/swapfile bs=4M count=$((SWAP_SIZE_MB / 4)) status=none
        fi
        
        # إعداد swap file
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile -p 50  # أولوية أقل من ZRAM (50)
        
        # ============= الجزء 3: تحسين إعدادات النظام =============
        echo ""
        echo "⚙️  الجزء 3: تحسين إعدادات النظام"
        
        # swappiness متوسط (80 يفضل swap، 20 يفضل RAM)
        sudo sysctl vm.swappiness=60
        echo "✅ vm.swappiness=60 (توازن بين RAM وswap)"
        
        # vfs_cache_pressure أقل للاحتفاظ بcache الملفات
        sudo sysctl vm.vfs_cache_pressure=40
        echo "✅ vm.vfs_cache_pressure=40 (يحفظ cache الملفات)"
        
        # إعدادات الكتابة المبكرة للقرص
        sudo sysctl vm.dirty_ratio=10
        sudo sysctl vm.dirty_background_ratio=5
        echo "✅ كتابة مبكرة (dirty_ratio=10, background=5)"
        
        # زيادة max_map_count مهم لـ Clang/LLVM
        sudo sysctl vm.max_map_count=524288 2>/dev/null || true
        echo "✅ vm.max_map_count=524288 (مهم لـ Clang)"
        
        # ============= الجزء 4: عرض النتائج =============
        echo ""
        echo "📊 نتائج نظام Swap الهجين:"
        echo "================================"
        
        echo "💾 حالة الذاكرة:"
        free -h
        
        echo ""
        echo "🔄 Swap المفعل:"
        swapon --show
        
        if [ -d /sys/block/zram0 ]; then
            echo ""
            echo "⚡ معلومات ZRAM:"
            if command -v zramctl >/dev/null 2>&1; then
                sudo zramctl
            else
                echo "الجهاز: /dev/zram0"
                echo "الحجم: 4GB (مضغوط)"
                echo "الخوارزمية: lz4"
            fi
        fi
        
        echo ""
        echo "🎯 نظام Swap الهجين جاهز!"
        echo "   • ZRAM: 4GB مضغوط (للسرعة)"
        echo "   • Disk Swap: 2GB (للطوارئ)"
        echo "================================"

    # 6️⃣ Build kernel - نظام التبديل السهل ⭐⭐
    - name: Build kernel
      shell: bash
      env:
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        CLANG_TRIPLE: aarch64-linux-gnu-
      run: |
        set -o pipefail
        mkdir -p logs
        
        # ⭐⭐ حجم CCache قبل البناء ⭐⭐
        echo "📊 حجم CCache قبل البناء:"
        ccache -s | grep -E "cache hit rate|cache size|max cache size" || echo "ℹ️  لا توجد إحصائيات سابقة"
        echo ""
        
        # تنظيف إحصائيات CCache للبدء من جديد
        ccache -z
        echo "✅ تم بدء إحصائيات CCache جديدة"
        echo ""
        
        echo "🚀 بدء بناء النواة..."
        echo "🔧 Clang الإصدار: $CLANG_BIN_NAME"
        
        # ============================================
        # ⭐⭐ نظام التبديل السهل - اختر خياراً واحداً ⭐⭐
        # ============================================
        
        TOTAL_CORES=$(nproc)
        echo "🔧 الأنوية المتاحة: $TOTAL_CORES"
        
        # 🟢 الخيار 1: جميع الأنوية (مفعّل حالياً) 🟢
        #   - أسرع بناء
        #   - مناسب للأنظمة القوية
        #   - قد يستهلك ذاكرة أكثر
        # CORES=$TOTAL_CORES
        
        # 🔵 الخيار 2: نصف الأنوية 🔵
        #   - أكثر استقراراً
        #   - أفضل مع Clang 20
        #   - مناسب للذاكرة المحدودة
        CORES=$(($TOTAL_CORES / 2))
        [ $CORES -lt 2 ] && CORES=2
        
        # ============================================
        # ⚠️  تعليمات التبديل:
        # 1. أضف # قبل السطر الذي تريد تعطيله
        # 2. احذف # من السطر الذي تريد تفعيله
        # 3. مثال: لتفعيل الخيار 2:
        #    - # CORES=$TOTAL_CORES ← مضاف #
        #    - CORES=$(($TOTAL_CORES / 2)) ← محذوف #
        # ============================================
        
        # ✅ عرض الخيار المفعّل
        if [ $CORES -eq $TOTAL_CORES ]; then
            echo "✅ الخيار المفعّل: جميع الأنوية"
            echo "⚡ السرعة: عالية | الاستقرار: متوسط"
        else
            echo "✅ الخيار المفعّل: نصف الأنوية"  
            echo "⚡ السرعة: متوسطة | الاستقرار: عالي"
        fi
        
        echo "🎯 الأنوية المستخدمة: $CORES"
        echo "💡 نصيحة: مع Clang 23، الخيار 2 أكثر استقراراً"
        
        # التحقق من الإعدادات
        echo "📋 الإعدادات النهائية:"
        echo "  • Clang: $CLANG_BIN_NAME"
        echo "  • الأنوية: $CORES/$TOTAL_CORES"
        echo "  • CCache: حجم افتراضي"
        echo "  • Swap: ZRAM 4GB + Disk 2GB"
        
        # البناء
        echo "🏗️  بدء عملية البناء..."
        stdbuf -oL -eL make O=out -j$CORES \
        CC="ccache clang" \
        CLANG_TRIPLE="$CLANG_TRIPLE" \
        CROSS_COMPILE="$CROSS_COMPILE" \
        CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
        LLVM=1 \
        LLVM_IAS=1 \
        2>&1 | tee logs/build.log
        
        BUILD_STATUS=${PIPESTATUS[0]}
        
        # ⭐⭐ إحصائيات CCache بعد البناء ⭐⭐
        echo ""
        echo "📈 إحصائيات CCache بعد البناء:"
        echo "────────────────────────────────"
        ccache -s | grep -E "cache hit rate|cache size|max cache size"
        echo "────────────────────────────────"
        
        echo "📊 استخدام الموارد بعد البناء:"
        free -h
        
        if [ $BUILD_STATUS -eq 0 ] && [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅✅✅ تم بناء النواة بنجاح!"
            echo "🎯 الإعدادات المستخدمة:"
            echo "   - Clang: $CLANG_BIN_NAME"
            echo "   - الأنوية: $CORES"
            echo "   - CCache: حجم افتراضي"
            echo "   - Swap: نظام هجين"
            ls -lh out/arch/arm64/boot/Image.gz
        else
            echo "❌ فشل بناء النواة!"
            echo "💡 جرب تغيير عدد الأنوية إذا استمر الفشل"
            exit 1
        fi

    # ضغط اللوغ - ⭐⭐ مصحح ⭐⭐
    - name: Compress build log
      if: always()
      run: |
        echo "📦 محاولة ضغط اللوغ..."
        if [ -f "logs/build.log" ]; then
            gzip -9 logs/build.log
            echo "✅ تم ضغط اللوغ بنجاح"
            echo "📏 حجم build.log.gz:"
            ls -lh logs/build.log.gz
        else
            echo "⚠️  ملف build.log غير موجود (قد يكون البناء فشل مبكراً)"
        fi

    # 7️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل الرموز..."
        if [ -f "out/vmlinux" ]; then
            nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || echo "⚠️  لم يتم العثور على رموز KSU"
            nm out/vmlinux | grep -i susfs > nm-susfs.txt || echo "⚠️  لم يتم العثور على رموز susfs"
            nm out/vmlinux > nm-full.txt
            
            echo "📏 أحجام الملفات:"
            ls -lh nm-*.txt
            
            echo "✅ تم إنشاء ملفات التحليل"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi
    
    # 8️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        echo "📦 تعبئة AnyKernel3..."
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        
        cd AK3
        zip -r9 ../Kernel-violet-zycromerz-clang.zip *
        cd ..
        
        echo "📏 حجم ZIP:"
        ls -lh Kernel-violet-zycromerz-clang.zip
        echo "✅ تم إنشاء ZIP"
    
    # 9️⃣ Sign ZIP
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar Kernel-violet-zycromerz-clang.zip Kernel-violet-zycromerz-clang-signed.zip
        
        echo "📏 حجم ZIP الموقّع:"
        ls -lh Kernel-violet-zycromerz-clang-signed.zip
        echo "✅ تم التوقيع"
    
    # 🔟 رفع ZIP
    - name: Upload Kernel ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZyCromerZ-Clang-ZIP
        path: Kernel-violet-zycromerz-clang-signed.zip
        compression-level: 0
    
    # 1️⃣1️⃣ رفع اللوغ الكامل المضغوط
    - name: Upload Build Log (Full & Compressed)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log-Full
        path: logs/build.log.gz
        retention-days: 7
        compression-level: 0
    
    # 1️⃣2️⃣ رفع التحليلات
    - name: Upload Analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Symbol-Analysis
        path: |
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
        retention-days: 5
        compression-level: 9

    # ملخص البناء
    - name: Build Summary
      if: always()
      run: |
        echo "📊 ملخص البناء:"
        echo "================================="
        echo "🔧 Clang المستخدم: $CLANG_BIN_NAME"
        echo "📁 مسار Clang: $CLANG_PATH"
        echo ""
        echo "⚡ إعدادات البناء:"
        echo "  - الأنوية: $TOTAL_CORES أنوية"
        echo "  - CCache: حجم افتراضي"
        echo "  - نظام Swap: ZRAM 4GB + Disk 2GB"
        echo ""
        echo "📦 الملفات المنتجة:"
        ls -lh Kernel-violet-zycromerz-clang-signed.zip 2>/dev/null || echo "⚠️  ZIP غير موجود"
        ls -lh logs/build.log.gz 2>/dev/null || echo "⚠️  اللوغ غير موجود"
        echo "================================="
        echo "🎯 اكتمل البناء بنجاح!"
