name: Pull KernelSU-Next to zyc4 Branch
on:
  workflow_dispatch:

jobs:
  pull-ksu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source (Branch zyc4)
        uses: actions/checkout@v4
        with:
          ref: zyc4  # التأكد من العمل على الفرع المطلوب
          fetch-depth: 0

      - name: Clean and Pull KernelSU Directory
        run: |
          # 1. تنظيف أي ملفات قديمة في المسار المستهدف
          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu

          # 2. سحب المجلد المحدد من مستودع KernelSU-Next (فرع legacy-susfs)
          git clone --depth 1 -b legacy-susfs --filter=blob:none --sparse https://github.com/sidex15/KernelSU-Next.git temp_ksu
          cd temp_ksu
          git sparse-checkout set kernel/
          
          # 3. نقل المحتويات فقط إلى drivers/kernelsu
          cp -r kernel/* ../drivers/kernelsu/
          cd ..
          rm -rf temp_ksu

          echo "✅ Files pulled successfully to drivers/kernelsu on branch zyc4"

      - name: Commit and Push to zyc4
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add drivers/kernelsu
          # تجنب الخطأ في حال لم تتغير الملفات
          git commit -m "Integrated KernelSU-Next (legacy-susfs) into zyc4 branch" || echo "No changes to commit"
          git push origin zyc4
