name: 🗑️ Auto Delete Last 10 Commits

on:
  workflow_dispatch: # متاح للتشغيل اليدوي أيضاً
  push:
    branches:
      - sixteen # سيعمل السكريبت تلقائياً عند الدفع لهذا الفرع

jobs:
  delete-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: write # صلاحية ضرورية لعمل الـ Force Push
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Reset and Force Push
        run: |
          # إعداد الهوية
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          # التبديل للفرع المراد تنظيفه (مثلاً zyc2)
          git checkout zyc2

          echo "⚠️ جاري حذف آخر 10 كوميتات من فرع zyc2..."
          
          # التراجع 10 خطوات
          git reset --hard HEAD~10

          # الدفع بالقوة لتحديث السجل في جيت هوب
          git push origin zyc2 --force

          echo "✅ تم التنظيف بنجاح!"
