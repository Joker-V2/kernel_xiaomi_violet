name: 🗑️ Auto Delete Last 10 Commits

on:
  workflow_dispatch:
  push:
    branches: zyc2

jobs:
  ultimate-cherry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    
    steps:
      - name: 📦 Checkout zyc2
        uses: actions/checkout@v4
        with:
          ref: zyc2

      - name: ⚙️ Reset and Force Push
        run: |
          # إعداد الهوية
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          # التبديل للفرع المراد تنظيفه (مثلاً zyc2)
          git checkout zyc2

          echo "⚠️ جاري حذف آخر 10 كوميتات من فرع zyc2..."
          
          # التراجع 10 خطوات
          git reset --hard HEAD~10

          # الدفع بالقوة لتحديث السجل في جيت هوب
          git push origin zyc2 --force

          echo "✅ تم التنظيف بنجاح!"
