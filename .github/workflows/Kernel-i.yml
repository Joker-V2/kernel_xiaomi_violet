name: Build Kernel (AOSP LLVM + System GCC)

on:
  workflow_dispatch:
  push:
    branches:
      - test7

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4

    # 2️⃣ 📦 أدوات التثبيت كما هي
    - name: Install system tools
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd
        
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 3️⃣ 📥 AOSP Clang مع كل أدوات LLVM
    - name: Setup AOSP Clang with ALL LLVM tools
      run: |
        echo "📥 تحميل AOSP Clang..."
        wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-platform-15.0.0_r13/clang-r522817.tar.gz" -O aosp-clang.tar.gz
        tar -xf aosp-clang.tar.gz
        
        echo "🔍 جمع كل أدوات LLVM..."
        
        # إنشاء مجلد موحد لكل أدوات LLVM
        mkdir -p aosp-llvm-bin
        
        # نسخ كل الملفات التنفيذية
        find . -type f -executable -exec cp {} aosp-llvm-bin/ 2>/dev/null \; || true
        
        cd aosp-llvm-bin
        
        # ⭐⭐ البحث عن الملفات الأساسية
        CLANG_FILE="clang"
        [ ! -f "$CLANG_FILE" ] && CLANG_FILE=$(ls clang* 2>/dev/null | head -1)
        
        # إنشاء روابط للأسماء المطلوبة
        [ ! -f "clang++" ] && ln -sf "$CLANG_FILE" clang++
        [ ! -f "ld.lld" ] && [ -f "lld" ] && ln -sf lld ld.lld
        
        # جعل كل الملفات قابلة للتنفيذ
        chmod +x *
        
        AOSP_PATH="$PWD"
        echo "AOSP_PATH=$AOSP_PATH" >> $GITHUB_ENV
        
        # إضافة إلى PATH
        echo "$AOSP_PATH" >> $GITHUB_PATH
        
        # ⭐⭐ تعيين كل المتغيرات كما طلبت
        echo "CC=$AOSP_PATH/clang" >> $GITHUB_ENV
        echo "AR=$AOSP_PATH/llvm-ar" >> $GITHUB_ENV
        echo "NM=$AOSP_PATH/llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=$AOSP_PATH/llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=$AOSP_PATH/llvm-objdump" >> $GITHUB_ENV
        echo "READELF=$AOSP_PATH/llvm-readelf" >> $GITHUB_ENV
        echo "OBJSIZE=$AOSP_PATH/llvm-size" >> $GITHUB_ENV
        echo "STRIP=$AOSP_PATH/llvm-strip" >> $GITHUB_ENV
        echo "HOSTCC=$AOSP_PATH/clang" >> $GITHUB_ENV
        echo "HOSTCXX=$AOSP_PATH/clang++" >> $GITHUB_ENV
        echo "LD=$AOSP_PATH/ld.lld" >> $GITHUB_ENV

    # 4️⃣ Export env
    - name: Export environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ 🔥 البناء بالضبط كما تريد
    - name: Build exact as requested
      shell: bash
      env:
        CC: ${{ env.CC }}
        AR: ${{ env.AR }}
        NM: ${{ env.NM }}
        OBJCOPY: ${{ env.OBJCOPY }}
        OBJDUMP: ${{ env.OBJDUMP }}
        READELF: ${{ env.READELF }}
        OBJSIZE: ${{ env.OBJSIZE }}
        STRIP: ${{ env.STRIP }}
        HOSTCC: ${{ env.HOSTCC }}
        HOSTCXX: ${{ env.HOSTCXX }}
        LD: ${{ env.LD }}
        CROSS_COMPILE: ${{ env.CROSS_COMPILE }}
        CROSS_COMPILE_ARM32: ${{ env.CROSS_COMPILE_ARM32 }}
      run: |
        echo "🚀 البناء بالإعداد الدقيق..."
        echo "📋 الإعدادات:"
        echo "CC=$CC"
        echo "AR=$AR"
        echo "CROSS_COMPILE=$CROSS_COMPILE"
        
        # ⭐ بناء آمن
        make -j1 \
          O=out \
          ARCH=arm64 \
          CC="$CC" \
          AR="$AR" \
          NM="$NM" \
          OBJCOPY="$OBJCOPY" \
          OBJDUMP="$OBJDUMP" \
          READELF="$READELF" \
          OBJSIZE="$OBJSIZE" \
          STRIP="$STRIP" \
          HOSTCC="$HOSTCC" \
          HOSTCXX="$HOSTCXX" \
          LD="$LD" \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          LLVM=1 \
          LLVM_IAS=1 \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          2>&1 | tee build_exact.log
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ ✅ ✅ نجاح دقيق!"
        else
            echo "❌ فشل"
            exit 1
        fi

    # 7️⃣ Packaging
    - name: Package Kernel
      run: |
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../kernel-exact.zip *
