name: Build Kernel (violet | KernelSu-Next-legacy | susfs-V2.0.0)

on:
  workflow_dispatch:
  push:
    branches:
      - zycromerz 
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: zycromerz 
        fetch-depth: 1

    # 2️⃣ Dependencies - ⭐ مثل المثال ⭐
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \          # ⭐ للنظام
          gcc-arm-linux-gnueabi \          # ⭐ للنظام
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd

    # 3️⃣ ZyCromerZ Clang - ⭐ مثل المثال ⭐
    - name: Setup ZyCromerZ Clang
      run: |
        echo "📥 تحميل ZyCromerZ Clang..."
        wget -q "https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz" -O zycromerz-clang.tar.gz
        
        mkdir -p zycromerz-clang
        tar -xf zycromerz-clang.tar.gz -C zycromerz-clang
        
        CLANG_PATH="$PWD/zycromerz-clang/bin"
        
        # ⭐ مثل المثال: إضافة إلى PATH فقط
        echo "$CLANG_PATH" >> $GITHUB_PATH
        
        # ⭐ ليس CC=$CLANG_PATH/clang-23
        # ⭐ النظام سيستخدم clang من PATH
        
        echo "✅ ZyCromerZ Clang في PATH!"

    # 4️⃣ Export env - ⭐ مثل المثال ⭐
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        # ⭐ لا CLANG_TRIPLE هنا - في سطر make

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ Build kernel - ⭐⭐ مطابق للمثال تماماً ⭐⭐
    - name: Build kernel
      shell: bash
      run: |
        set -o pipefail
        mkdir -p logs
        ccache -M 1G
        ccache -z
        
        echo "🚀 البناء بنفس طريقة المثال..."
        echo "🔧 CC: ccache clang (من PATH)"
        echo "🔧 CROSS_COMPILE: aarch64-linux-gnu- (نظامي)"
        echo "🔧 CLANG_TRIPLE: aarch64-linux-gnu-"
        
        # التحقق
        echo "🧪 التحقق:"
        which clang
        clang --version | head -2
        
        # ⭐⭐ مطابق للمثال تماماً ⭐⭐
        stdbuf -oL -eL make O=out -j$(nproc) \
          CC="ccache clang" \                     # ⭐ مثل المثال
          CLANG_TRIPLE="aarch64-linux-gnu-" \     # ⭐ مثل المثال
          CROSS_COMPILE="aarch64-linux-gnu-" \    # ⭐ مثل المثال
          CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \ # ⭐ مثل المثال
          LLVM=1 \                                # ⭐ مثل المثال
          LLVM_IAS=1 \                            # ⭐ مثل المثال
          2>&1 | tee logs/build.log
        
        ccache -s
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ تم بناء النواة بنجاح (بنفس طريقة المثال)!"
        else
            echo "❌ فشل بناء النواة!"
            exit 1
        fi

    # ... باقي السكربت كما هو
