name: Build Kernel (violet | KernelSu-Next-legacy | susfs-V2.0.0)

on:
  workflow_dispatch:
  push:
    branches:
      - zycromerz 
jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: zycromerz 
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd

    # 🆕 تحرير مساحة القرص
    - name: Free up disk space
      run: |
        echo "🧹 تحرير مساحة القرص..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        
        echo "📊 المساحة المتاحة:"
        df -h

    # 3️⃣ ZyCromerZ Clang
    - name: Setup ZyCromerZ Clang
      run: |
        echo "📥 تحميل ZyCromerZ Clang..."
        wget -q "https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz" -O zycromerz-clang.tar.gz
        
        echo "📦 فك الضغط..."
        mkdir -p zycromerz-clang
        tar -xf zycromerz-clang.tar.gz -C zycromerz-clang
        
        # حذف الملف المضغوط فوراً
        rm -f zycromerz-clang.tar.gz
        
        CLANG_PATH="$PWD/zycromerz-clang/bin"
        
        echo "CC=$CLANG_PATH/clang-23" >> $GITHUB_ENV
        echo "AR=$CLANG_PATH/llvm-ar" >> $GITHUB_ENV
        echo "NM=$CLANG_PATH/llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=$CLANG_PATH/llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=$CLANG_PATH/llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=$CLANG_PATH/llvm-strip" >> $GITHUB_ENV
        
        echo "$CLANG_PATH" >> $GITHUB_PATH
        echo "✅ ZyCromerZ Clang جاهز!"
        
        echo "📊 المساحة بعد Clang:"
        df -h

    # 4️⃣ Export env 
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ Build kernel (مع حفظ اللوغ الكامل ✅)
    - name: Build kernel
      shell: bash
      env:
        CC: ${{ env.CC }}
        AR: ${{ env.AR }}
        NM: ${{ env.NM }}
        OBJCOPY: ${{ env.OBJCOPY }}
        OBJDUMP: ${{ env.OBJDUMP }}
        STRIP: ${{ env.STRIP }}
        CLANG_TRIPLE: aarch64-linux-gnu-
      run: |
        set -o pipefail
        mkdir -p logs
        
        # تقليل ccache
        ccache -M 1G
        ccache -z
        
        echo "🚀 بدء بناء النواة..."
        echo "🔧 CC: $CC"
        echo "🔧 AR: $AR"
        echo "🔧 NM: $NM"
        echo "🔧 CLANG_TRIPLE: $CLANG_TRIPLE"
        
        $CC --version | head -2
        
        echo "📊 الموارد قبل البناء:"
        df -h
        free -h
        
        # 🆕 تقليل عدد الـ cores لتجنب LLVM Broken Pipe
        CORES=$(($(nproc) / 2))
        [ $CORES -lt 2 ] && CORES=2
        
        echo "🔧 استخدام $CORES cores (من أصل $(nproc))"
        
        # 🆕 حفظ اللوغ الكامل مباشرة إلى ملف (بدون تحميله في الذاكرة)
        make O=out -j$CORES \
          CC="ccache $CC" \
          AR="$AR" \
          NM="$NM" \
          OBJCOPY="$OBJCOPY" \
          OBJDUMP="$OBJDUMP" \
          STRIP="$STRIP" \
          CLANG_TRIPLE="$CLANG_TRIPLE" \
          > logs/build.log 2>&1
        
        BUILD_STATUS=$?
        
        # عرض آخر 50 سطر على الشاشة
        echo "📋 آخر 50 سطر من البناء:"
        tail -n 50 logs/build.log
        
        ccache -s
        
        echo "📊 الموارد بعد البناء:"
        df -h
        free -h
        
        # فحص حجم اللوغ
        echo "📏 حجم build.log:"
        ls -lh logs/build.log
        
        if [ $BUILD_STATUS -eq 0 ] && [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ تم بناء النواة بنجاح!"
            ls -lh out/arch/arm64/boot/Image.gz
        else
            echo "❌ فشل بناء النواة!"
            echo "📋 آخر 200 سطر من اللوغ:"
            tail -n 200 logs/build.log
            exit 1
        fi

    # 🆕 ضغط اللوغ الكامل
    - name: Compress build log
      if: always()
      run: |
        echo "📦 ضغط اللوغ الكامل..."
        gzip -9 logs/build.log
        echo "📏 حجم build.log.gz:"
        ls -lh logs/build.log.gz

    # 🆕 تنظيف الملفات الوسيطة
    - name: Cleanup build files
      if: always()
      run: |
        echo "🧹 تنظيف الملفات الوسيطة..."
        
        # حذف ملفات .o و .cmd
        find out/ -name "*.o" -delete 2>/dev/null || true
        find out/ -name "*.cmd" -delete 2>/dev/null || true
        find out/ -name "*.d" -delete 2>/dev/null || true
        
        # حذف ccache
        rm -rf $HOME/.ccache
        
        # حذف clang
        rm -rf zycromerz-clang
        
        echo "📊 المساحة بعد التنظيف:"
        df -h

    # 7️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل الرموز..."
        if [ -f "out/vmlinux" ]; then
            nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || echo "⚠️  لم يتم العثور على رموز KSU"
            nm out/vmlinux | grep -i susfs > nm-susfs.txt || echo "⚠️  لم يتم العثور على رموز susfs"
            nm out/vmlinux > nm-full.txt
            
            echo "📏 أحجام الملفات:"
            ls -lh nm-*.txt
            
            echo "✅ تم إنشاء ملفات التحليل"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi
    
    # 8️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        echo "📦 تعبئة AnyKernel3..."
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        
        cd AK3
        zip -r9 ../Kernel-violet-zycromerz-clang.zip *
        cd ..
        
        echo "📏 حجم ZIP:"
        ls -lh Kernel-violet-zycromerz-clang.zip
        echo "✅ تم إنشاء ZIP"
    
    # 9️⃣ Sign ZIP
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar Kernel-violet-zycromerz-clang.zip Kernel-violet-zycromerz-clang-signed.zip
        
        echo "📏 حجم ZIP الموقّع:"
        ls -lh Kernel-violet-zycromerz-clang-signed.zip
        echo "✅ تم التوقيع"
    
    # 🔟 رفع ZIP
    - name: Upload Kernel ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZyCromerZ-Clang-ZIP
        path: Kernel-violet-zycromerz-clang-signed.zip
        compression-level: 0
    
    # 1️⃣1️⃣ رفع اللوغ الكامل المضغوط ✅
    - name: Upload Build Log (Full & Compressed)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log-Full
        path: logs/build.log.gz
        retention-days: 7
        compression-level: 0
    
    # 1️⃣2️⃣ رفع التحليلات
    - name: Upload Analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Symbol-Analysis
        path: |
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
        retention-days: 5
        compression-level: 9

    # 🆕 ملخص البناء
    - name: Build Summary
      if: always()
      run: |
        echo "📊 ملخص البناء:"
        echo "================================"
        echo "✅ ملفات تم إنشاؤها:"
        ls -lh Kernel-violet-zycromerz-clang-signed.zip 2>/dev/null || echo "❌ ZIP غير موجود"
        ls -lh logs/build.log.gz 2>/dev/null || echo "❌ اللوغ غير موجود"
        ls -lh nm-*.txt 2>/dev/null || echo "❌ ملفات التحليل غير موجودة"
        echo "================================"
