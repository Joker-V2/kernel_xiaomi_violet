name: Build Kernel (Complete with GCC)

on:
  workflow_dispatch:
  push:
    branches:
      - test7

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4

    # 2️⃣ Install tools (مع GCC كامل)
    - name: Install ALL tools including GCC
      run: |
        echo "📦 تثبيت كل الأدوات بما فيها GCC..."
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          # ⭐⭐ أدوات GCC Cross Compile
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          # ⭐⭐ أدوات أخرى
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd
        
        echo "✅ كل الأدوات مثبتة (بما فيها GCC)"
        
        # ⭐⭐ التحقق من وجود أدوات GCC
        echo "🔍 التحقق من أدوات GCC:"
        which aarch64-linux-gnu-gcc || echo "❌ aarch64-linux-gnu-gcc غير موجود"
        which arm-linux-gnueabi-gcc || echo "❌ arm-linux-gnueabi-gcc غير موجود"
        
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 3️⃣ Setup AOSP Clang
    - name: Setup AOSP Clang
      run: |
        echo "📥 تحميل AOSP Clang..."
        wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-platform-15.0.0_r13/clang-r522817.tar.gz" -O aosp-clang.tar.gz
        tar -xf aosp-clang.tar.gz
        
        cd bin
        echo "$PWD" >> $GITHUB_PATH

    # 4️⃣ Export env
    - name: Export environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        echo "🔧 استخدام clang-18 + GCC..."
        
        make \
          O=out \
          clean \
          mrproper \
          CC=clang-18 \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          READELF=llvm-readelf \
          OBJSIZE=llvm-size \
          STRIP=llvm-strip \
          HOSTCC=clang-18 \
          HOSTCXX=clang++ \
          vendor/violet-perf_defconfig

    # 6️⃣ Build kernel
    - name: Build kernel
      shell: bash
      env:
        CC: clang-18
        AR: llvm-ar
        NM: llvm-nm
        OBJCOPY: llvm-objcopy
        OBJDUMP: llvm-objdump
        READELF: llvm-readelf
        OBJSIZE: llvm-size
        STRIP: llvm-strip
        HOSTCC: clang-18
        HOSTCXX: clang++
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      run: |
        echo "🚀 البناء بـ clang-18 + GCC..."
        echo "🔍 تأكيد أدوات GCC:"
        aarch64-linux-gnu-gcc --version | head -1
        arm-linux-gnueabi-gcc --version | head -1
        
        make \
          O=out \
          CC="$CC" \
          AR="$AR" \
          NM="$NM" \
          STRIP="$STRIP" \
          HOSTCC="$HOSTCC" \
          HOSTCXX="$HOSTCXX" \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          LLVM=1 \
          LLVM_IAS=1 \
          -j2 \
          2>&1 | tee build_complete.log
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ ✅ ✅ النواة مبنية!"
        else
            echo "❌ فشل"
            exit 1
        fi

    # 7️⃣ Packaging
    - name: Package Kernel
      run: |
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../kernel-complete.zip *
