name: Build Kernel (Final Verified)

on:
  workflow_dispatch:
  push:
    branches:
      - test7

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4

    # 2️⃣ Install tools
    - name: Install GCC tools
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          zip unzip curl wget git \
          python3 \
          ccache \
          zstd \
          openjdk-17-jre-headless
        
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 3️⃣ Setup AOSP Clang
    - name: Setup AOSP Clang
      run: |
        echo "📥 تحميل AOSP Clang..."
        wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-platform-15.0.0_r13/clang-r522817.tar.gz" -O aosp-clang.tar.gz
        
        echo "📦 فك الضغط..."
        mkdir -p aosp-clang
        tar -xf aosp-clang.tar.gz -C aosp-clang
        
        # إضافة المسار
        echo "$PWD/aosp-clang/bin" >> $GITHUB_PATH
        
        echo "✅ AOSP Clang جاهز:"
        echo "clang-18: $PWD/aosp-clang/bin/clang-18"

    # 4️⃣ Export environment
    - name: Export environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 5️⃣ ✅ Defconfig - تصحيح: بدون أدوات
    - name: Load defconfig
      run: |
        echo "🔧 تحميل defconfig فقط..."
        echo "⏱️  هذه المرحلة يجب أن تكون سريعة"
        
        # تنظيف فقط
        make O=out clean mrproper
        
        # ⭐ تحميل config فقط - بدون أي أدوات
        make O=out vendor/violet-perf_defconfig
        
        echo "✅ تم تحميل .config"
        echo "📊 حجم .config: $(wc -l < out/.config) سطر"

    # 6️⃣ ✅ Build - مع stdbuf مثل Neutron
    - name: Build kernel
      shell: bash
      env:
        CC: clang-18
        AR: llvm-ar
        NM: llvm-nm
        OBJCOPY: llvm-objcopy
        OBJDUMP: llvm-objdump
        STRIP: llvm-strip
        HOSTCC: clang-18
        HOSTCXX: clang++
        CLANG_TRIPLE: aarch64-linux-gnu-
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      run: |
        echo "🚀 بدء البناء الفعلي..."
        echo "🔧 CC: $(which clang-18)"
        echo "🔧 AR: $(which llvm-ar)"
        echo "🔧 CLANG_TRIPLE: $CLANG_TRIPLE"
        
        # إنشاء مجلد اللوغات
        mkdir -p logs
        
        # تنظيف ccache
        ccache -z
        
        echo "⏱️  بدء الترجمة... (KernelSU سيظهر هنا)"
        
        # ⭐ استخدم stdbuf -oL -eL مثل Neutron
        stdbuf -oL -eL make \
          O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          CC="ccache $CC" \
          AR="$AR" \
          NM="$NM" \
          OBJCOPY="$OBJCOPY" \
          OBJDUMP="$OBJDUMP" \
          STRIP="$STRIP" \
          HOSTCC="$HOSTCC" \
          HOSTCXX="$HOSTCXX" \
          CLANG_TRIPLE="$CLANG_TRIPLE" \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          KBUILD_BUILD_USER="GitHub-Actions" \
          KBUILD_BUILD_HOST="github.com" \
          -j$(nproc) \
          Image.gz dtbo.img 2>&1 | tee logs/build.log
        
        # إحصائيات ccache
        ccache -s
        
        # التحقق من النتيجة
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ ✅ ✅ النواة مبنية بنجاح!"
            echo "📦 حجم Image.gz: $(du -h out/arch/arm64/boot/Image.gz | cut -f1)"
            
            if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
                echo "✅ dtbo.img موجود"
            else
                echo "⚠️  dtbo.img غير موجود"
            fi
            
            # تحقق متى ظهر KernelSU
            echo "🔍 تحليل ظهور KernelSU في السجلال:"
            KSU_LINE=$(grep -n "KernelSU-Next" logs/build.log | head -1 | cut -d: -f1)
            if [ -n "$KSU_LINE" ]; then
                echo "KernelSU ظهر في السطر: $KSU_LINE"
                if [ "$KSU_LINE" -lt 10 ]; then
                    echo "⚠️  KernelSU ظهر مبكراً جداً (قد يكون في defconfig)"
                else
                    echo "✅ KernelSU ظهر أثناء البناء (صحيح)"
                fi
            fi
        else
            echo "❌ فشل بناء النواة"
            echo "📋 آخر 50 سطر من السجل:"
            tail -50 logs/build.log
            exit 1
        fi

    # 7️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل رموز KernelSU..."
        if [ -f "out/vmlinux" ]; then
            # KernelSU
            if nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt; then
                KSU_COUNT=$(wc -l < nm-ksu.txt)
                echo "✅ تم العثور على $KSU_COUNT رمز KernelSU"
            else
                echo "⚠️  لم يتم العثور على رموز KernelSU" > nm-ksu.txt
            fi
            
            # susfs
            if nm out/vmlinux | grep -i "susfs" > nm-susfs.txt; then
                SUSFS_COUNT=$(wc -l < nm-susfs.txt)
                echo "✅ تم العثور على $SUSFS_COUNT رمز susfs"
            else
                echo "⚠️  لم يتم العثور على رموز susfs" > nm-susfs.txt
            fi
            
            # جميع الرموز
            nm out/vmlinux > nm-full.txt
            echo "📊 جميع الرموز: $(wc -l < nm-full.txt)"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi

    # 8️⃣ Packaging
    - name: Package Kernel
      run: |
        echo "📦 تجهيز حزمة AnyKernel3..."
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3.git AK3
        
        # نسخ ملفات النواة
        cp out/arch/arm64/boot/Image.gz AK3/
        
        if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            cp out/arch/arm64/boot/dtbo.img AK3/
            echo "✅ تم إضافة dtbo.img"
        fi
        
        # معلومات البناء
        echo "Kernel Build Info" > AK3/build-info.txt
        echo "=================" >> AK3/build-info.txt
        echo "Build Date: $(date)" >> AK3/build-info.txt
        echo "Git SHA: ${{ github.sha }}" >> AK3/build-info.txt
        echo "Compiler: AOSP Clang r522817" >> AK3/build-info.txt
        echo "KernelSU: v3.0.0" >> AK3/build-info.txt
        
        cd AK3
        zip -r9 ../kernel-violet-aosp.zip *
        echo "✅ تم إنشاء kernel-violet-aosp.zip"
        ls -lh ../kernel-violet-aosp.zip

    # 9️⃣ Sign ZIP
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ملف ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        
        if [ -f "kernel-violet-aosp.zip" ]; then
            java -jar zipsigner.jar \
              kernel-violet-aosp.zip \
              kernel-violet-aosp-signed.zip
            
            echo "✅ تم توقيع الحزمة:"
            echo "الأصل: $(stat -c%s kernel-violet-aosp.zip) بايت"
            echo "الموقع: $(stat -c%s kernel-violet-aosp-signed.zip) بايت"
        else
            echo "❌ ملف ZIP غير موجود للتوقيع"
            exit 1
        fi

    # 🔟 رفع ملف ZIP
    - name: Upload Kernel ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZIP-violet
        path: kernel-violet-aosp-signed.zip
        retention-days: 7

    # 1️⃣1️⃣ رفع اللوغات والتحليلات
    - name: Upload Logs and Analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs-Analysis
        path: |
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
        retention-days: 7
