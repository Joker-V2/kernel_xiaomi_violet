name: Build Kernel (violet | SukiSU builtin + mini-scope + SUSFS 1.5.12)

on:
  workflow_dispatch:
  push:
    branches:
      - test5

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: test5
        fetch-depth: 1

    # 2️⃣ Dependencies + ccache
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache

    # 3️⃣ ZyC Clang 22
    - name: Setup ZyC Clang 22
      run: |
        mkdir clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260118-release/Clang-23.0.0git-20260118.tar.gz
        tar -xf Clang-23.0.0git-20260118.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH
        clang --version

    # 🔟 Build environment
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=0" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 1️⃣1️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 1️⃣2️⃣ Build kernel (SAFE + visible log)
    - name: Build kernel
      shell: bash
      run: |
        mkdir -p logs
        ccache -M 2G
        ccache -z

        stdbuf -oL -eL make O=out -j2 \
          CC="ccache clang" \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=0 \
          2>&1 | tee logs/build.log

        ccache -s

    # 1️⃣3️⃣ Verify hooks
    - name: Verify hooks.o
      run: |
        grep -E "hooks\.o" logs/build.log > hooks-build.txt || true

    # 1️⃣4️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || true
        nm out/vmlinux | grep -i susfs > nm-susfs.txt || true
        nm out/vmlinux > nm-full.txt

    # 1️⃣4.1️⃣ Verify all IDR/IDA symbols
    - name: Verify all IDR/IDA symbols
      shell: bash
      run: |
        LOG_FILE="logs/idr_ida_symbols.log"
        echo "IDR/IDA symbols verification:" > $LOG_FILE
        echo "=====================================" >> $LOG_FILE
        echo "" >> $LOG_FILE

        # EXPORTED symbols
        echo "📦 EXPORTED SYMBOLS (from idr.c):" >> $LOG_FILE
        EXPORTED_SYMBOLS=(
          idr_get_next
          idr_get_next_ext
          idr_get_next_ul
          idr_replace
          idr_replace_ext
          idr_destroy
          idr_alloc_cmn
          idr_alloc_u32
          idr_alloc_cyclic
          idr_for_each
          idr_preload
          ida_alloc_range
          ida_free
          ida_pre_get
          ida_get_new_above
          ida_remove
          ida_destroy
        )
        for sym in "${EXPORTED_SYMBOLS[@]}"; do
          if nm out/vmlinux | grep -wq "$sym"; then
            echo "  ✅ $sym" >> $LOG_FILE
          else
            echo "  ❌ $sym NOT found (MISSING!)" >> $LOG_FILE
          fi
        done

        echo "" >> $LOG_FILE
        echo "=====================================" >> $LOG_FILE
        echo "" >> $LOG_FILE

        # INLINE functions
        echo "🔧 INLINE FUNCTIONS (from idr.h):" >> $LOG_FILE
        echo "These are defined as 'static inline' in header file" >> $LOG_FILE
        echo "They don't appear in nm but work correctly if header is included" >> $LOG_FILE
        echo "" >> $LOG_FILE

        INLINE_FUNCTIONS=(
          idr_alloc
          idr_alloc_ext
          idr_find
          idr_find_ext
          idr_remove
          idr_remove_ext
          idr_init
          idr_is_empty
          idr_preload_end
          idr_get_cursor
          idr_set_cursor
          ida_alloc
          ida_alloc_min
          ida_alloc_max
          ida_get_new
          ida_simple_get
          ida_simple_remove
          ida_init
          ida_is_empty
        )

        if [ -f "include/linux/idr.h" ]; then
          echo "  📄 Checking include/linux/idr.h..." >> $LOG_FILE
          for func in "${INLINE_FUNCTIONS[@]}"; do
            if grep -q "static inline.*$func" include/linux/idr.h; then
              echo "  ✅ $func (defined in idr.h)" >> $LOG_FILE
            else
              echo "  ⚠️  $func (NOT found in idr.h - might need to add)" >> $LOG_FILE
            fi
          done
        else
          echo "  ❌ include/linux/idr.h not found!" >> $LOG_FILE
        fi

        echo "" >> $LOG_FILE
        echo "=====================================" >> $LOG_FILE
        echo "" >> $LOG_FILE

        # Summary
        echo "📊 SUMMARY:" >> $LOG_FILE
        EXPORTED_FOUND=0
        for sym in "${EXPORTED_SYMBOLS[@]}"; do
          if nm out/vmlinux | grep -wq "$sym"; then
            ((EXPORTED_FOUND++))
          fi
        done
        TOTAL_EXPORTED=${#EXPORTED_SYMBOLS[@]}
        
        echo "  - Exported symbols found: $EXPORTED_FOUND/$TOTAL_EXPORTED" >> $LOG_FILE
        echo "  - Inline functions are checked against idr.h" >> $LOG_FILE
        echo "" >> $LOG_FILE
        echo "⚠️  NOTE: Inline functions won't appear in 'nm' output" >> $LOG_FILE
        echo "    but they work if properly defined in the header file" >> $LOG_FILE

    # 1️⃣4.2 Check for IDR/IDA compilation errors (resilient)
    - name: Check for IDR/IDA compilation errors
      shell: bash
      run: |
        LOG_FILE="logs/idr_ida_errors.log"
        echo "Checking for IDR/IDA related compilation errors:" > $LOG_FILE
        echo "=============================================" >> $LOG_FILE
        echo "" >> $LOG_FILE

        ERRORS=$(grep -i "undefined.*idr_\|undefined.*ida_" logs/build.log || true)

        if [ -n "$ERRORS" ]; then
          echo "❌ Found undefined IDR/IDA references:" >> $LOG_FILE
          echo "$ERRORS" >> $LOG_FILE
        else
          echo "✅ No undefined IDR/IDA references found in build log" >> $LOG_FILE
        fi

        echo "" >> $LOG_FILE
        echo "Check complete. All results logged." >> $LOG_FILE

    # 1️⃣4.3 Verify idr.c compilation (resilient)
    - name: Verify idr.c compilation
      shell: bash
      run: |
        LOG_FILE="logs/idr_compilation.log"
        echo "Checking if lib/idr.c was compiled:" > $LOG_FILE
        echo "===================================" >> $LOG_FILE
        echo "" >> $LOG_FILE

        if [ -f "out/lib/idr.o" ]; then
          echo "✅ lib/idr.o exists" >> $LOG_FILE
          echo "" >> $LOG_FILE
          echo "Symbols in idr.o:" >> $LOG_FILE
          nm out/lib/idr.o 2>/dev/null | grep -E "T |t " >> $LOG_FILE || echo "  (no symbols found)" >> $LOG_FILE
        else
          echo "❌ lib/idr.o NOT found - idr.c was not compiled!" >> $LOG_FILE
        fi

        echo "" >> $LOG_FILE
        echo "Verification complete. All results logged." >> $LOG_FILE

    # 1️⃣5️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../Kernel-violet-sukisu.zip *

    # 1️⃣6️⃣ Sign ZIP
    - name: Sign zip
      run: |
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar \
          Kernel-violet-sukisu.zip \
          Kernel-violet-sukisu-signed.zip

    # 1️⃣7️⃣ Upload artifacts
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-debug
        path: |
          Kernel-violet-sukisu-signed.zip
          logs/build.log
          logs/idr_ida_symbols.log
          logs/idr_ida_errors.log
          logs/idr_compilation.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
          hooks-build.txt
