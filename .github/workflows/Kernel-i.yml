name: Build Kernel (violet | KernelSu-Next-legacy | susfs-V2.0.0)

on:
  workflow_dispatch:
  push:
    branches:
      - test6

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: test6
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd

    # 3️⃣ Neutron Clang - التحميل والتهيئة المبسطة
    - name: Setup Neutron Clang
      run: |
        echo "📥 تحميل Neutron Clang..."
        wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
        
        echo "📦 فك الضغط..."
        tar -I zstd -xf neutron-clang-10032024.tar.zst
        
        # المسار الصحيح
        CLANG_PATH="$PWD/neutron-clang-10032024/bin"
        
        echo "🔍 محتويات مجلد bin/:"
        ls -la $CLANG_PATH/
        
        # 💾 حفظ المتغيرات البيئية مباشرة بالأسماء الصحيحة
        echo "💾 تعيين متغيرات الأدوات..."
        echo "CLANG=$CLANG_PATH/clang-19" >> $GITHUB_ENV
        echo "AR=$CLANG_PATH/llvm-ar" >> $GITHUB_ENV
        echo "NM=$CLANG_PATH/llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=$CLANG_PATH/llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=$CLANG_PATH/llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=$CLANG_PATH/llvm-strip" >> $GITHUB_ENV
        
        # إنشاء رابط رمزي لـ clang إذا لزم الأمر
        if [ ! -f "$CLANG_PATH/clang" ]; then
            echo "🔗 إنشاء رابط clang → clang-19"
            ln -sf "clang-19" "$CLANG_PATH/clang"
            echo "CC=$CLANG_PATH/clang" >> $GITHUB_ENV
        else
            echo "CC=$CLANG_PATH/clang" >> $GITHUB_ENV
        fi
        
        # إضافة المسار إلى PATH
        echo "$CLANG_PATH" >> $GITHUB_PATH
        
        echo "✅ Neutron Clang جاهز!"
        echo "📋 الأدوات:"
        echo "  CC/clang: $CLANG_PATH/clang-19"
        echo "  AR: $CLANG_PATH/llvm-ar"
        echo "  NM: $CLANG_PATH/llvm-nm"

    # 4️⃣ Export env
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        
        # عرض المتغيرات للتأكد
        echo "🎯 متغيرات البناء:"
        echo "CLANG=${{ env.CLANG }}"
        echo "AR=${{ env.AR }}"
        echo "NM=${{ env.NM }}"

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ Build kernel - النسخة النهائية المختصرة
    - name: Build kernel
      shell: bash
      env:
        CLANG: ${{ env.CLANG }}
        AR: ${{ env.AR }}
        NM: ${{ env.NM }}
        OBJCOPY: ${{ env.OBJCOPY }}
        OBJDUMP: ${{ env.OBJDUMP }}
        STRIP: ${{ env.STRIP }}
        CC: ${{ env.CC }}
      run: |
        set -o pipefail
        mkdir -p logs
        ccache -M 1G
        ccache -z
        
        echo "🚀 بدء بناء النواة..."
        echo "🔧 أدوات البناء:"
        echo "  CLANG: $CLANG"
        echo "  CC: $CC"
        echo "  AR: $AR"
        echo "  NM: $NM"
        
        # اختبار clang
        echo "🧪 اختبار CLANG..."
        $CLANG --version || $CC --version
        
        # بناء النواة - الإصدار المختصر النظيف
        echo "🏗️  جاري البناء..."
        
        stdbuf -oL -eL make O=out -j$(nproc) \
          CC="ccache $CLANG" \
          AR="$AR" \
          NM="$NM" \
          OBJCOPY="$OBJCOPY" \
          OBJDUMP="$OBJDUMP" \
          STRIP="$STRIP" \
          2>&1 | tee logs/build.log
        
        # أو استخدام CC إذا أردت
        # stdbuf -oL -eL make O=out -j$(nproc) \
        #   CC="ccache $CC" \
        #   AR="$AR" \
        #   NM="$NM" \
        #   OBJCOPY="$OBJCOPY" \
        #   OBJDUMP="$OBJDUMP" \
        #   STRIP="$STRIP" \
        #   2>&1 | tee logs/build.log

        echo "📊 إحصائيات ccache:"
        ccache -s
        
        # التحقق من وجود الناتج
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ تم بناء النواة بنجاح!"
        else
            echo "❌ فشل بناء النواة!"
            exit 1
        fi

    # 7️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل الرموز..."
        if [ -f "out/vmlinux" ]; then
            nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || echo "⚠️  لم يتم العثور على رموز KSU"
            nm out/vmlinux | grep -i susfs > nm-susfs.txt || echo "⚠️  لم يتم العثور على رموز susfs"
            nm out/vmlinux > nm-full.txt
            echo "✅ تم إنشاء ملفات التحليل"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi

    # 8️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        echo "📦 تعبئة AnyKernel3..."
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../Kernel-violet-neutron.zip *
        echo "✅ تم إنشاء Kernel-violet-neutron.zip"
        ls -lh ../Kernel-violet-neutron.zip

    # 9️⃣ Sign ZIP
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ملف ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar \
          Kernel-violet-neutron.zip \
          Kernel-violet-neutron-signed.zip
        echo "✅ تم التوقيع: Kernel-violet-neutron-signed.zip"

    # 🔟 Upload artifacts
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-neutron
        path: |
          Kernel-violet-neutron-signed.zip
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
