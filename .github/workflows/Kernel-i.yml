هذا الرابط متاح ويعود إلى مجموعة أدوات التجميع المتقاطعة الرسمية من kernel.org، لذا فهو موثوق. إليك سكربت العمل المكتمل الذي يدمج Zycromerz Clang مع GCC Cross Compiler من الرابط الذي قدمته:

```yaml
name: Build Kernel (Clang + Official GCC Cross)

on:
  workflow_dispatch:
  push:
    branches:
      - test7

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: test7
        fetch-depth: 1

    # 2️⃣ 📥 تحميل GCC Cross Compiler الرسمي من kernel.org
    - name: Download Official GCC Cross Compiler
      run: |
        echo "📥 تحميل GCC 14.2.0 من kernel.org..."
        wget -q https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
        tar -xf x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
        
        GCC_PATH="$PWD/x86_64-gcc-14.2.0-nolibc/aarch64-linux/bin"
        echo "GCC_CROSS=$GCC_PATH/aarch64-linux-" >> $GITHUB_ENV
        echo "GCC_CC=$GCC_PATH/aarch64-linux-gcc" >> $GITHUB_ENV
        echo "✅ GCC Cross Compiler جاهز!"

    # 3️⃣ 📥 تحميل Zycromerz Clang
    - name: Download Zycromerz Clang
      run: |
        echo "📥 تحميل Zycromerz Clang..."
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260129-release/Clang-23.0.0git-20260129.tar.gz
        tar -xf Clang-23.0.0git-20260129.tar.gz
        
        CLANG_PATH="$PWD/bin/clang-23"
        echo "CLANG_CC=$CLANG_PATH" >> $GITHUB_ENV
        echo "✅ Zycromerz Clang جاهز!"

    # 4️⃣ إعداد متغيرات البيئة
    - name: Export environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV

    # 5️⃣ تحميل ملف الإعدادات
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ 🔥 البناء باستخدام المزيج Clang + GCC Cross (مع إصلاح Pipe)
    - name: Build with Hybrid Toolchain
      shell: bash
      env:
        CC: ${{ env.CLANG_CC }}
        CROSS_COMPILE: ${{ env.GCC_CROSS }}
      run: |
        echo "🚀 بدء البناء بـ Hybrid Toolchain..."
        echo "• المترجم (CC): Zycromerz Clang"
        echo "• أدوات التجميع المتقاطعة (CROSS_COMPILE): GCC من kernel.org"
        
        # ⭐ الإعدادات لحساب GitHub المجاني لمنع Broken Pipe
        ulimit -n 65536
        
        # ⭐ البناء بعدد محدود من المهام للحفاظ على الاستقرار
        make -j2 \
          O=out \
          ARCH=arm64 \
          CC="$CC" \
          CROSS_COMPILE="$CROSS_COMPILE" \
          LLVM=1 \
          LLVM_IAS=1 \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          2>&1 | tee build_hybrid.log
        
        # التحقق من النتيجة
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ ✅ ✅ تم بناء النواة بنجاح باستخدام المزيج!"
            echo "📁 الملف النهائي: out/arch/arm64/boot/Image.gz"
        else
            echo "❌ فشل عملية البناء."
            echo "📋 عرض آخر 10 أسطر من السجل للتحقق من الخطأ:"
            tail -10 build_hybrid.log
            exit 1
        fi

    # 7️⃣ تعبئة Kernel في AnyKernel3
    - name: Package with AnyKernel3
      run: |
        echo "📦 تعبئة النواة باستخدام AnyKernel3..."
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../kernel-hybrid-toolchain.zip *
        echo "✅ تم إنشاء الأرشيف: kernel-hybrid-toolchain.zip"

    # 8️⃣ رفع الناتج
    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Hybrid-Build
        path: |
          kernel-hybrid-toolchain.zip
          build_hybrid.log
```

🎯 ملخص المزايا الرئيسية لهذا المزيج

· أداء وتحسينات Clang: استخدام Clang للترجمة يوفر تحسينات وتحذيرات حديثة.
· استقرار GCC Cross Tools: استخدام أدوات الربط والتجميع من GCC الرسمي يضمن استقرار عملية البناء النهائية.
· موثوقية المصدر: GCC مأخوذ من kernel.org، مما يضمن التوافق مع بناء النواة.
· يتجنب مشاكل الذاكرة: استخدام -j2 وزيادة حدود النظام (ulimit) يقلل من فرص حدوث Broken pipe على الحسابات المجانية.

ببساطة انسخ السكربت أعلاه وضعه في ملف .github/workflows/build.yml في مستودعك. عندما تشغله، سيقوم بتنزيل الأدوات وبناء النواة باستخدام القوة المشتركة لـ Clang و GCC معاً.
