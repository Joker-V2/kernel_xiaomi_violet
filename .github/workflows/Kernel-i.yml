name: Build Kernel (Final Modified)

on:
  workflow_dispatch:
  push:
    branches:
      - test7

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4

    # 2️⃣ Install tools
    - name: Install tools
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd
        
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 3️⃣ Setup AOSP Clang
    - name: Setup AOSP Clang
      run: |
        wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-platform-15.0.0_r13/clang-r522817.tar.gz" -O aosp-clang.tar.gz
        tar -xf aosp-clang.tar.gz
        
        # جمع أدوات LLVM
        mkdir -p aosp-bin
        find . -type f -executable -exec cp {} aosp-bin/ 2>/dev/null \;
        cd aosp-bin
        chmod +x *
        
        echo "$PWD" >> $GITHUB_PATH

    # 4️⃣ Export env
    - name: Export environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

    # 5️⃣ Defconfig (المعدل كما طلبت)
    - name: Load defconfig
      run: |
        make \
          O=out \
          clean \
          mrproper \
          CC=clang \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          READELF=llvm-readelf \
          OBJSIZE=llvm-size \
          STRIP=llvm-strip \
          HOSTCC=clang \
          HOSTCXX=clang++ \
          vendor/violet-perf_defconfig

    # 6️⃣ Build kernel (معدل كما طلبت)
    - name: Build kernel
      shell: bash
      env:
        CC: clang
        AR: llvm-ar
        NM: llvm-nm
        OBJCOPY: llvm-objcopy
        OBJDUMP: llvm-objdump
        READELF: llvm-readelf
        OBJSIZE: llvm-size
        STRIP: llvm-strip
        HOSTCC: clang
        HOSTCXX: clang++
        CROSS_COMPILE: ${{ env.CROSS_COMPILE }}
        CROSS_COMPILE_ARM32: ${{ env.CROSS_COMPILE_ARM32 }}
      run: |
        echo "🚀 بدء البناء..."
        
        # حساب الأنوية الآمن
        CORES=$(nproc --all)
        [ $CORES -gt 4 ] && CORES=4
        
        make \
          O=out \
          CC="$CC" \
          AR="$AR" \
          NM="$NM" \
          OBJCOPY="$OBJCOPY" \
          OBJDUMP="$OBJDUMP" \
          READELF="$READELF" \
          OBJSIZE="$OBJSIZE" \
          STRIP="$STRIP" \
          HOSTCC="$HOSTCC" \
          HOSTCXX="$HOSTCXX" \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          -j$CORES \
          2>&1 | tee build.log
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ ✅ ✅ النواة مبنية!"
        else
            echo "❌ فشل"
            exit 1
        fi

    # 7️⃣ Packaging
    - name: Package Kernel
      run: |
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../kernel-modified.zip *
