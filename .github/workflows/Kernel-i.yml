name: Build Kernel (violet | KernelSu-Next-legacy | susfs-V2.0.0)

on:
  workflow_dispatch:
  push:
    branches:
      - test6

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: test6
        fetch-depth: 1

    # 2️⃣ Dependencies + ccache
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd

    # 3️⃣ Neutron Clang (اكتشاف تلقائي)
    - name: Setup Neutron Clang
      run: |
        wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
        tar -I zstd -xf neutron-clang-10032024.tar.zst
        
        # البحث عن clang وإيجاد مساره
        CLANG_PATH=$(find . -name "clang" -type f -executable | head -1)
        if [ -z "$CLANG_PATH" ]; then
            echo "❌ لم يتم العثور على clang!"
            exit 1
        fi
        
        CLANG_PATH=$(realpath "$CLANG_PATH")
        echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
        echo "CLANG_DIR=$(dirname "$CLANG_PATH")" >> $GITHUB_ENV
        
        # إضافة المسار إلى PATH
        echo "$(dirname "$CLANG_PATH")" >> $GITHUB_PATH
        
        echo "✅ مسار clang: $CLANG_PATH"
        $CLANG_PATH --version

    # 🔟 Build environment
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=0" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 1️⃣1️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 1️⃣2️⃣ Build kernel (باستخدام المسار المباشر)
    - name: Build kernel
      shell: bash
      env:
        CLANG_PATH: ${{ env.CLANG_PATH }}
      run: |
        set -o pipefail
        mkdir -p logs
        ccache -M 1G
        ccache -z
        
        echo "🚀 بدء البناء باستخدام: $CLANG_PATH"
        
        stdbuf -oL -eL make O=out -j2 \
          CC="ccache $CLANG_PATH" \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=0 \
          2>&1 | tee logs/build.log

        ccache -s

    # 1️⃣4️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || true
        nm out/vmlinux | grep -i susfs > nm-susfs.txt || true
        nm out/vmlinux > nm-full.txt

    # 1️⃣5️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../Kernel-violet-sukisu.zip *

    # 1️⃣6️⃣ Sign ZIP
    - name: Sign zip
      run: |
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar \
          Kernel-violet-sukisu.zip \
          Kernel-violet-sukisu-signed.zip

    # 1️⃣7️⃣ Upload artifacts
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-debug
        path: |
          Kernel-violet-sukisu-signed.zip
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
          hooks-build.txt
