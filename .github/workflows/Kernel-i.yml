name: Build Kernel (Final Verified)

on:
  workflow_dispatch:
  push:
    branches:
      - test7

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4

    # 2️⃣ Install GCC tools
    - name: Install GCC tools
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          zip unzip curl wget git \
          python3 \
          ccache \
          zstd
        
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 3️⃣ ✅ Setup AOSP Clang - تصحيح المسار
    - name: Setup AOSP Clang
      run: |
        echo "📥 تحميل AOSP Clang..."
        wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-platform-15.0.0_r13/clang-r522817.tar.gz" -O aosp-clang.tar.gz
        
        echo "📦 فك الضغط في مجلد منفصل..."
        mkdir -p aosp-clang
        tar -xf aosp-clang.tar.gz -C aosp-clang
        
        echo "📍 المسار: $PWD/aosp-clang/bin"
        echo "🔧 إضافة إلى PATH..."
        echo "$PWD/aosp-clang/bin" >> $GITHUB_PATH
        
        # التحقق
        echo "✅ الملفات في bin/:"
        ls -la $PWD/aosp-clang/bin/ | grep clang | head -5

    # 4️⃣ Export environment
    - name: Export environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        echo "🔧 استخدام AOSP Clang (clang-18)..."
        
        make \
          O=out \
          clean \
          mrproper \
          CC=clang-18 \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          READELF=llvm-readelf \
          OBJSIZE=llvm-size \
          STRIP=llvm-strip \
          HOSTCC=clang-18 \
          HOSTCXX=clang++ \
          vendor/violet-perf_defconfig

    # 6️⃣ Build
    - name: Build kernel
      shell: bash
      env:
        CC: clang-18
        AR: llvm-ar
        NM: llvm-nm
        STRIP: llvm-strip
        HOSTCC: clang-18
        HOSTCXX: clang++
        CLANG_TRIPLE: aarch64-linux-gnu-
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      run: |
        echo "🚀 البناء مع:"
        echo "CC: $(which clang-18)"
        echo "CLANG_TRIPLE: $CLANG_TRIPLE"
        
        make \
          O=out \
          CC="$CC" \
          AR="$AR" \
          NM="$NM" \
          STRIP="$STRIP" \
          HOSTCC="$HOSTCC" \
          HOSTCXX="$HOSTCXX" \
          CLANG_TRIPLE="$CLANG_TRIPLE" \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          LLVM=1 \
          LLVM_IAS=1 \
          -j$(nproc) \
          Image.gz 2>&1 | tee build_final.log
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ ✅ ✅ النواة مبنية!"
        else
            echo "❌ فشل البناء"
            exit 1
        fi

    # 7️⃣ Packaging
    - name: Package Kernel
      run: |
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../kernel-final.zip *
