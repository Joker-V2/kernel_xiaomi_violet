name: Build Kernel (violet | zycromerz-clang)

on:
  workflow_dispatch:
  push:
    branches:
      - test7

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: test7
        fetch-depth: 1

    # 2️⃣ Dependencies (مختصر)
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd

    # 3️⃣ Zycromerz Clang - المعدل
    - name: Setup Zycromerz Clang
      run: |
        echo "📥 تحميل Zycromerz Clang..."
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260129-release/Clang-23.0.0git-20260129.tar.gz
        
        echo "📦 فك الضغط..."
        tar -xf Clang-23.0.0git-20260129.tar.gz
        
        CLANG_PATH="$PWD/bin"
        
        echo "🔍 محتويات مجلد bin/:"
        ls -la $CLANG_PATH/
        
        # 💾 حفظ المتغيرات
        echo "CC=$CLANG_PATH/clang-23" >> $GITHUB_ENV
        
        # ⭐ أضف cross-compilers من الملف
        echo "CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi-" >> $GITHUB_ENV
        
        echo "$CLANG_PATH" >> $GITHUB_PATH
        echo "✅ Zycromerz Clang جاهز!"

    # 4️⃣ Export env - مع LLVM
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ Build kernel - بنفس أسلوب compile()
    - name: Build kernel
      shell: bash
      env:
        CC: ${{ env.CC }}
        CROSS_COMPILE: ${{ env.CROSS_COMPILE }}
        CROSS_COMPILE_ARM32: ${{ env.CROSS_COMPILE_ARM32 }}
      run: |
        set -o pipefail
        mkdir -p logs
        ccache -M 1G
        ccache -z
        
        echo "🚀 بدء بناء النواة..."
        echo "🔧 CC: $CC"
        echo "🔧 CROSS_COMPILE: $CROSS_COMPILE"
        
        # اختبار
        echo "🧪 اختبار المترجم..."
        $CC --version
        
        # بنفس أسلوب compile()
        stdbuf -oL -eL make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          CC="ccache $CC" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          LLVM=1 \
          LLVM_IAS=1 \
          2>&1 | tee logs/build.log
        
        ccache -s
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ تم بناء النواة بنجاح!"
        else
            echo "❌ فشل بناء النواة!"
            exit 1
        fi

    # 7️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل الرموز..."
        if [ -f "out/vmlinux" ]; then
            nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || echo "⚠️  لم يتم العثور على رموز KSU"
            nm out/vmlinux | grep -i susfs > nm-susfs.txt || echo "⚠️  لم يتم العثور على رموز susfs"
            nm out/vmlinux > nm-full.txt
            echo "✅ تم إنشاء ملفات التحليل"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi

    # 8️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        echo "📦 تعبئة AnyKernel3..."
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        
        # إضافة dtbo.img إذا كان موجوداً
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        
        cd AK3
        zip -r9 ../Kernel-violet-zycromerz.zip *
        echo "✅ تم إنشاء Kernel-violet-zycromerz.zip"

    # 9️⃣ Sign ZIP
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ملف ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar \
          Kernel-violet-zycromerz.zip \
          Kernel-violet-zycromerz-signed.zip
        echo "✅ تم التوقيع: Kernel-violet-zycromerz-signed.zip"

    # 🔟 رفع ملف ZIP لوحده
    - name: Upload Kernel ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZIP-zycromerz
        path: |
          Kernel-violet-zycromerz-signed.zip

    # 1️⃣1️⃣ رفع اللوغات والتحليلات مع بعض
    - name: Upload Logs and Analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs-Analysis-zycromerz
        path: |
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
