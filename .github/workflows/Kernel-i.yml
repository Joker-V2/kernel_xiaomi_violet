name: Build Kernel (violet | zycromerz-clang) - Optimized


on:
  workflow_dispatch:
  push:
    branches:
      - test7

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: test7
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd

    # 3️⃣ Zycromerz Clang - مع جميع الأدوات
    - name: Setup Zycromerz Clang
      run: |
        echo "📥 تحميل Zycromerz Clang..."
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260129-release/Clang-23.0.0git-20260129.tar.gz
        
        echo "📦 فك الضغط..."
        tar -xf Clang-23.0.0git-20260129.tar.gz
        
        CLANG_PATH="$PWD/bin"
        
        # 💾 جميع الأدوات في 5 أسطر
        echo "CC=$CLANG_PATH/clang-23" >> $GITHUB_ENV
        [ -s "$CLANG_PATH/llvm-ar" ] && echo "AR=$CLANG_PATH/llvm-ar" >> $GITHUB_ENV
        [ -s "$CLANG_PATH/llvm-nm" ] && echo "NM=$CLANG_PATH/llvm-nm" >> $GITHUB_ENV
        [ -s "$CLANG_PATH/llvm-objcopy" ] && echo "OBJCOPY=$CLANG_PATH/llvm-objcopy" >> $GITHUB_ENV
        [ -s "$CLANG_PATH/llvm-objdump" ] && echo "OBJDUMP=$CLANG_PATH/llvm-objdump" >> $GITHUB_ENV
        [ -s "$CLANG_PATH/llvm-strip" ] && echo "STRIP=$CLANG_PATH/llvm-strip" >> $GITHUB_ENV
        
        echo "CROSS_COMPILE=$CLANG_PATH/aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=$CLANG_PATH/arm-linux-gnueabi-" >> $GITHUB_ENV
        
        echo "$CLANG_PATH" >> $GITHUB_PATH
        echo "✅ Zycromerz Clang جاهز!"

    # 4️⃣ Export env
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "CCACHE_UNBUFFERED=1" >> $GITHUB_ENV

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ Build kernel - مع حل Broken Pipe
    - name: Build kernel
      shell: bash
      env:
        CC: ${{ env.CC }}
        AR: ${{ env.AR }}
        NM: ${{ env.NM }}
        OBJCOPY: ${{ env.OBJCOPY }}
        OBJDUMP: ${{ env.OBJDUMP }}
        STRIP: ${{ env.STRIP }}
        CROSS_COMPILE: ${{ env.CROSS_COMPILE }}
        CROSS_COMPILE_ARM32: ${{ env.CROSS_COMPILE_ARM32 }}
        CCACHE_UNBUFFERED: 1
      run: |
        set -o pipefail
        mkdir -p logs
        ccache -M 1G
        ccache -z
        
        # زيادة limits لتجنب pipe broken
        ulimit -n 4096
        ulimit -u 4096
        
        echo "🚀 بدء بناء النواة..."
        echo "🔧 CC: $CC"
        
        # اختبار المترجم
        $CC --version | head -1
        
        # ⭐ البناء مع حل شامل لـ Broken Pipe
        stdbuf -oL -eL make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          CC="ccache $CC" \
          AR="$AR" \
          NM="$NM" \
          OBJCOPY="$OBJCOPY" \
          OBJDUMP="$OBJDUMP" \
          STRIP="$STRIP" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          LLVM=1 \
          LLVM_IAS=1 \
          V=0 2>&1 | \
          stdbuf -oL -eL tee logs/build.log || {
            echo "❌ فشل البناء!"
            echo "📄 آخر 50 سطر من اللوغ:"
            tail -50 logs/build.log
            exit 1
          }
        
        echo ""
        echo "📊 إحصائيات ccache:"
        ccache -s
        
        echo ""
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            SIZE=$(stat -c%s "out/arch/arm64/boot/Image.gz")
            SIZE_MB=$((SIZE / 1024 / 1024))
            echo "✅ تم بناء النواة بنجاح!"
            echo "📦 حجم Image.gz: ${SIZE_MB} MB"
        else
            echo "❌ فشل بناء النواة!"
            echo "📄 التحقق من الملفات الموجودة:"
            ls -lh out/arch/arm64/boot/ || echo "المجلد غير موجود"
            exit 1
        fi

    # 7️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل الرموز..."
        if [ -f "out/vmlinux" ]; then
            echo "📊 تحليل رموز KSU..."
            nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || echo "⚠️  لم يتم العثور على رموز KSU"
            KSU_COUNT=$(wc -l < nm-ksu.txt)
            echo "   وُجد $KSU_COUNT رمز KSU"
            
            echo "📊 تحليل رموز susfs..."
            nm out/vmlinux | grep -i susfs > nm-susfs.txt || echo "⚠️  لم يتم العثور على رموز susfs"
            SUSFS_COUNT=$(wc -l < nm-susfs.txt)
            echo "   وُجد $SUSFS_COUNT رمز susfs"
            
            echo "📊 إنشاء قائمة الرموز الكاملة..."
            nm out/vmlinux > nm-full.txt
            TOTAL_COUNT=$(wc -l < nm-full.txt)
            echo "   إجمالي الرموز: $TOTAL_COUNT"
            
            echo "✅ تم إنشاء ملفات التحليل"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi

    # 8️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        echo "📦 تعبئة AnyKernel3..."
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        
        # نسخ Image.gz
        cp out/arch/arm64/boot/Image.gz AK3/
        echo "✅ تم نسخ Image.gz"
        
        # نسخ dtbo إن وُجد
        if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            cp out/arch/arm64/boot/dtbo.img AK3/
            echo "✅ تم نسخ dtbo.img"
        else
            echo "⚠️  dtbo.img غير موجود"
        fi
        
        # إضافة معلومات البناء
        cd AK3
        cat > build-info.txt << EOF
════════════════════════════════════════
    Kernel Build Information
════════════════════════════════════════
Builder: GitHub Actions
Date: $(date '+%Y-%m-%d %H:%M:%S UTC')
Compiler: Zycromerz Clang 23.0.0
Device: Xiaomi Redmi Note 7 Pro (violet)
Android: 10-13
KernelSU: v3.0.0 (32942)
════════════════════════════════════════
EOF
        
        # إنشاء ZIP
        zip -r9 ../Kernel-violet-zycromerz.zip * -x .git\* -x .github\*
        cd ..
        
        ZIP_SIZE=$(stat -c%s "Kernel-violet-zycromerz.zip")
        ZIP_SIZE_MB=$((ZIP_SIZE / 1024 / 1024))
        echo "✅ تم إنشاء Kernel-violet-zycromerz.zip (${ZIP_SIZE_MB} MB)"

    # 9️⃣ Sign ZIP
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ملف ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        
        java -jar zipsigner.jar \
          Kernel-violet-zycromerz.zip \
          Kernel-violet-zycromerz-signed.zip
        
        SIGNED_SIZE=$(stat -c%s "Kernel-violet-zycromerz-signed.zip")
        SIGNED_SIZE_MB=$((SIGNED_SIZE / 1024 / 1024))
        echo "✅ تم التوقيع: Kernel-violet-zycromerz-signed.zip (${SIGNED_SIZE_MB} MB)"

    # 🔟 Generate Build Report
    - name: Generate Build Report
      if: always()
      run: |
        cat > build-report.txt << 'EOF'
════════════════════════════════════════════════════════
            🎉 KERNEL BUILD REPORT 🎉
════════════════════════════════════════════════════════

📅 Build Information:
────────────────────────────────────────────────────────
Date: $(date '+%Y-%m-%d %H:%M:%S UTC')
Builder: GitHub Actions
Workflow: ${{ github.workflow }}
Run Number: ${{ github.run_number }}

📱 Device Information:
────────────────────────────────────────────────────────
Device: Xiaomi Redmi Note 7 Pro (violet)
Codename: violet
SoC: Snapdragon 675 (SM6150)
Android: 10-13

🔧 Compiler Information:
────────────────────────────────────────────────────────
Compiler: Zycromerz Clang 23.0.0git-20260129
LLVM: Enabled (LLVM=1, LLVM_IAS=1)
ccache: Enabled

🔐 Features:
────────────────────────────────────────────────────────
✅ KernelSU-Next v3.0.0 (32942)
✅ WireGuard Support
✅ Manual Hook Mode
✅ SELinux Patched

📦 Output Files:
────────────────────────────────────────────────────────
EOF
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            SIZE=$(stat -c%s "out/arch/arm64/boot/Image.gz")
            SIZE_MB=$((SIZE / 1024 / 1024))
            echo "✅ Image.gz - ${SIZE_MB} MB" >> build-report.txt
        fi
        
        if [ -f "Kernel-violet-zycromerz-signed.zip" ]; then
            SIZE=$(stat -c%s "Kernel-violet-zycromerz-signed.zip")
            SIZE_MB=$((SIZE / 1024 / 1024))
            echo "✅ Kernel ZIP (Signed) - ${SIZE_MB} MB" >> build-report.txt
        fi
        
        if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            SIZE=$(stat -c%s "out/arch/arm64/boot/dtbo.img")
            SIZE_KB=$((SIZE / 1024))
            echo "✅ dtbo.img - ${SIZE_KB} KB" >> build-report.txt
        fi
        
        cat >> build-report.txt << 'EOF'

📊 Build Statistics:
────────────────────────────────────────────────────────
EOF
        
        if [ -f "logs/build.log" ]; then
            TOTAL_LINES=$(wc -l < logs/build.log)
            WARNINGS=$(grep -i "warning" logs/build.log | wc -l || echo "0")
            echo "Total Log Lines: $TOTAL_LINES" >> build-report.txt
            echo "Warnings: $WARNINGS" >> build-report.txt
        fi
        
        if [ -f "nm-ksu.txt" ]; then
            KSU_SYMBOLS=$(wc -l < nm-ksu.txt)
            echo "KSU Symbols: $KSU_SYMBOLS" >> build-report.txt
        fi
        
        cat >> build-report.txt << 'EOF'

════════════════════════════════════════════════════════
            ✅ BUILD COMPLETED SUCCESSFULLY ✅
════════════════════════════════════════════════════════
EOF
        
        cat build-report.txt
        echo ""
        echo "📄 التقرير محفوظ في build-report.txt"

    # 1️⃣1️⃣ Upload Kernel ZIP
    - name: Upload Kernel ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZIP-zycromerz
        path: Kernel-violet-zycromerz-signed.zip

    # 1️⃣2️⃣ Upload Logs and Analysis
    - name: Upload Logs and Analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs-Analysis-zycromerz
        path: |
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
          build-report.txt
          AK3/build-info.txt

    # 1️⃣3️⃣ Upload Raw Kernel Image
    - name: Upload Raw Kernel Image
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image-Raw
        path: |
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/dtbo.img
