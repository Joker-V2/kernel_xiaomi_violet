name: Build Kernel (violet | KernelSu-Next-legacy | susfs-V2.0.0)

on:
  workflow_dispatch:
  push:
    branches:
      - test6

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: test6
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd

    # 3️⃣ Neutron Clang - مختصر
    - name: Setup Neutron Clang
      run: |
        wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
        tar -I zstd -xf neutron-clang-10032024.tar.zst
        echo "$PWD/bin" >> $GITHUB_PATH
        echo "CC=$PWD/bin/clang-19" >> $GITHUB_ENV
        echo "AR=$PWD/bin/llvm-ar" >> $GITHUB_ENV
        echo "NM=$PWD/bin/llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=$PWD/bin/llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=$PWD/bin/llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=$PWD/bin/llvm-strip" >> $GITHUB_ENV
        

    # 4️⃣ Export env 
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        
        # عرض المتغيرات - الآن CLANG معرف
        echo "🎯 متغيرات البناء:"
        echo "CC=${{ env.CC }}"
        echo "AR=${{ env.AR }}"
        echo "nm=${{ env.NM }}"

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ Build kernel - 
    - name: Build kernel
      shell: bash
      env:
        CC: ${{ env.CC }}
        AR: ${{ env.AR }}
        NM: ${{ env.NM }}
        OBJCOPY: ${{ env.OBJCOPY }}
        OBJDUMP: ${{ env.OBJDUMP }}
        STRIP: ${{ env.STRIP }}
      run: |
        set -o pipefail
        mkdir -p logs
        ccache -M 1G
        ccache -z
        
        echo "🚀 بدء بناء النواة..."
        echo "🔧 CC: $CC"
        echo "🔧 AR: $AR"
        echo "🔧 NM: $NM"
        
        # اختبار
        echo "🧪 اختبار المترجم..."
        $CC --version
        
        # its okeay new
        stdbuf -oL -eL make O=out -j$(nproc) \
          CC="ccache $CC" \
          AR="$AR" \
          NM="$NM" \
          OBJCOPY="$OBJCOPY" \
          OBJDUMP="$OBJDUMP" \
          STRIP="$STRIP" \
          2>&1 | tee logs/build.log
        
        ccache -s
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ تم بناء النواة بنجاح!"
        else
            echo "❌ فشل بناء النواة!"
            exit 1
        fi

    # 7️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل الرموز..."
        if [ -f "out/vmlinux" ]; then
            nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || echo "⚠️  لم يتم العثور على رموز KSU"
            nm out/vmlinux | grep -i susfs > nm-susfs.txt || echo "⚠️  لم يتم العثور على رموز susfs"
            nm out/vmlinux > nm-full.txt
            echo "✅ تم إنشاء ملفات التحليل"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi
    # 8️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        echo "📦 تعبئة AnyKernel3..."
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        
        # إضافة dtbo.img إذا كان موجوداً
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        
        cd AK3
        zip -r9 ../Kernel-violet-neutron.zip *
        echo "✅ تم إنشاء Kernel-violet-neutron.zip"
    # 9️⃣ Sign ZIP
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ملف ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar \
          Kernel-violet-neutron.zip \
          Kernel-violet-neutron-signed.zip
        echo "✅ تم التوقيع: Kernel-violet-neutron-signed.zip"
    # 🔟 رفع ملف ZIP لوحده
    - name: Upload Kernel ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZIP
        path: |
          Kernel-violet-neutron-signed.zip
    # 1️⃣1️⃣ رفع اللوغات والتحليلات مع بعض
    - name: Upload Logs and Analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs-Analysis
        path: |
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
