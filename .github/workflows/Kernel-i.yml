name: Build Kernel (violet | SukiSU builtin + mini-scope + SUSFS 1.5.12)

on:
  workflow_dispatch:
  push:
    branches:
      - test5

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: test5
        fetch-depth: 1

    # 2️⃣ Dependencies + ccache
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache

    # 3️⃣ ZyC Clang 22
    - name: Setup ZyC Clang 22
      run: |
        mkdir clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260118-release/Clang-23.0.0git-20260118.tar.gz
        tar -xf Clang-23.0.0git-20260118.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH
        clang --version

    # 🔟 Build environment
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=0" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 1️⃣1️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 1️⃣2️⃣ Build kernel (SAFE + visible log)
    - name: Build kernel
      shell: bash
      run: |
        mkdir -p logs
        ccache -M 2G
        ccache -z

        stdbuf -oL -eL make O=out -j2 \
          CC="ccache clang" \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=0 \
          2>&1 | tee logs/build.log

        ccache -s

    # 1️⃣3️⃣ Verify hooks
    - name: Verify hooks.o
      run: |
        grep -E "hooks\.o" logs/build.log > hooks-build.txt || true

    # 1️⃣4️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || true
        nm out/vmlinux | grep -i susfs > nm-susfs.txt || true
        nm out/vmlinux > nm-full.txt

    # 1️⃣4.1️⃣ Verify all IDR/IDA symbols (old + new) + create log
    - name: Verify all IDR/IDA symbols
      shell: bash
      run: |
        SYMBOLS=(
          idr_get_next
          idr_get_next_ext
          idr_get_next_ul
          idr_replace
          idr_replace_ext
          idr_destroy
          idr_alloc
          idr_alloc_ext
          idr_alloc_u32
          idr_alloc_cyclic
          idr_for_each
          idr_find
          idr_find_ext
          idr_remove
          idr_remove_ext
          idr_init
          idr_is_empty
          ida_alloc
          ida_alloc_min
          ida_alloc_max
          ida_alloc_range
          ida_free
          ida_pre_get
          ida_get_new
          ida_get_new_above
          ida_simple_get
          ida_simple_remove
          ida_destroy
          ida_is_empty
        )

        LOG_FILE="logs/idr_ida_symbols.log"
        echo "IDR/IDA symbols verification:" > $LOG_FILE

        for sym in "${SYMBOLS[@]}"; do
          if nm out/vmlinux | grep -wq "$sym"; then
            echo "✅ $sym is present" >> $LOG_FILE
          else
            echo "❌ $sym NOT found" >> $LOG_FILE
          fi
        done

    # 1️⃣5️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../Kernel-violet-sukisu.zip *

    # 1️⃣6️⃣ Sign ZIP
    - name: Sign zip
      run: |
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar \
          Kernel-violet-sukisu.zip \
          Kernel-violet-sukisu-signed.zip

    # 1️⃣7️⃣ Upload artifacts
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-debug
        path: |
          Kernel-violet-sukisu-signed.zip
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
          hooks-build.txt
          logs/idr_ida_symbols.log
