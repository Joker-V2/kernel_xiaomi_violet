name: Build Kernel (violet | KernelSu-Next-legacy | susfs-V2.0.0)

on:
  workflow_dispatch:
  push:
    branches:
      - test6

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: test6
        fetch-depth: 1

    # 2️⃣ Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          zip unzip curl wget git \
          python3 \
          openjdk-17-jre-headless \
          ccache \
          zstd

    # 3️⃣ Neutron Clang - بنفس مبدأ bash script
    - name: Setup Neutron Clang
      run: |
        # تحميل Neutron (مباشر من الرابط الذي أعطيته)
        echo "⬇️ تحميل Neutron Clang..."
        wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
        
        # فك الضغط
        echo "📦 فك الضغط..."
        tar -I zstd -xf neutron-clang-10032024.tar.zst
        
        # ⚠️ تحديد المسارات بنفس مبدأ bash script
        NEUTRON_PATH="$PWD"
        CLANG_PATH="$NEUTRON_PATH/bin"
        
        # ⚠️ التحقق من الملفات (مثل bash script)
        echo "🔍 التحقق من أدوات LLVM..."
        ls -la $CLANG_PATH/clang* $CLANG_PATH/ld.lld 2>/dev/null | head -10
        
        # ⚠️ حفظ المتغيرات بنفس أسماء bash script
        echo "NEUTRON_PATH=$NEUTRON_PATH" >> $GITHUB_ENV
        echo "CLANG_PATH=$CLANG_PATH" >> $GITHUB_ENV
        echo "CLANG=$CLANG_BIN" >> $GITHUB_ENV
        echo "LD=$CLANG_PATH/ld.lld" >> $GITHUB_ENV
        echo "AR=$CLANG_PATH/llvm-ar" >> $GITHUB_ENV
        echo "NM=$CLANG_PATH/llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=$CLANG_PATH/llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=$CLANG_PATH/llvm-objdump" >> $GITHUB_ENV
        echo "STRIP=$CLANG_PATH/llvm-strip" >> $GITHUB_ENV
        
        # إضافة إلى PATH (مثل bash script)
        echo "$CLANG_PATH" >> $GITHUB_PATH
        
        echo "✅ Neutron Clang جاهز"
        echo "📁 CLANG_PATH: $CLANG_PATH"
        $CLANG_BIN --version | head -3

    # 🔟 Build environment - بنفس إعدادات bash script
    - name: Export env
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

    # 1️⃣1️⃣ Defconfig - باستخدام المتغيرات الجديدة
    - name: Load defconfig
      env:
        CLANG: ${{ env.CLANG }}
        LD: ${{ env.LD }}
        AR: ${{ env.AR }}
        NM: ${{ env.NM }}
        OBJCOPY: ${{ env.OBJCOPY }}
        OBJDUMP: ${{ env.OBJDUMP }}
        STRIP: ${{ env.STRIP }}
      run: |
        echo "🎯 تحميل الإعدادات باستخدام:"
        echo "   CC=$CLANG"
        echo "   LD=$LD"
        
        make CC="$CLANG" \
             LD="$LD" \
             AR="$AR" \
             NM="$NM" \
             OBJCOPY="$OBJCOPY" \
             OBJDUMP="$OBJDUMP" \
             STRIP="$STRIP" \
             O=out \
             vendor/violet-perf_defconfig

    # 1️⃣2️⃣ Build kernel - تطابق كامل مع bash script
    - name: Build kernel
      shell: bash
      env:
        CLANG: ${{ env.CLANG }}
        LD: ${{ env.LD }}
        AR: ${{ env.AR }}
        NM: ${{ env.NM }}
        OBJCOPY: ${{ env.OBJCOPY }}
        OBJDUMP: ${{ env.OBJDUMP }}
        STRIP: ${{ env.STRIP }}
      run: |
        set -o pipefail
        mkdir -p logs
        ccache -M 1G
        ccache -z
        
        echo "🚀 بدء البناء - نفس مبدأ bash script"
        echo "🔧 CC: $CLANG"
        echo "🔗 LD: $LD"
        
        # ⚠️ نفس صيغة bash script بالضبط
        stdbuf -oL -eL make O=out -j$(nproc) \
          CC="ccache $CLANG" \
          LD="$LD" \
          AR="$AR" \
          NM="$NM" \
          OBJCOPY="$OBJCOPY" \
          OBJDUMP="$OBJDUMP" \
          STRIP="$STRIP" \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          2>&1 | tee logs/build.log

        ccache -s

    # 1️⃣4️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || true
        nm out/vmlinux | grep -i susfs > nm-susfs.txt || true
        nm out/vmlinux > nm-full.txt

    # 1️⃣5️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        cp out/arch/arm64/boot/dtbo.img AK3/
        cd AK3
        zip -r9 ../Kernel-violet-sukisu.zip *

    # 1️⃣6️⃣ Sign ZIP
    - name: Sign zip
      run: |
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar \
          Kernel-violet-sukisu.zip \
          Kernel-violet-sukisu-signed.zip

    # 1️⃣7️⃣ Upload artifacts
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-debug
        path: |
          Kernel-violet-sukisu-signed.zip
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
          hooks-build.txt
