name: Build Kernel (Final Verified)

on:
  workflow_dispatch:
  push:
    branches:
      - test7

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4

    # 2️⃣ Install GCC tools
    - name: Install GCC tools
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          zip unzip curl wget git \
          python3 \
          ccache \
          zstd
        
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 3️⃣ ✅ Setup AOSP Clang - تصحيح المسار
    - name: Setup AOSP Clang
      run: |
        echo "📥 تحميل AOSP Clang..."
        wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-platform-15.0.0_r13/clang-r522817.tar.gz" -O aosp-clang.tar.gz
        
        echo "📦 فك الضغط في مجلد منفصل..."
        mkdir -p aosp-clang
        tar -xf aosp-clang.tar.gz -C aosp-clang
        
        echo "📍 المسار: $PWD/aosp-clang/bin"
        echo "🔧 إضافة إلى PATH..."
        echo "$PWD/aosp-clang/bin" >> $GITHUB_PATH
        
        # التحقق
        echo "✅ الملفات في bin/:"
        ls -la $PWD/aosp-clang/bin/ | grep clang | head -5

    # 4️⃣ Export environment
    - name: Export environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

    # 5️⃣ Clang
    - name: Load clang
      run: |
        echo "🔧 استخدام AOSP Clang (clang-18)..."
        
        make \
          O=out \
          clean \
          mrproper \
          CC=clang-18 \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          READELF=llvm-readelf \
          OBJSIZE=llvm-size \
          STRIP=llvm-strip \
          HOSTCC=clang-18 \
          HOSTCXX=clang++ \

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 6️⃣ Build
    - name: Build kernel
      shell: bash
      env:
        CC: clang-18
        AR: llvm-ar
        NM: llvm-nm
        STRIP: llvm-strip
        HOSTCC: clang-18
        HOSTCXX: clang++
        CLANG_TRIPLE: aarch64-linux-gnu-
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      run: |
        echo "🚀 البناء مع:"
        echo "CC: $(which clang-18)"
        echo "CLANG_TRIPLE: $CLANG_TRIPLE"
        
        make \
          O=out \
          CC="$CC" \
          AR="$AR" \
          NM="$NM" \
          STRIP="$STRIP" \
          HOSTCC="$HOSTCC" \
          HOSTCXX="$HOSTCXX" \
          CLANG_TRIPLE="$CLANG_TRIPLE" \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          LLVM=1 \
          LLVM_IAS=1 \
          -j$(nproc) \
          2>&1 | tee logs/build.log
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ ✅ ✅ النواة مبنية!"
        else
            echo "❌ فشل البناء"
            exit 1
        fi

    # 7️⃣ Symbol analysis
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل الرموز..."
        if [ -f "out/vmlinux" ]; then
            nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || echo "⚠️  لم يتم العثور على رموز KSU"
            nm out/vmlinux | grep -i susfs > nm-susfs.txt || echo "⚠️  لم يتم العثور على رموز susfs"
            nm out/vmlinux > nm-full.txt
            echo "✅ تم إنشاء ملفات التحليل"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi
    # 8️⃣ AnyKernel3
    - name: Package AnyKernel3
      run: |
        echo "📦 تعبئة AnyKernel3..."
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        
        # إضافة dtbo.img إذا كان موجوداً
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        
        cd AK3
        zip -r9 ../Kernel-violet-neutron.zip *
        echo "✅ تم إنشاء Kernel-violet-neutron.zip"
    # 9️⃣ Sign ZIP
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ملف ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        java -jar zipsigner.jar \
          Kernel-violet-neutron.zip \
          Kernel-violet-neutron-signed.zip
        echo "✅ تم التوقيع: Kernel-violet-neutron-signed.zip"
    # 🔟 رفع ملف ZIP لوحده
    - name: Upload Kernel ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZIP
        path: |
          Kernel-violet-neutron-signed.zip
    # 1️⃣1️⃣ رفع اللوغات والتحليلات مع بعض
    - name: Upload Logs and Analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs-Analysis
        path: |
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
