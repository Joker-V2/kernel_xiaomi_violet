name: Build Kernel (Final Verified)

on:
  workflow_dispatch:
  push:
    branches:
      - test7

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    # 1️⃣ Checkout
    - name: Checkout source
      uses: actions/checkout@v4

    # 2️⃣ Install tools
    - name: Install GCC tools
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu \
          zip unzip curl wget git \
          python3 \
          ccache \
          zstd \
          openjdk-17-jre-headless  # ✅ مطلوب لتوقيع ZIP
        
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 3️⃣ Setup AOSP Clang
    - name: Setup AOSP Clang
      run: |
        wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-platform-15.0.0_r13/clang-r522817.tar.gz" -O aosp-clang.tar.gz
        mkdir -p aosp-clang
        tar -xf aosp-clang.tar.gz -C aosp-clang
        
        # إضافة المسار إلى PATH
        echo "$PWD/aosp-clang/bin" >> $GITHUB_PATH
        
        # التحقق
        echo "✅ الملفات في bin/:"
        ls -la $PWD/aosp-clang/bin/ | grep clang | head -5

    # 4️⃣ Export environment
    - name: Export environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

    # 5️⃣ Defconfig
    - name: Load defconfig
      run: |
        echo "🔧 استخدام AOSP Clang (clang-18)..."
        
        make \
          O=out \
          clean \
          mrproper \
          CC=clang-18 \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          READELF=llvm-readelf \
          OBJSIZE=llvm-size \
          STRIP=llvm-strip \
          HOSTCC=clang-18 \
          HOSTCXX=clang++ \
          vendor/violet-perf_defconfig

    # 6️⃣ Build
    - name: Build kernel
      shell: bash
      env:
        CC: clang-18
        AR: llvm-ar
        NM: llvm-nm
        STRIP: llvm-strip
        HOSTCC: clang-18
        HOSTCXX: clang++
        CLANG_TRIPLE: aarch64-linux-gnu-
        CROSS_COMPILE: aarch64-linux-gnu-
        CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      run: |
        echo "🚀 البناء مع:"
        echo "CC: $(which clang-18)"
        echo "CLANG_TRIPLE: $CLANG_TRIPLE"
        
        # إنشاء مجلد اللوغات
        mkdir -p logs
        
        make \
          O=out \
          CC="$CC" \
          AR="$AR" \
          NM="$NM" \
          STRIP="$STRIP" \
          HOSTCC="$HOSTCC" \
          HOSTCXX="$HOSTCXX" \
          CLANG_TRIPLE="$CLANG_TRIPLE" \
          CROSS_COMPILE="$CROSS_COMPILE" \
          CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
          LLVM=1 \
          LLVM_IAS=1 \
          -j$(nproc) \
          Image.gz 2>&1 | tee logs/build.log
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ ✅ ✅ النواة مبنية!"
        else
            echo "❌ فشل البناء"
            exit 1
        fi

    # 7️⃣ Symbol analysis (مثل المثال) ✅
    - name: Symbol analysis
      run: |
        echo "🔍 تحليل الرموز..."
        if [ -f "out/vmlinux" ]; then
            # البحث عن رموز KernelSU
            nm out/vmlinux | grep -E "ksu_|kernelsu" > nm-ksu.txt || echo "⚠️  لم يتم العثور على رموز KSU"
            
            # البحث عن رموز أخرى مهمة
            nm out/vmlinux | grep -i "susfs" > nm-susfs.txt || echo "⚠️  لم يتم العثور على رموز susfs"
            
            # ملف كامل بالرموز
            nm out/vmlinux > nm-full.txt
            
            echo "📊 نتيجة التحليل:"
            echo "رموز KernelSU: $(wc -l < nm-ksu.txt)"
            echo "رموز susfs: $(wc -l < nm-susfs.txt)"
            echo "✅ تم إنشاء ملفات التحليل"
        else
            echo "❌ ملف vmlinux غير موجود"
        fi

    # 8️⃣ Packaging
    - name: Package Kernel
      run: |
        echo "📦 تجهيز الحزمة..."
        git clone --depth=1 https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        
        # إضافة dtbo.img إذا كان موجوداً
        [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AK3/
        
        cd AK3
        zip -r9 ../kernel-violet-aosp.zip *
        echo "✅ تم إنشاء kernel-violet-aosp.zip"

    # 9️⃣ Sign ZIP (مثل المثال) ✅
    - name: Sign zip
      run: |
        echo "🖊️ توقيع ملف ZIP..."
        wget -q -O zipsigner.jar https://github.com/Magisk-Modules-Repo/zipsigner/raw/master/bin/zipsigner-3.0-dexed.jar
        
        # التحقق من وجود الملف للتوقيع
        if [ -f "kernel-violet-aosp.zip" ]; then
            java -jar zipsigner.jar \
              kernel-violet-aosp.zip \
              kernel-violet-aosp-signed.zip
            
            echo "✅ تم التوقيع:"
            ls -lh kernel-violet-aosp*.zip
        else
            echo "❌ ملف ZIP غير موجود للتوقيع"
            exit 1
        fi

    # 🔟 رفع ملف ZIP لوحده (مثل المثال) ✅
    - name: Upload Kernel ZIP
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-ZIP
        path: |
          kernel-violet-aosp-signed.zip
        retention-days: 7

    # 1️⃣1️⃣ رفع اللوغات والتحليلات مع بعض (مثل المثال) ✅
    - name: Upload Logs and Analysis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs-Analysis
        path: |
          logs/build.log
          nm-ksu.txt
          nm-susfs.txt
          nm-full.txt
        retention-days: 7
