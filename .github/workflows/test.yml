name: Build Kernel (violet | SukiSU Ultra + jeejox + susfs2)

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout kernel source
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: test
        fetch-depth: 1

    # 2️⃣ Install dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git bc bison flex libssl-dev \
          make zip unzip curl wget \
          libelf-dev libncurses-dev \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          python3 \
          openjdk-17-jre-headless

    # 3️⃣ Setup ZyCromerZ Clang
    - name: Setup Clang
      run: |
        mkdir -p clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -xzf Clang-15.0.7-20251111.tar.gz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    # 4️⃣ Inject SukiSU Ultra
    - name: Inject SukiSU Ultra (builtin)
      run: |
        set -e
        curl -LSs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s builtin

    # 5️⃣ Apply jeejox patches
    - name: Apply KernelSU non-GKI individual patches
      run: |
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0001-fs-exec-add-ksu-execveat-hook.patch | patch -p1 || true
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0002-fs-open-add-ksu-faccessat-hook.patch | patch -p1 || true
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0003-fs-read_write-add-ksu-vfs_read-hook.patch | patch -p1 || true
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0004-fs-stat-add-ksu-vfs_statx-hook.patch | patch -p1 || true
        curl -L https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0005-drivers-input-input-add-ksu-input_handle_event-hook.patch | patch -p1 || true
        curl -fsSL https://raw.githubusercontent.com/jonjeexe/KernelSU_Patches/non-GKI/0006-fs-namespace-add-path-umount-hook.patch | patch -p1 || true

    # ==================================================
    # 🔥 SUSFS 2.0 — SAFE / NON-BLOCKING / AUDIT MODE 🔥
    # ==================================================

    # 6️⃣ Pre-check (info only)
    - name: Pre-check susfs (info only)
      run: |
        if grep -R "susfs_handle_execve" fs/ include/ >/dev/null 2>&1; then
          echo "⚠️ susfs symbols already present (partial or previous apply)"
        else
          echo "✅ susfs not detected yet"
        fi

    # 7️⃣ Apply susfs 2.0 patch (ALLOW PARTIAL APPLY)
    - name: Apply susfs 2.0 patch (non-blocking)
      run: |
        set +e
        curl -fsSL https://raw.githubusercontent.com/TheSillyOk/kernel_ls_patches/master/susfs-2.0.0.patch \
          | patch -p1 --batch --forward
        echo "ℹ️ susfs patch command finished (errors allowed)"
        set -e

    # 8️⃣ Verify REQUIRED files (hard requirement)
    - name: Verify susfs core files
      run: |
        test -f fs/susfs.c || (echo "❌ fs/susfs.c missing" && exit 1)
        test -f include/linux/susfs.h || (echo "❌ susfs.h missing" && exit 1)
        test -f include/linux/susfs_def.h || (echo "❌ susfs_def.h missing" && exit 1)
        echo "✅ susfs core files present"

    # 9️⃣ Verify exec hook (hard requirement)
    - name: Verify exec hook
      run: |
        grep -R "susfs_handle_execve" fs/exec.c \
          || (echo "❌ exec.c hook missing" && exit 1)
        echo "✅ exec hook present"

    # 🔍 10️⃣ AUDIT: detect what the patch DID NOT touch
    - name: Audit susfs missing integrations (INFO)
      run: |
        echo "===== SUSFS AUDIT REPORT ====="

        echo "[avc.c]"
        grep -n "susfs" security/selinux/avc.c \
          || echo "ℹ️ avc.c not modified"

        echo "[cmdline.c]"
        grep -n "susfs" fs/proc/cmdline.c \
          || echo "ℹ️ cmdline.c not modified"

        echo "[.rej files]"
        find . -name "*.rej" -print || echo "✅ no .rej files found"

        echo "===== END AUDIT ====="

    # =========================
    # 🔧 BUILD
    # =========================

    # 1️⃣1️⃣ Export build environment
    - name: Export build environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> $GITHUB_ENV

    # 1️⃣2️⃣ Load defconfig
    - name: Load defconfig
      run: |
        make O=out vendor/violet-perf_defconfig

    # 1️⃣3️⃣ Build kernel
    - name: Build kernel
      run: |
        make O=out -j$(nproc) 2>&1 | tee build.log

    # 1️⃣4️⃣ Verify susfs linked
    - name: Verify susfs symbols
      run: |
        nm out/vmlinux | grep -q susfs_handle_execve
        echo "✅ susfs linked into vmlinux"

    # 1️⃣5️⃣ Package AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 -b sixteen https://github.com/Joker-V2/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz AK3/
        cd AK3
        zip -r9 ../Kernel-violet-sukisu-susfs2.zip *

    # 1️⃣6️⃣ Upload artifacts
    - name: Upload Kernel ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-violet-sukisu-susfs2
        path: Kernel-violet-sukisu-susfs2.zip

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
